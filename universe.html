<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AXIUM | Real-Time Celestial Engine</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/",
                "astronomy-engine": "https://cdn.jsdelivr.net/npm/astronomy-engine@2.1.19/astronomy.browser.min.js"
            }
        }
    </script>
    <style>
        body { margin: 0; background: #020202; overflow: hidden; color: #e2e8f0; font-family: 'Georgia', serif; }
        canvas { display: block; }
        .ui-overlay { pointer-events: none; position: absolute; inset: 0; display: flex; flex-direction: column; justify-content:建设; }
        .interactive { pointer-events: auto; }
        .gold-glow { text-shadow: 0 0 15px rgba(234, 179, 8, 0.4); }
    </style>
</head>
<body>

    <div class="ui-overlay p-8">
        <div class="flex justify-between items-start">
            <div>
                <h1 class="text-4xl tracking-[0.4em] uppercase font-light text-yellow-600 gold-glow">Axium</h1>
                <p class="text-[10px] tracking-[0.2em] text-slate-500 uppercase mt-2">Live Ephemeris v3.0 // Alignment Researcher Edition</p>
            </div>
            <div class="text-right interactive">
                <p id="clock" class="text-lg font-mono text-yellow-700/80 tracking-tighter"></p>
                <p class="text-[9px] text-slate-600 uppercase">Universal Time Coordinated</p>
            </div>
        </div>

        <div class="mt-auto flex justify-center pb-12">
            <div class="interactive bg-black/40 backdrop-blur-md border border-white/10 p-4 rounded-full flex gap-6 px-8 items-center shadow-2xl">
                <span class="text-[10px] text-slate-500 uppercase tracking-widest mr-2">Quick View:</span>
                <button onclick="focusBody('Sun')" class="hover:text-yellow-500 transition">☉</button>
                <button onclick="focusBody('Moon')" class="hover:text-slate-400 transition">☽</button>
                <button onclick="focusBody('Mars')" class="hover:text-red-500 transition">♂</button>
                <button onclick="focusBody('Venus')" class="hover:text-pink-400 transition">♀</button>
                <button onclick="focusBody('Jupiter')" class="hover:text-orange-400 transition">♃</button>
                <button onclick="focusBody('Saturn')" class="hover:text-yellow-200 transition">♄</button>
            </div>
        </div>
    </div>

    <div id="modal" class="hidden fixed inset-0 bg-black/90 backdrop-blur-xl z-50 flex items-center justify-center p-4" onclick="closeModal()">
        <div class="bg-zinc-950 border border-yellow-900/40 p-10 max-w-xl w-full rounded-3xl shadow-[0_0_50px_rgba(0,0,0,1)]" onclick="event.stopPropagation()">
            <div class="flex justify-between items-start mb-6">
                <div>
                    <h2 id="m-title" class="text-4xl font-light tracking-tighter uppercase text-yellow-600">Planet</h2>
                    <p id="m-sign" class="text-sm text-slate-500 tracking-widest uppercase mt-1 italic"></p>
                </div>
                <div id="m-symbol" class="text-6xl text-yellow-700/30"></div>
            </div>
            <div class="space-y-4 text-slate-300 font-sans text-base leading-relaxed">
                <p id="m-desc"></p>
                <div class="pt-6 border-t border-white/5 grid grid-cols-2 gap-4 text-[11px] font-mono text-slate-500 uppercase">
                    <div>RA: <span id="m-ra" class="text-slate-300 text-yellow-900/80"></span></div>
                    <div>DEC: <span id="m-dec" class="text-slate-300 text-yellow-900/80"></span></div>
                </div>
            </div>
            <button onclick="closeModal()" class="mt-10 w-full py-4 bg-yellow-900/10 hover:bg-yellow-900/20 border border-yellow-900/30 rounded-xl text-[10px] tracking-[0.3em] uppercase transition">Synchronize & Exit</button>
        </div>
    </div>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import * as Astronomy from 'astronomy-engine';

        // --- Data Definitions ---
        const BODIES = {
            'Sun': { symbol: '☉', color: 0xffdb4d, size: 2.5, desc: 'The Axium Centrality. Represents the core intent and the source of all alignment. In realtime, it marks the current solar focus.' },
            'Moon': { symbol: '☽', color: 0xd1d5db, size: 0.8, desc: 'The Subconscious Feedback Loop. It governs the rapid shifts in emotional data and the hidden layers of the psyche.' },
            'Mercury': { symbol: '☿', color: 0x94a3b8, size: 0.5, desc: 'The Messenger Protocol. Governs communication, data transfer, and the speed of thought.' },
            'Venus': { symbol: '♀', color: 0xfbcfe8, size: 0.9, desc: 'The Harmony Validator. Directs the aesthetic alignment and the attraction toward specific values.' },
            'Mars': { symbol: '♂', color: 0xef4444, size: 0.8, desc: 'The Activation Engine. Directs energy, drive, and the necessary friction for growth.' },
            'Jupiter': { symbol: '♃', color: 0xfdba74, size: 1.8, desc: 'The Expansion Logic. It represents the scaling of systems and the broad-spectrum wisdom of the Axium.' },
            'Saturn': { symbol: '♄', color: 0xe9d5ff, size: 1.5, desc: 'The Constraint Framework. Governs structure, boundaries, and the long-term stability of the model.' }
        };

        // --- Scene Logic ---
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 2000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        camera.position.set(0, 40, 100);

        // Ambience
        scene.add(new THREE.AmbientLight(0xffffff, 0.5));
        const sunLight = new THREE.PointLight(0xffffff, 1000, 500);
        scene.add(sunLight);

        // Celestial Sphere (Stars)
        const starGeometry = new THREE.BufferGeometry();
        const starCount = 5000;
        const starCoords = new Float32Array(starCount * 3);
        for(let i=0; i<starCount*3; i++) starCoords[i] = (Math.random() - 0.5) * 1000;
        starGeometry.setAttribute('position', new THREE.BufferAttribute(starCoords, 3));
        scene.add(new THREE.Points(starGeometry, new THREE.PointsMaterial({ color: 0x444444, size: 0.5 })));

        // Create Body Meshes
        const meshes = {};
        Object.entries(BODIES).forEach(([name, data]) => {
            const mesh = new THREE.Mesh(
                new THREE.SphereGeometry(data.size, 32, 32),
                new THREE.MeshStandardMaterial({ 
                    color: data.color, 
                    emissive: data.color, 
                    emissiveIntensity: name === 'Sun' ? 1 : 0.2 
                })
            );
            mesh.name = name;
            scene.add(mesh);
            meshes[name] = mesh;
        });

        // --- Real-Time Positioning ---
        function updatePositions() {
            const now = new Date();
            document.getElementById('clock').innerText = now.toISOString().split('T')[1].split('.')[0];
            
            const observer = new Astronomy.Observer(39.1, -94.6, 0); // Default to your region context

            Object.keys(BODIES).forEach(name => {
                const body = name === 'Sun' ? 'Sun' : (name === 'Moon' ? 'Moon' : name);
                const equat = Astronomy.Equator(body, now, observer, true, true);
                
                // Distance scaling for visual clarity (Not to astronomical scale)
                const dist = name === 'Sun' ? 0 : (20 + (Object.keys(BODIES).indexOf(name) * 10));
                
                // Convert RA/Dec to Cartesian
                // RA is in hours (0-24), Dec is in degrees (-90 to 90)
                const raRad = (equat.ra * 15) * (Math.PI / 180);
                const decRad = equat.dec * (Math.PI / 180);

                meshes[name].position.x = dist * Math.cos(decRad) * Math.cos(raRad);
                meshes[name].position.z = dist * Math.cos(decRad) * Math.sin(raRad);
                meshes[name].position.y = dist * Math.sin(decRad);

                // Store metadata for modal
                meshes[name].userData = { ra: equat.ra.toFixed(2), dec: equat.dec.toFixed(2) };
            });
        }

        // --- Interactivity ---
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();

        window.addEventListener('click', (e) => {
            mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObjects(Object.values(meshes));
            if(intersects.length > 0) openModal(intersects[0].object.name);
        });

        window.openModal = (name) => {
            const data = BODIES[name];
            const meta = meshes[name].userData;
            document.getElementById('m-title').innerText = name;
            document.getElementById('m-symbol').innerText = data.symbol;
            document.getElementById('m-desc').innerText = data.desc;
            document.getElementById('m-ra').innerText = meta.ra + 'h';
            document.getElementById('m-dec').innerText = meta.dec + '°';
            document.getElementById('modal').classList.remove('hidden');
        };

        window.closeModal = () => document.getElementById('modal').classList.add('hidden');
        window.focusBody = (name) => {
            const target = meshes[name].position;
            controls.target.copy(target);
            camera.position.set(target.x + 10, target.y + 10, target.z + 20);
        };

        // --- Loop ---
        function animate() {
            updatePositions();
            controls.update();
            renderer.render(scene, camera);
            requestAnimationFrame(animate);
        }

        animate();
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
