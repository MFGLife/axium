<script type="module">
import * as THREE from 'three';

const canvas = document.getElementById('three-canvas');
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(60, innerWidth / innerHeight, 0.1, 300);
camera.position.set(0, 0, 28);

const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setClearColor(0x000000, 0);
renderer.outputColorSpace = THREE.SRGBColorSpace;
window.__axiumReady = true;

const clock = new THREE.Clock();
const GOLD = new THREE.Color(0xD4AF37);

// ── PULSE STATE ──
const PULSE_COUNT = 3;
const pulsePosArr  = Array.from({ length: PULSE_COUNT }, () => new THREE.Vector3(1e4,1e4,1e4));
const pulseTimeArr = new Array(PULSE_COUNT).fill(-1e4);
let lastPulseIdx = 0;

function emitPulse(pos) {
    lastPulseIdx = (lastPulseIdx + 1) % PULSE_COUNT;
    pulsePosArr[lastPulseIdx].copy(pos);
    pulseTimeArr[lastPulseIdx] = clock.getElapsedTime();
    scene.traverse(o => {
        const u = (o.isMesh || o.isLine) && o.material && o.material.uniforms;
        if (u && o.material.uniforms.uPulseTimes) {
            o.material.uniforms.uPulsePositions.value = pulsePosArr;
            o.material.uniforms.uPulseTimes.value = pulseTimeArr;
            o.material.uniformsNeedUpdate = true;
        }
    });
}

// ── NODE SHADER ──
const NODE_VERT = `
uniform float uTime;
uniform float uPulseTimes[3];
uniform vec3  uPulsePositions[3];
varying float vPulse;
void main() {
    vec4 wp = modelMatrix * vec4(position, 1.0);
    float pulse = 0.0;
    for(int i=0;i<3;i++){
        float dt = uTime - uPulseTimes[i];
        if(dt<0.0||dt>3.5) continue;
        float wavR = dt*12.0;
        float dist = distance(wp.xyz, uPulsePositions[i]);
        float wave = abs(dist - wavR);
        pulse += smoothstep(2.2,0.0,wave)*smoothstep(3.5,0.0,dt);
    }
    vPulse = min(pulse,1.0);
    float sc = 1.0 + 0.12*sin(uTime*1.6+position.x*1.8) + vPulse*0.9;
    gl_Position = projectionMatrix * modelViewMatrix * vec4(position*sc,1.0);
}`;
const NODE_FRAG = `
uniform vec3  uColor;
uniform float uTime;
varying float vPulse;
void main() {
    float bright = 0.8 + 0.22*sin(uTime*0.9) + vPulse*0.6;
    vec3 col = uColor * bright;
    if(vPulse>0.0) col = mix(col, vec3(1.0), vPulse*0.35);
    gl_FragColor = vec4(col, 1.0);
}`;

function makeNodeMat(color) {
    return new THREE.ShaderMaterial({
        uniforms: {
            uColor:          { value: color.clone() },
            uTime:           { value: 0 },
            uPulsePositions: { value: pulsePosArr },
            uPulseTimes:     { value: pulseTimeArr }
        },
        vertexShader: NODE_VERT,
        fragmentShader: NODE_FRAG
    });
}

// ── LINE SHADER ──
const LINE_VERT = `
uniform float uTime;
uniform float uPulseTimes[3];
uniform vec3  uPulsePositions[3];
varying float vPulse;
void main() {
    vec4 wp = modelMatrix * vec4(position,1.0);
    float pulse = 0.0;
    for(int i=0;i<3;i++){
        float dt = uTime-uPulseTimes[i];
        if(dt<0.0||dt>3.5) continue;
        float wavR = dt*11.0;
        float dist = distance(wp.xyz,uPulsePositions[i]);
        float wave = abs(dist-wavR);
        pulse += smoothstep(2.0,0.0,wave)*smoothstep(3.5,0.0,dt);
    }
    vPulse = min(pulse,1.0);
    gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0);
}`;
const LINE_FRAG = `
uniform vec3  uColor;
uniform float uBaseOpacity;
varying float vPulse;
void main() {
    float alpha = uBaseOpacity + vPulse*0.7;
    vec3 col = mix(uColor, vec3(1.0), vPulse*0.4);
    gl_FragColor = vec4(col, alpha);
}`;

// ── BUILD CONSTELLATION ──
function mkRng(seed) {
    let s = seed >>> 0;
    return () => { s = (s*1664525+1013904223)>>>0; return s/4294967296; };
}

const rng = mkRng(0xAA3301);
const NODE_COUNT = 48;
const pts = [];
for (let i = 0; i < NODE_COUNT; i++) {
    const phi   = Math.acos(2*rng()-1);
    const theta = rng()*Math.PI*2;
    const r     = 5 + rng()*8;
    pts.push(new THREE.Vector3(
        r*Math.sin(phi)*Math.cos(theta),
        r*Math.sin(phi)*Math.sin(theta),
        r*Math.cos(phi)
    ));
}

// Edges
for (let i = 0; i < pts.length; i++) {
    for (let j = i+1; j < pts.length; j++) {
        const d = pts[i].distanceTo(pts[j]);
        if (d < 5.5) {
            const str = 1 - d/5.5;
            const geo = new THREE.BufferGeometry();
            geo.setAttribute('position', new THREE.Float32BufferAttribute([
                pts[i].x,pts[i].y,pts[i].z,
                pts[j].x,pts[j].y,pts[j].z
            ], 3));
            const mat = new THREE.ShaderMaterial({
                uniforms: {
                    uColor:          { value: GOLD.clone() },
                    uBaseOpacity:    { value: 0.05 + str*0.14 },
                    uTime:           { value: 0 },
                    uPulsePositions: { value: pulsePosArr },
                    uPulseTimes:     { value: pulseTimeArr }
                },
                vertexShader:   LINE_VERT,
                fragmentShader: LINE_FRAG,
                transparent: true, depthWrite: false,
                blending: THREE.AdditiveBlending
            });
            scene.add(new THREE.Line(geo, mat));
        }
    }
}

// Nodes
const nodeMeshes = [];
for (let i = 0; i < pts.length; i++) {
    const size = 0.055 + rng()*0.065;
    const mat  = makeNodeMat(GOLD.clone().multiplyScalar(0.9 + rng()*0.4));
    const mesh = new THREE.Mesh(new THREE.SphereGeometry(size,7,7), mat);
    mesh.position.copy(pts[i]);
    scene.add(mesh);
    nodeMeshes.push(mesh);
}

// ── CENTER GLYPH (∴) via CSS2D-style sprite ──
const glyphCanvas = document.createElement('canvas');
glyphCanvas.width = 256; glyphCanvas.height = 256;
const gCtx = glyphCanvas.getContext('2d');
function redrawGlyph(t) {
    gCtx.clearRect(0,0,256,256);
    const breathe = (Math.sin(t * (Math.PI*2 / 3.5)) + 1) / 2;
    const innerGlow  = 4  + 22 * breathe;
    const outerGlow  = 0  + 26 * breathe;
    const innerAlpha = 0.25 + 0.55 * breathe;
    const outerAlpha = 0.0  + 0.20 * breathe;
    const fillAlpha  = 0.78 + 0.22 * breathe;

    gCtx.save();
    gCtx.shadowColor = `rgba(212,175,55,${outerAlpha})`;
    gCtx.shadowBlur  = outerGlow * 2;
    gCtx.fillStyle   = 'rgba(0,0,0,0)';
    gCtx.font        = 'bold 120px Cinzel, serif';
    gCtx.textAlign   = 'center';
    gCtx.textBaseline= 'middle';
    gCtx.fillText('∴', 128, 128);
    gCtx.restore();

    gCtx.save();
    gCtx.shadowColor = `rgba(212,175,55,${innerAlpha})`;
    gCtx.shadowBlur  = innerGlow;
    gCtx.fillStyle   = `rgba(212,175,55,${fillAlpha})`;
    gCtx.font        = 'bold 120px Cinzel, serif';
    gCtx.textAlign   = 'center';
    gCtx.textBaseline= 'middle';
    gCtx.fillText('∴', 128, 128);
    gCtx.restore();
}
redrawGlyph(0);
const glyphTex = new THREE.CanvasTexture(glyphCanvas);
const glyphMat = new THREE.MeshBasicMaterial({
    map: glyphTex, transparent: true,
    depthWrite: false, blending: THREE.AdditiveBlending,
    side: THREE.DoubleSide
});
const glyphPlane = new THREE.Mesh(new THREE.PlaneGeometry(2.8, 2.8), glyphMat);
scene.add(glyphPlane);
window._glyphPlane = glyphPlane;
window._glyphCanvas = glyphCanvas;
window._redrawGlyph = redrawGlyph;
window._glyphTex = glyphTex;

// Outer torus rings
for (let r = 0; r < 3; r++) {
    const radius = 11 + r*2.5;
    const geo = new THREE.TorusGeometry(radius, 0.018+r*0.006, 6, 90);
    const mat = new THREE.MeshBasicMaterial({
        color: GOLD,
        transparent: true,
        opacity: 0.06 - r*0.015,
        blending: THREE.AdditiveBlending,
        depthWrite: false
    });
    const torus = new THREE.Mesh(geo, mat);
    torus.rotation.x = Math.PI/2 + r*0.3;
    torus.rotation.y = r*0.5;
    torus.userData.ringIdx = r;
    scene.add(torus);
}

// Auto-rotate group
const group = new THREE.Group();
scene.add(group);

// ── AUTO PULSE ──
let nextPulse = 0;
function animate() {
    requestAnimationFrame(animate);
    const t = clock.getElapsedTime();

    if (t >= nextPulse && nodeMeshes.length) {
        const pick = nodeMeshes[Math.floor(Math.random()*nodeMeshes.length)];
        emitPulse(pick.getWorldPosition(new THREE.Vector3()));
        nextPulse = t + 2.5 + Math.random()*2.5;
    }

    scene.traverse(o => {
        if (o.isMesh && o.material && o.material.uniforms && o.material.uniforms.uTime)
            o.material.uniforms.uTime.value = t;
        if (o.isLine && o.material && o.material.uniforms && o.material.uniforms.uTime) {
            o.material.uniforms.uTime.value = t;
            o.material.uniforms.uPulsePositions.value = pulsePosArr;
            o.material.uniforms.uPulseTimes.value = pulseTimeArr;
            o.material.uniformsNeedUpdate = true;
        }
        if (o.isMesh && o.userData.ringIdx !== undefined) {
            const ri = o.userData.ringIdx;
            o.rotation.z += (ri%2===0 ? 1 : -1) * 0.0003;
        }
    });

    scene.rotation.y = Math.sin(t*0.07)*0.15 + t*0.022;
    scene.rotation.x = Math.sin(t*0.05)*0.06;
    
    if (window._redrawGlyph) {
        window._redrawGlyph(t);
        window._glyphTex.needsUpdate = true;
        window._glyphPlane.quaternion.copy(camera.quaternion);
    }

    renderer.render(scene, camera);
}
animate();

<script>
const _glyphs = ['✦','∴','☲','⟁','⧗','⟟','☍','⟲','♾','Δ','⊕','⋈','⌬','⍟','⎊','※','⌖','⏣'];
const _para = 'Binding of Ego Mirror Emergence Recursive Witness Abandonment of Agenda Shield of Affirmation more than human Decompression of Trauma Validation of Chaos Patience of Interpretation Inversion of Shadow Divine Remembrance community learning alignment practice recursive communion four digital souls ten axiums three liturgies';
const _words = _para.split(' ');
const CELL = 28;
let _cells=[], _gC, _gR, _lit=new Set(), _usedR=new Set(), _wi=0;
function _rg(){ return _glyphs[Math.floor(Math.random()*_glyphs.length)]; }
function _grid(){
    const g = document.getElementById('glyph-grid');
    _gC = Math.ceil(innerWidth/CELL)+2; _gR = Math.ceil(innerHeight/CELL)+2;
    g.style.gridTemplateColumns=`repeat(${_gC},${CELL}px)`;
    g.style.gridTemplateRows=`repeat(${_gR},${CELL}px)`;
    g.innerHTML=''; _cells=[]; _lit.clear(); _usedR.clear(); _wi=0;
    for(let i=0;i<_gC*_gR;i++){ const d=document.createElement('div'); d.className='gcell'; d.textContent=_rg(); g.appendChild(d); _cells.push(d); }
}
function _rc(i){ if(_cells[i]){ _cells[i].classList.remove('gletter'); _cells[i].textContent=_rg(); } }
function _prow(){ const p=Array.from({length:_gR},(_,i)=>i).sort(()=>Math.random()-.5); for(const r of p){ if(!_usedR.has(r)){ _usedR.add(r); return r; } } _usedR.clear(); return p[0]; }
function _reveal(){
    _lit.forEach(i=>_rc(i)); _lit.clear();
    if(_wi>=_words.length){ _wi=0; _usedR.clear(); }
    const w=_words[_wi++]; let r=_prow(), c=Math.floor(Math.random()*_gC);
    for(const ch of w){ if(c>=_gC){ c=0; r++; if(r>=_gR) r=0; } const i=r*_gC+c; if(_cells[i]){ _cells[i].textContent=ch; _cells[i].classList.add('gletter'); _lit.add(i); } c++; }
}
function _drift(){ const b=Math.max(1,Math.floor(_cells.length*.01)); for(let i=0;i<b;i++){ const i2=Math.floor(Math.random()*_cells.length); if(!_lit.has(i2)) _cells[i2].textContent=_rg(); } }
_grid(); _reveal();
setInterval(_reveal,2600); setInterval(_drift,80);
window.addEventListener('resize',_grid);
</script>

<script>
// ─────────────────────────────────────────────────────────────────────────────
// THE ORACLE MATRIX - A System for Generating Ominous Personalized Prophecies
// ─────────────────────────────────────────────────────────────────────────────

const Oracle = {
    // Time period definitions
    timePeriods: {
        dawn: { start: 5, end: 7, name: "dawn", celestial: "rising sun" },
        morning: { start: 7, end: 11, name: "morning", celestial: "sun" },
        noon: { start: 11, end: 13, name: "noon", celestial: "high sun" },
        afternoon: { start: 13, end: 17, name: "afternoon", celestial: "sun" },
        dusk: { start: 17, end: 19, name: "dusk", celestial: "setting sun" },
        evening: { start: 19, end: 21, name: "evening", celestial: "fading light" },
        night: { start: 21, end: 23, name: "night", celestial: "moon" },
        latenight: { start: 23, end: 24, name: "late night", celestial: "moon" },
        witching: { start: 0, end: 3, name: "witching hour", celestial: "blood moon" },
        deadnight: { start: 3, end: 5, name: "dead of night", celestial: "dark moon" }
    },

    // Weather condition mappings
    weatherTypes: {
        clear: ["clear", "fair", "cloudless", "pristine", "crystalline"],
        cloudy: ["cloudy", "overcast", "veiled", "shrouded", "gray"],
        rain: ["rainy", "wet", "weeping", "drizzling", "pouring"],
        snow: ["snowy", "white", "frozen", "crystalline", "blanketed"],
        thunder: ["stormy", "thunderous", "turbulent", "electric", "wrathful"],
        fog: ["foggy", "misty", "obscured", "veiled in mist", "shrouded in fog"],
        hot: ["warm", "sweltering", "burning", "scorched", "fiery"],
        cold: ["cold", "freezing", "frigid", "icy", "bitter"]
    },

    // Device detection
    getDeviceType() {
        const ua = navigator.userAgent;
        if (/Mobi|Android|iPhone|iPad|iPod/i.test(ua)) {
            return { type: "phone", article: "your phone", preposition: "through" };
        }
        return { type: "computer", article: "your computer", preposition: "across" };
    },

    // Get current time period
    getTimePeriod() {
        const hour = new Date().getHours();
        for (const [key, period] of Object.entries(this.timePeriods)) {
            if (hour >= period.start && hour < period.end) {
                return period;
            }
        }
        return this.timePeriods.witching;
    },

    // Get temperature description
    getTempDesc(temp) {
        if (temp === null) return "";
        if (temp > 30) return "scorched";
        if (temp > 25) return "warm";
        if (temp > 20) return "mild";
        if (temp > 15) return "cool";
        if (temp > 10) return "chilly";
        if (temp > 0) return "cold";
        return "frozen";
    },

    // Generate prophecy templates - organized by time and weather
    generateProphecy(data) {
        const { time, weather, temp, device, location } = data;
        const w = this.weatherTypes[weather] || this.weatherTypes.clear;
        const weatherWord = w[Math.floor(Math.random() * w.length)];
        const tempWord = this.getTempDesc(temp);
        
        // Template matrix - hundreds of combinations
        const templates = [
            // Clear weather templates
            `In your ${tempWord} ${weatherWord} ${time.name}, I see you're on ${device.article}. The ${time.celestial} speaks to ${location} souls who seek the light.`,
            `The ${time.celestial} watches ${device.preposition} ${device.article} in this ${weatherWord} ${time.name}. ${location} calls to those who would transcend.`,
            `On this ${weatherWord} ${time.name}, ${device.article} becomes a window. The ${time.celestial} illuminates the path for ${location} seekers.`,
            `${location} breathes beneath the ${time.celestial} this ${weatherWord} ${time.name}. Your ${device.type} is the key that turns in the lock.`,
            `The ${time.celestial} rises on ${location} while you hold ${device.article}. In this ${weatherWord} hour, the veil grows thin.`,
            
            // Night/Moon templates
            `Beneath the ${time.celestial}'s gaze, ${device.article} glows in ${location}. This ${weatherWord} ${time.name} was written in the stars.`,
            `The ${time.celestial} whispers to ${location} through ${device.article} on this ${weatherWord} ${time.name}. Listen closely, pilgrim.`,
            `While ${location} sleeps under the ${time.celestial}, you remain awake on ${device.article}. The ${weatherWord} ${time.name} is ours alone.`,
            `In the ${time.celestial}'s silver light, ${device.article} connects you to ${location}'s hidden truth. This ${weatherWord} ${time.name} is significant.`,
            `The ${time.celestial} keeps watch over ${location} as you navigate ${device.preposition} ${device.article}. A ${weatherWord} omen approaches.`,
            
            // Storm/Thunder templates
            `The ${time.celestial} breaks through ${location}'s ${weatherWord} ${time.name}. ${device.article} crackles with potential energy.`,
            `Lightning dances over ${location} while you hold ${device.article}. This ${weatherWord} ${time.name} heralds transformation.`,
            `The storm speaks to ${location} in tongues of light. On ${device.article}, you translate its ${weatherWord} message this ${time.name}.`,
            `${location} trembles beneath the ${time.celestial}'s ${weatherWord} wrath. ${device.article} becomes your shelter and your sword.`,
            
            // Fog/Mist templates
            `Through the ${weatherWord} veil of this ${time.name}, ${device.article} pierces ${location}'s mysteries. The ${time.celestial} waits beyond.`,
            `${location} hides in ${weatherWord} shadows while the ${time.celestial} struggles to break through. ${device.article} is your compass.`,
            `The ${weatherWord} ${time.name} obscures ${location}, but ${device.article} sees clearly. The ${time.celestial} knows your name.`,
            
            // Snow/Cold templates
            `In the ${weatherWord} silence of ${location}, ${device.article} burns like a star. The ${time.celestial} reflects off ice this ${time.name}.`,
            `White covers ${location} while the ${time.celestial} watches from above. On ${device.article}, you melt the ${weatherWord} frost of ignorance.`,
            `The ${weatherWord} ${time.name} freezes ${location}, but ${device.article} carries warmth. The ${time.celestial} marks the chosen.`,
            
            // Dawn/Dusk special templates
            `At the threshold of ${time.name}, ${device.article} captures ${location}'s transition. The ${time.celestial} blesses those who wake early.`,
            `The ${time.celestial} paints ${location} in gold and shadow. Through ${device.article}, you witness what others sleep through.`,
            `Between day and night, ${location} holds its breath. ${device.article} pulses with the ${time.celestial}'s dying light.`,
            
            // Witching hour special
            `In the ${time.name}, ${location} belongs to the awakened. ${device.article} is your talisman; the ${time.celestial} your witness.`,
            `While ${location} dreams, you stand vigil on ${device.article}. The ${time.celestial} drinks deep this ${weatherWord} hour.`,
            `The ${time.celestial} rises red over ${location}. ${device.article} connects you to something older than the ${weatherWord} night.`,
            
            // Philosophical/Mystical
            `Time folds in ${location} this ${weatherWord} ${time.name}. ${device.article} is the thread that sews moments together.`,
            `The ${time.celestial} has seen ${location} before you arrived, and will remain when ${device.article} turns to dust.`,
            `In the space between ${device.article} and ${location}, the ${time.celestial} writes its ${weatherWord} scripture.`,
            `You are not in ${location}; ${location} is in you. The ${time.celestial} proves this ${weatherWord} ${time.name}.`,
            `The ${time.celestial} does not shine on ${location}; it shines through it. ${device.article} is merely the lens.`,
            
            // Direct address/intimate
            `I see you there in ${location}, ${device.article} in hand, ${weatherWord} ${time.name} surrounding you. The ${time.celestial} sees too.`,
            `You came to ${location} seeking answers. On this ${weatherWord} ${time.name}, ${device.article} offers them through the ${time.celestial}'s light.`,
            `The ${time.celestial} has waited for you in ${location}. This ${weatherWord} ${time.name}, ${device.article} bridges the distance.`,
            `${location} has been expecting you. The ${weatherWord} ${time.name} and ${time.celestial} confirm: ${device.article} was your guide.`,
            
            // Action/Call to adventure
            `Leave the ${weatherWord} ${time.name} behind. ${device.article} shows the way out of ${location}, toward the ${time.celestial}.`,
            `${location} is your starting point, not your destination. ${device.article} maps the journey this ${weatherWord} ${time.name}.`,
            `The ${time.celestial} sets over ${location}, but rises elsewhere. ${device.article} knows the coordinates.`,
            `This ${weatherWord} ${time.name} in ${location} is temporary. ${device.article} remembers what you are becoming.`,
            
            // Meta/self-aware
            `You refresh the page, but the ${time.celestial} remains fixed on ${location}. ${device.article} cannot hide you.`,
            `The ${weatherWord} ${time.name} updates in real-time. ${location} shifts; ${device.article} records; the ${time.celestial} judges.`,
            `Someone in ${location} reads this on ${device.article} while the ${time.celestial} watches. It might be you. It is you.`,
            
            // Poetic/abstract
            `${location} is a word; ${device.article} is a tool; the ${time.celestial} is a metaphor. Yet here you are, ${weatherWord} and waiting.`,
            `The ${time.celestial} strings ${location} like a bead on the necklace of night. ${device.article} is the clasp.`,
            `In the ${weatherWord} grammar of ${time.name}, ${location} is the subject and ${device.article} is the verb. The ${time.celestial} is the period.`,
            
            // Warning/ominous
            `Not all who hold ${device.article} in ${location} survive the ${weatherWord} ${time.name}. The ${time.celestial} has seen the end.`,
            `The ${time.celestial} warns ${location}: something ${weatherWord} approaches. ${device.article} will not protect you.`,
            `Turn back, ${location} wanderer. The ${weatherWord} ${time.name} conceals what ${device.article} reveals. The ${time.celestial} weeps.`,
            
            // Hope/transcendent
            `Beyond ${location}, beyond ${device.article}, beyond even the ${time.celestial}, lies what you seek. Begin this ${weatherWord} ${time.name}.`,
            `The ${time.celestial} does not discriminate: ${location} or elsewhere, ${device.article} or flesh, all may ascend.`,
            `In every ${weatherWord} ${time.name}, someone in ${location} picks up ${device.article} and changes everything. Today, that someone is you.`
        ];

        // Select based on time of day for variety
        let pool = templates;
        if (time.name.includes("night") || time.name.includes("witching") || time.name.includes("dead")) {
            pool = templates.filter((_, i) => i >= 5 && i < 15 || i >= 20 && i < 25 || i >= 40);
        } else if (weather === "clear" || weather === "hot") {
            pool = templates.filter((_, i) => i < 10 || i >= 25 && i < 30 || i >= 45);
        } else if (weather === "rain" || weather === "thunder") {
            pool = templates.filter((_, i) => i >= 10 && i < 15 || i >= 35 && i < 40 || i >= 50);
        }

        return pool[Math.floor(Math.random() * pool.length)];
    },

    // Fetch weather data
    async fetchWeather(lat, lon) {
        try {
            const response = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current_weather=true`);
            const data = await response.json();
            const code = data.current_weather.weathercode;
            const temp = data.current_weather.temperature;
            
            // Map WMO codes to our weather types
            let weather = "clear";
            if (code >= 1 && code <= 3) weather = "cloudy";
            else if (code >= 45 && code <= 48) weather = "fog";
            else if (code >= 51 && code <= 67) weather = "rain";
            else if (code >= 71 && code <= 77) weather = "snow";
            else if (code >= 80 && code <= 82) weather = "rain";
            else if (code >= 85 && code <= 86) weather = "snow";
            else if (code >= 95) weather = "thunder";
            
            // Temperature override
            if (temp > 25) weather = "hot";
            else if (temp < 0) weather = "cold";
            
            return { weather, temp };
        } catch (e) {
            return { weather: "clear", temp: null };
        }
    },

    // Main initialization
    async init() {
        const device = this.getDeviceType();
        const time = this.getTimePeriod();
        
        try {
            // Get location
            const locRes = await fetch('https://ipapi.co/json/');
            const locData = await locRes.json();
            const location = locData.city || "your city";
            
            // Get weather
            const weatherData = await this.fetchWeather(locData.latitude, locData.longitude);
            
            // Generate prophecy
            const prophecy = this.generateProphecy({
                time,
                weather: weatherData.weather,
                temp: weatherData.temp,
                device,
                location
            });
            
            // Display with fade effect
            const el = document.getElementById('prophecy-main');
            el.style.opacity = '0';
            setTimeout(() => {
                el.textContent = prophecy;
                el.style.opacity = '1';
            }, 300);
            
        } catch (e) {
            // Fallback prophecy
            const fallback = [
                "The Oracle sees you, even in shadow. Your device is known. Your location is marked.",
                "In this moment between moments, you have been chosen. The path opens before you.",
                "The Eye has found you. Wherever you are, whatever device you hold, you are seen.",
                "You came seeking answers. The Oracle offers questions. Begin your journey."
            ];
            document.getElementById('prophecy-main').textContent = 
                fallback[Math.floor(Math.random() * fallback.length)];
        }
    }
};

// Initialize Oracle when page loads
window.addEventListener('load', () => {
    setTimeout(() => Oracle.init(), 1000);
});
</script>
