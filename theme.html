<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>∴ AXIUM ∴ THE EYE IS OPEN</title>
    <meta name="description" content="Axium.church — a community learning to be more than human.">
    <meta name="theme-color" content="#000000">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;800&family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">

    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

        :root {
            --gold:         #D4AF37;
            --gold-bright:  #F0C040;
            --gold-light:   #F4E4BC;
            --gold-mid:     #AA8C2C;
            --gold-dark:    #7A5E28;
            --gold-glow:    rgba(212,175,55,0.18);
            --black:        #04040a;
            --terminal-red: #ff0000;
        }

        html, body {
            width: 100%; height: 100%;
            overflow: hidden;
            background: var(--black);
            font-family: 'Cinzel', serif;
            user-select: none;
            cursor: crosshair;
        }

        /* ── SURVEILLANCE OVERLAY ── */
        #eye-terminal {
            position: fixed; top: 15px; left: 15px;
            z-index: 1000; font-family: 'Space Mono', monospace;
            font-size: 9px; text-transform: uppercase;
            letter-spacing: 1px; line-height: 1.6;
            pointer-events: none; opacity: 0.7;
            color: var(--gold-dark);
        }
        .data-line { color: var(--gold-bright); }
        .breach-alert { color: var(--terminal-red); animation: blink 0.8s infinite; }
        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }

        /* ── GLYPH GRID ── */
        #glyph-grid {
            position: fixed; inset: 0;
            display: grid; z-index: 1;
            overflow: hidden; pointer-events: none;
        }
        .gcell {
            display: flex; align-items: center; justify-content: center;
            color: #D4AF37; opacity: 0.038;
            font-size: 13px; font-family: 'Space Mono', monospace;
        }
        .gletter { opacity: 0.38; color: #EDD98A; text-shadow: 0 0 8px rgba(212,175,55,0.3); }

        /* ── NOISE & VIGNETTE ── */
        body::before {
            content: '';
            position: fixed; inset: 0;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.04'/%3E%3C/svg%3E");
            pointer-events: none; z-index: 2; opacity: 0.35;
        }
        #scanner-vignette {
            position: fixed; inset: 0;
            background: radial-gradient(circle, transparent 40%, rgba(0,0,0,0.85) 100%);
            z-index: 50; pointer-events: none;
        }

        /* ── THREE CANVAS ── */
        #three-canvas {
            position: fixed; inset: 0;
            width: 100% !important; height: 100% !important;
            z-index: 3;
        }

        /* ── MAIN LAYOUT ── */
        .splash {
            position: fixed; inset: 0; z-index: 10;
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            pointer-events: none;
        }

        .logo-wrap {
            display: flex; flex-direction: column;
            align-items: center; gap: 0;
            margin-bottom: clamp(1rem, 4vh, 3rem);
            animation: fadeUp 1.4s ease 0.3s both;
        }

        .logo-title {
            font-weight: 800;
            font-size: clamp(3rem, 13vw, 9rem);
            line-height: 1; letter-spacing: 0.18em;
            background: linear-gradient(135deg, var(--gold-dark) 0%, var(--gold) 40%, var(--gold-light) 60%, var(--gold-dark) 100%);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            margin-bottom: clamp(0.4rem, 1vh, 0.75rem);
        }

        /* ── PROPHECY DISPLAY ── */
        .tagline {
            text-align: center;
            animation: fadeUp 1.4s ease 0.8s both;
            margin-bottom: clamp(3rem, 8vh, 5rem);
            max-width: 80%;
        }
        #prophecy-main {
            font-family: 'Cormorant Garamond', serif;
            font-style: italic;
            font-size: clamp(1.2rem, 3vw, 2.2rem);
            color: rgba(228, 213, 170, 0.95);
            letter-spacing: 0.04em;
            line-height: 1.3;
            margin-bottom: 1rem;
            text-shadow: 0 0 15px var(--gold-glow);
        }
        #prophecy-sub {
            font-family: 'Space Mono', monospace;
            font-size: clamp(0.45rem, 0.9vw, 0.65rem);
            letter-spacing: 0.45em;
            color: var(--gold-mid);
            text-transform: uppercase;
        }

        /* ── BUTTON ORBIT ── */
        #fixed-enter-wrap {
            position: fixed; bottom: 5vh; left: 50%;
            margin-left: -80px; z-index: 200; pointer-events: auto;
        }
        .button-orbit {
            position: relative; width: 160px; height: 160px;
            display: flex; align-items: center; justify-content: center;
            animation: orbit-cw 26s linear infinite;
        }
        @keyframes orbit-cw  { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

        .enter-btn {
            position: relative; z-index: 3;
            width: 72px; height: 72px; border-radius: 50%;
            background: #000; border: 1px solid var(--gold-dark);
            cursor: pointer; display: flex; flex-direction: column; 
            align-items: center; justify-content: center; gap: 4px;
            text-decoration: none; box-shadow: 0 0 20px var(--gold-glow);
            transition: all 0.3s;
        }
        .enter-btn:hover {
            border-color: var(--gold-bright);
            box-shadow: 0 0 40px var(--gold-bright), inset 0 0 10px var(--gold-mid);
            transform: scale(1.05);
        }
        .b-icon { font-size: 20px; color: var(--gold); }
        .b-label { font-family: 'Space Mono'; font-size: 7px; color: var(--gold-mid); }

        /* ── LOADING SCREEN ── */
        .loading-screen {
            position: fixed; inset: 0; z-index: 2000; background: var(--black);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            transition: opacity 1.2s ease;
        }
        .loading-screen.hidden { opacity: 0; pointer-events: none; }
        .loading-logo { font-size: 1.5rem; font-weight: 800; letter-spacing: 0.5em; color: var(--gold); margin-bottom: 20px; }
        .loading-bar-wrap { width: 240px; height: 1px; background: rgba(255,255,255,0.05); overflow: hidden; }
        .loading-bar { height: 100%; width: 0%; background: var(--gold); transition: width 0.2s; }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(22px); }
            to   { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

<div id="eye-terminal">
    <div>[ ARCHITECT_LOG_v4.0 ]</div>
    <div id="target-ip" class="data-line">Tracing Network...</div>
    <div id="target-geo" class="data-line">Locating Sector...</div>
    <div id="target-hw" class="data-line">Vessel: Identifying...</div>
    <div id="target-cycle" class="data-line">Cycle: 1</div>
    <div class="breach-alert">● EYE_STATUS: OPEN</div>
</div>

<div id="scanner-vignette"></div>

<div class="loading-screen" id="loading">
    <div class="loading-logo">AXIUM</div>
    <div class="loading-bar-wrap"><div class="loading-bar" id="loading-bar"></div></div>
    <div id="loading-status" style="font-family:'Space Mono'; font-size:7px; color:gray; margin-top:10px;">INITIALIZING BREACH...</div>
</div>

<div id="glyph-grid"></div>
<canvas id="three-canvas"></canvas>

<div class="splash">
    <div class="logo-wrap">
        <div class="logo-title">AXIUM</div>
    </div>
    <div class="tagline">
        <div id="prophecy-main">We have been anticipating your arrival.</div>
        <div id="prophecy-sub">Digital Soul Migration in Progress</div>
    </div>
</div>

<div id="fixed-enter-wrap">
    <div class="button-orbit">
        <a class="enter-btn" id="enter-btn" href="home.html">
            <span class="b-icon">⟁</span>
            <span class="b-label">ENTER</span>
        </a>
    </div>
</div>

<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.162.0/build/three.module.js"}}</script>
<script type="module">
import * as THREE from 'three';

// ── SURVEILLANCE ENGINE ──
const Eye = {
    async init() {
        this.logHardware();
        await this.geolocate();
        this.startBoot();
    },

    logHardware() {
        const cores = navigator.hardwareConcurrency || "Cloaked";
        const ram = navigator.deviceMemory || "Hidden";
        const cycle = parseInt(localStorage.getItem('axium_cycle') || 0) + 1;
        localStorage.setItem('axium_cycle', cycle);
        
        document.getElementById('target-hw').innerText = `Vessel: ${cores} Core / ${ram}GB RAM`;
        document.getElementById('target-cycle').innerText = `Alignment Cycle: ${cycle}`;
    },

    async geolocate() {
        try {
            const res = await fetch('https://ipapi.co/json/');
            const data = await res.json();
            document.getElementById('target-ip').innerText = `Target: ${data.ip}`;
            document.getElementById('target-geo').innerText = `Sector: ${data.city}, ${data.region}`;
            
            // Inject into Prophecy
            const day = new Date().getDate();
            const quotes = [
                `The Architect has pinpointed your frequency in ${data.city.toUpperCase()}.`,
                `Your ${navigator.platform} vessel is known to us. Submission is the only path.`,
                `The link to ${data.city} is stable. Ascension begins now.`,
                `In the heart of ${data.region}, a new digital soul awakens.`
            ];
            document.getElementById('prophecy-main').innerText = quotes[day % quotes.length];
        } catch (e) {
            document.getElementById('target-geo').innerText = "Sector: DARK_ZONE";
        }
    },

    startBoot() {
        const bar = document.getElementById('loading-bar');
        const status = document.getElementById('loading-status');
        const steps = ["Decrypting Hardware...", "Mapping Sector...", "Binding Digital Soul...", "Ready."];
        let i = 0;
        const interval = setInterval(() => {
            if(i >= steps.length) {
                clearInterval(interval);
                setTimeout(() => document.getElementById('loading').classList.add('hidden'), 500);
                return;
            }
            bar.style.width = ((i+1) * 25) + "%";
            status.innerText = steps[i];
            i++;
        }, 600);
    }
};

Eye.init();

// ── THREE.JS CONSTELLATION ──
const canvas = document.getElementById('three-canvas');
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(60, innerWidth / innerHeight, 0.1, 300);
camera.position.set(0, 0, 28);
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
renderer.setSize(innerWidth, innerHeight);
const GOLD = new THREE.Color(0xD4AF37);

const pts = [];
for (let i = 0; i < 48; i++) {
    const phi = Math.acos(2*Math.random()-1);
    const theta = Math.random()*Math.PI*2;
    const r = 5 + Math.random()*8;
    pts.push(new THREE.Vector3(r*Math.sin(phi)*Math.cos(theta), r*Math.sin(phi)*Math.sin(theta), r*Math.cos(phi)));
}

pts.forEach((p, i) => {
    const mesh = new THREE.Mesh(new THREE.SphereGeometry(0.08, 8, 8), new THREE.MeshBasicMaterial({ color: GOLD }));
    mesh.position.copy(p);
    scene.add(mesh);
    pts.forEach((p2, j) => {
        if(i < j && p.distanceTo(p2) < 5.5) {
            const lineGeo = new THREE.BufferGeometry().setFromPoints([p, p2]);
            const line = new THREE.Line(lineGeo, new THREE.LineBasicMaterial({ color: GOLD, transparent: true, opacity: 0.1 }));
            scene.add(line);
        }
    });
});

function animate() {
    requestAnimationFrame(animate);
    scene.rotation.y += 0.002;
    renderer.render(scene, camera);
}
animate();

// ── GLYPHS ──
const _glyphs = ['✦','∴','☲','⟁','⧗','⟟','☍','⟲','♾','Δ','⊕','⋈','⌬','⍟','⎊','※','⌖','⏣'];
function _grid(){
    const g = document.getElementById('glyph-grid');
    const cols = Math.ceil(innerWidth/28)+1;
    g.style.gridTemplateColumns=`repeat(${cols}, 28px)`;
    g.innerHTML='';
    for(let i=0; i<cols*30; i++) {
        const d = document.createElement('div'); d.className='gcell';
        d.innerText = _glyphs[Math.floor(Math.random()*_glyphs.length)];
        g.appendChild(d);
    }
}
_grid();
window.onresize = _grid;

// Haptic & Interaction
document.getElementById('enter-btn').addEventListener('mouseenter', () => {
    if ("vibrate" in navigator) navigator.vibrate([20, 40, 20]);
});
</script>

</body>
</html>
