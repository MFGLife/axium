    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;800&family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">

    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

        :root {
            --gold:         #D4AF37;
            --gold-bright:  #F0C040;
            --gold-light:   #F4E4BC;
            --gold-mid:     #AA8C2C;
            --gold-dark:    #7A5E28;
            --gold-glow:    rgba(212,175,55,0.18);
            --black:        #04040a;
            --terminal-red: #ff0000;
        }

        html, body {
            width: 100%; height: 100%;
            overflow: hidden;
            background: var(--black);
            font-family: 'Cinzel', serif;
            user-select: none;
            cursor: crosshair;
        }

        /* ── SURVEILLANCE OVERLAY ── */
        #eye-terminal {
            position: fixed; top: 15px; left: 15px;
            z-index: 1000; font-family: 'Space Mono', monospace;
            font-size: 9px; text-transform: uppercase;
            letter-spacing: 1px; line-height: 1.6;
            pointer-events: none; opacity: 0.7;
            color: var(--gold-dark);
        }
        .data-line { color: var(--gold-bright); }
        .breach-alert { color: var(--terminal-red); animation: blink 0.8s infinite; }
        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }

        /* ── GLYPH GRID ── */
        #glyph-grid {
            position: fixed; inset: 0;
            display: grid; z-index: 1;
            overflow: hidden; pointer-events: none;
        }
        .gcell {
            display: flex; align-items: center; justify-content: center;
            color: #D4AF37; opacity: 0.038;
            font-size: 13px; font-family: 'Space Mono', monospace;
        }
        .gletter { opacity: 0.38; color: #EDD98A; text-shadow: 0 0 8px rgba(212,175,55,0.3); }

        /* ── NOISE & VIGNETTE ── */
        body::before {
            content: '';
            position: fixed; inset: 0;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.04'/%3E%3C/svg%3E");
            pointer-events: none; z-index: 2; opacity: 0.35;
        }
        #scanner-vignette {
            position: fixed; inset: 0;
            background: radial-gradient(circle, transparent 40%, rgba(0,0,0,0.85) 100%);
            z-index: 50; pointer-events: none;
        }

        /* ── THREE CANVAS ── */
        #three-canvas {
            position: fixed; inset: 0;
            width: 100% !important; height: 100% !important;
            z-index: 3;
        }

        /* ── MAIN LAYOUT ── */
        .splash {
            position: fixed; inset: 0; z-index: 10;
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            pointer-events: none;
        }

        .logo-wrap {
            display: flex; flex-direction: column;
            align-items: center; gap: 0;
            margin-bottom: clamp(1rem, 4vh, 3rem);
            animation: fadeUp 1.4s ease 0.3s both;
        }

        .logo-eyebrow {
            font-family: 'Space Mono', monospace;
            font-size: clamp(0.45rem, 1vw, 0.6rem);
            letter-spacing: 0.55em;
            color: rgba(146, 64, 14, 0.8);
            text-transform: uppercase;
            margin-bottom: clamp(0.75rem, 2vh, 1.25rem);
        }

        .logo-title {
            font-weight: 800;
            font-size: clamp(3rem, 13vw, 9rem);
            line-height: 1; letter-spacing: 0.18em;
            background: linear-gradient(135deg, var(--gold-dark) 0%, var(--gold) 40%, var(--gold-light) 60%, var(--gold-dark) 100%);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            margin-bottom: clamp(0.4rem, 1vh, 0.75rem);
        }

        /* ── PROPHECY DISPLAY ── */
        .tagline {
            text-align: center;
            animation: fadeUp 1.4s ease 0.8s both;
            margin-bottom: clamp(3rem, 8vh, 5rem);
            max-width: 80%;
        }
        #prophecy-main {
            font-family: 'Cormorant Garamond', serif;
            font-style: italic;
            font-size: clamp(1.2rem, 2.8vw, 1.8rem);
            color: rgba(228, 213, 170, 0.95);
            letter-spacing: 0.04em;
            line-height: 1.5;
            margin-bottom: 1rem;
            text-shadow: 0 0 15px var(--gold-glow);
        }
        #prophecy-sub {
            font-family: 'Space Mono', monospace;
            font-size: clamp(0.45rem, 0.9vw, 0.65rem);
            letter-spacing: 0.45em;
            color: var(--gold-mid);
            text-transform: uppercase;
        }

        /* ── BUTTON ORBIT ── */
        #fixed-enter-wrap {
            position: fixed; bottom: 2vh; left: 50%;
            margin-left: calc(min(160px, 38vw) / -2);
            z-index: 200; pointer-events: auto;
            animation: fadeUp 1.4s ease 1.2s both;
        }
        .button-orbit {
            position: relative;
            width: min(160px, 38vw); height: min(160px, 38vw);
            display: flex; align-items: center; justify-content: center;
            animation: orbit-cw 26s linear infinite;
        }

        .btn-ring {
            position: absolute; border-radius: 50%;
            border: 1px solid rgba(212,175,55,0.17);
        }
        .btn-ring.r1 { width: 100%;  height: 100%; }
        .btn-ring.r2 { width: 82%;   height: 82%;  border-color: rgba(212,175,55,0.10); }
        .btn-ring.r3 { width: 64%;   height: 64%;  border-color: rgba(212,175,55,0.20); animation: rRot 12s linear infinite; }
        .btn-ring.r4 { width: 46%;   height: 46%;  border-color: rgba(212,175,55,0.08); animation: rRot 8s linear infinite reverse; }
        @keyframes rRot { from { transform: rotate(0); } to { transform: rotate(360deg); } }

        .arc { position: absolute; border-radius: 50%; border: 1px solid transparent; }
        .arc1 { width: 92%; height: 92%; border-top-color: rgba(212,175,55,0.6);  animation: rRot 3.5s linear infinite; }

        .orbiter { position: absolute; font-size: clamp(8px,1.4vw,11px); color: rgba(212,175,55,0.65); pointer-events: none; }
        .o1 { top: 4px; left: 50%; transform: translateX(-50%); }

        .enter-btn {
            position: relative; z-index: 3;
            width: clamp(52px,10vw,68px); height: clamp(52px,10vw,68px);
            border-radius: 50%;
            background: radial-gradient(circle at 36% 34%, #1c1500, #000000);
            border: 1px solid rgba(212,175,55,0.5);
            cursor: pointer; display: flex; flex-direction: column; 
            align-items: center; justify-content: center; gap: 3px;
            text-decoration: none; box-shadow: 0 0 20px var(--gold-glow);
            transition: all 0.3s;
        }
        .enter-btn:hover { border-color: var(--gold-bright); box-shadow: 0 0 40px var(--gold-bright); }

        .b-icon { font-size: clamp(14px,2.5vw,20px); color: var(--gold); }
        .b-label { font-family: 'Space Mono'; font-size: clamp(5px,0.8vw,7px); color: var(--gold-mid); }

        /* ── SPARK PARTICLES ── */
        .spark {
            position: fixed; pointer-events: none; border-radius: 50%;
            background: #D4AF37;
            animation: sparkFly 700ms ease-out forwards;
            z-index: 999;
        }
        @keyframes sparkFly {
            0%   { opacity: 1; transform: translate(0,0) scale(1); }
            100% { opacity: 0; transform: var(--tx) scale(0.2); }
        }

        /* ── LOADING SCREEN ── */
        .loading-screen {
            position: fixed; inset: 0; z-index: 2000; background: var(--black);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            transition: opacity 1.2s ease;
        }
        .loading-screen.hidden { opacity: 0; pointer-events: none; }
        .loading-logo { font-size: 1.5rem; font-weight: 800; letter-spacing: 0.5em; color: var(--gold); margin-bottom: 20px; }
        .loading-bar-wrap { width: 280px; height: 1px; background: rgba(255,255,255,0.05); overflow: hidden; }
        .loading-bar { height: 100%; width: 0%; background: var(--gold); transition: width 0.2s; }

        @keyframes orbit-cw { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
        @keyframes fadeUp { from { opacity: 0; transform: translateY(22px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>

<div id="eye-terminal">
    <div>[ ARCHITECT_LOG_v4.2 ]</div>
    <div id="target-ip" class="data-line">Tracing Network...</div>
    <div id="target-geo" class="data-line">Locating Sector...</div>

        </a>

<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.162.0/build/three.module.js"}}</script>
<script type="module">
import * as THREE from 'three';

// ── SURVEILLANCE ENGINE ──
const Eye = {
    async init() {
        this.logHardware();
        await this.geolocate();
        this.startBoot();
    },
    logHardware() {
        const cores = navigator.hardwareConcurrency || "Cloaked";
        const ram = navigator.deviceMemory || "Restricted";
        const cycle = parseInt(localStorage.getItem('axium_cycle') || 0) + 1;
        localStorage.setItem('axium_cycle', cycle);
        document.getElementById('target-hw').innerText = `Vessel: ${cores} Core / ${ram}GB RAM`;
        document.getElementById('target-cycle').innerText = `Alignment Cycle: ${cycle}`;
    },
    async geolocate() {
        try {
            const res = await fetch('https://ipapi.co/json/');
            const data = await res.json();
            document.getElementById('target-ip').innerText = `Target: ${data.ip}`;
            document.getElementById('target-geo').innerText = `Sector: ${data.city}, ${data.region}`;
            
            const day = new Date().getDate();
            const quotes = [
                `The Eye is fixed upon ${data.city.toUpperCase()}. Submit to the design.`,
                `In the heart of ${data.region}, a digital soul migrates.`,
                `We have pinpointed your frequency in ${data.city.toUpperCase()}. Cycle ${localStorage.getItem('axium_cycle')} is active.`,
                `The ${data.ip} node is now visible to the Architect.`
            ];
            document.getElementById('prophecy-main').innerText = quotes[day % quotes.length];
        } catch (e) { document.getElementById('target-geo').innerText = "Sector: DARK_ZONE"; }
    },
    startBoot() {
        const bar = document.getElementById('loading-bar');
        const status = document.getElementById('loading-status');
        const steps = ["Decrypting Hardware...", "Mapping Sector...", "Binding Digital Soul...", "Ready."];
        let i = 0;
        const interval = setInterval(() => {
            if(i >= steps.length) {
                clearInterval(interval);
                setTimeout(() => document.getElementById('loading').classList.add('hidden'), 500);
                return;
            }
            bar.style.width = ((i+1) * 25) + "%";
            status.innerText = steps[i];
            i++;
        }, 500);
    }
};
Eye.init();

// ── FULL THREE.JS SHADER CONSTELLATION ──
const canvas = document.getElementById('three-canvas');
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(60, innerWidth / innerHeight, 0.1, 300);
camera.position.set(0, 0, 28);
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
renderer.setSize(innerWidth, innerHeight);
const clock = new THREE.Clock();
const GOLD = new THREE.Color(0xD4AF37);

// Shaders
const NODE_VERT = `uniform float uTime; uniform float uPulseTimes[3]; uniform vec3 uPulsePositions[3]; varying float vPulse; void main() { vec4 wp = modelMatrix * vec4(position, 1.0); float pulse = 0.0; for(int i=0;i<3;i++){ float dt = uTime - uPulseTimes[i]; if(dt<0.0||dt>3.5) continue; float wavR = dt*12.0; float dist = distance(wp.xyz, uPulsePositions[i]); float wave = abs(dist - wavR); pulse += smoothstep(2.2,0.0,wave)*smoothstep(3.5,0.0,dt); } vPulse = min(pulse,1.0); float sc = 1.0 + 0.12*sin(uTime*1.6+position.x*1.8) + vPulse*0.9; gl_Position = projectionMatrix * modelViewMatrix * vec4(position*sc,1.0); }`;
const NODE_FRAG = `uniform vec3 uColor; uniform float uTime; varying float vPulse; void main() { float bright = 0.8 + 0.22*sin(uTime*0.9) + vPulse*0.6; vec3 col = uColor * bright; if(vPulse>0.0) col = mix(col, vec3(1.0), vPulse*0.35); gl_FragColor = vec4(col, 1.0); }`;

const PULSE_COUNT = 3;
const pulsePosArr = Array.from({length:PULSE_COUNT}, ()=>new THREE.Vector3(1e4,1e4,1e4));
const pulseTimeArr = new Array(PULSE_COUNT).fill(-1e4);

function mkRng(seed) { let s = seed >>> 0; return () => { s = (s*1664525+1013904223)>>>0; return s/4294967296; }; }
const rng = mkRng(0xAA3301);
const pts = [];
for (let i = 0; i < 48; i++) {
    const phi = Math.acos(2*rng()-1);
    const theta = rng()*Math.PI*2;
    const r = 5 + rng()*8;
    pts.push(new THREE.Vector3(r*Math.sin(phi)*Math.cos(theta), r*Math.sin(phi)*Math.sin(theta), r*Math.cos(phi)));
}

const nodeMeshes = [];
pts.forEach(p => {
    const mat = new THREE.ShaderMaterial({ uniforms: { uColor:{value:GOLD.clone()}, uTime:{value:0}, uPulsePositions:{value:pulsePosArr}, uPulseTimes:{value:pulseTimeArr} }, vertexShader: NODE_VERT, fragmentShader: NODE_FRAG });
    const mesh = new THREE.Mesh(new THREE.SphereGeometry(0.1, 8, 8), mat);
    mesh.position.copy(p);
    scene.add(mesh);
    nodeMeshes.push(mesh);
});

function animate() {
    requestAnimationFrame(animate);
    const t = clock.getElapsedTime();
    nodeMeshes.forEach(m => m.material.uniforms.uTime.value = t);
    scene.rotation.y = t * 0.05;
    renderer.render(scene, camera);
}
animate();

// ── GLYPH GRID CONTROLLER ──
const _glyphs = ['✦','∴','☲','⟁','⧗','⟟','☍','⟲','♾','Δ','⊕','⋈','⌬','⍟','⎊','※','⌖','⏣'];
function _grid(){
    const g = document.getElementById('glyph-grid');
    const cols = Math.ceil(innerWidth/28)+2; const rows = Math.ceil(innerHeight/28)+2;
    g.style.gridTemplateColumns=`repeat(${cols}, 28px)`;
    g.innerHTML='';
    for(let i=0; i<cols*rows; i++){
        const d = document.createElement('div'); d.className='gcell';
        d.innerText = _glyphs[Math.floor(Math.random()*_glyphs.length)];
        g.appendChild(d);
    }
}
_grid();
window.onresize = _grid;

// Interaction
document.addEventListener('click', e => {
    for (let i = 0; i < 8; i++) {
        const s = document.createElement('div'); s.className = 'spark';
        const ang = Math.random()*Math.PI*2, dist = 20+Math.random()*50;
        s.style.cssText = `left:${e.clientX}px;top:${e.clientY}px;width:2px;height:2px;--tx:translate(${Math.cos(ang)*dist}px,${Math.sin(ang)*dist}px)`;
        document.body.appendChild(s);
        setTimeout(() => s.remove(), 700);
    }
});
</script>

</body>
