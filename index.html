<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UNTIL.RED</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;800&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; }
html, body {
 margin: 0; padding: 0;
 width: 100%; height: 100%;
 overflow: hidden;
 background: #000;
 font-family: 'Cinzel', serif;
}

/* ---- CANVAS ---- */
canvas {
 position: fixed;
 top: 0; left: 0;
 width: 100%; height: 100%;
 z-index: 0;
}

/* ---- GRID ---- */
#grid {
 position: fixed;
 top: 0; left: 0;
 display: grid;
 z-index: 10;
}

.cell {
 display: flex;
 align-items: center;
 justify-content: center;
 line-height: 1;
 overflow: hidden;
 white-space: nowrap;
 color: #D4AF37;
 opacity: 0.30;
 transition:
   opacity  650ms cubic-bezier(0,.1,.2,1),
   color    650ms cubic-bezier(0,.1,.2,1),
   transform 650ms cubic-bezier(0,.1,.2,1);
}

.letter {
 opacity: 1;
 color: #EDD98A;
 text-shadow: 0 0 5px rgba(212,175,55,0.2);
 transform: scale(1.07);
}

/* ============================
  TRIANGLE EYE LOADER
============================ */

#loader-container {
 position: fixed;
 inset: 0;
 display: flex;
 align-items: center;
 justify-content: center;
 z-index: 100;
 pointer-events: none;
}

/* Orbit container - static (no spin) */
.loader-orbit {
 position: relative;
 width: min(280px, 60vw);
 height: min(280px, 60vw);
 display: flex;
 align-items: center;
 justify-content: center;
}

/* --- Concentric pulsing rings --- */
.btn-ring {
 position: absolute;
 border-radius: 50%;
 border: 1px solid rgba(212,175,55,0.2);
 animation: ringPulse 3s ease-in-out infinite;
}
.r1 { width: 120px;  height: 120px;  animation-duration: 2.6s; animation-delay: 0s; }
.r2 { width: 160px; height: 160px; animation-duration: 3.2s; animation-delay: .5s; }
.r3 { width: 200px; height: 200px; animation-duration: 4s;   animation-delay: 1s; }
.r4 { width: 240px; height: 240px; animation-duration: 5s;   animation-delay: 1.6s; border-style: dashed; border-color: rgba(212,175,55,0.07); }

@keyframes ringPulse {
 0%,100% { opacity:.15; transform:scale(1); }
 50%      { opacity:.45; transform:scale(1.03); }
}

/* --- Spinning arcs --- */
.arc {
 position: absolute;
 border-radius: 50%;
 border: 1px solid transparent;
}
.arc1 {
 width: 140px; height: 140px;
 border-top-color:    rgba(212,175,55,.65);
 border-bottom-color: rgba(212,175,55,.15);
 animation: spin 4s linear infinite;
}
.arc2 {
 width: 110px; height: 110px;
 border-left-color:  rgba(212,175,55,.4);
 border-right-color: rgba(212,175,55,.1);
 animation: spin 7s linear infinite reverse;
}
.arc3 {
 width: 170px; height: 170px;
 border-top-color:   rgba(212,175,55,.18);
 border-right-color: rgba(212,175,55,.08);
 animation: spin 12s linear infinite;
}

@keyframes spin { to { transform: rotate(360deg); } }

/* --- Orbiting sigil glyphs (static positions, no orbit animation) --- */
.orbiter {
 position: absolute;
 color: rgba(212,175,55,0.55);
 font-size: 14px;
 transform-origin: 0 0;
}

.orbiter.o1 { transform: rotate(0deg)   translateX(90px) rotate(0deg); }
.orbiter.o2 { transform: rotate(120deg) translateX(90px) rotate(-120deg); }
.orbiter.o3 { transform: rotate(240deg) translateX(90px) rotate(-240deg); }
.orbiter.o4 { transform: rotate(60deg)  translateX(115px) rotate(-60deg); }

/* --- Diamond corner marks --- */
.diamond {
 position: absolute;
 width: 6px; height: 6px;
 background: rgba(212,175,55,0.45);
 transform: rotate(45deg);
 animation: diamondPulse 2s ease-in-out infinite;
}
.d1 { top: -110px;   left: 50%; margin-left:-3px; animation-delay:0s; }
.d2 { bottom: -110px; left: 50%; margin-left:-3px; animation-delay:.5s; }
.d3 { left: -110px;  top: 50%;  margin-top:-3px;  animation-delay:1s; }
.d4 { right: -110px; top: 50%;  margin-top:-3px;  animation-delay:1.5s; }

@keyframes diamondPulse {
 0%,100% { opacity:.4; transform:rotate(45deg) scale(1); }
 50%      { opacity:1;  transform:rotate(45deg) scale(1.6); }
}

/* --- Golden Triangle with Eye --- */
.triangle-eye {
 position: relative;
 z-index: 3;
 width: 80px;
 height: 80px;
 display: flex;
 align-items: center;
 justify-content: center;
 opacity: 0;
 transform: scale(0.8);
 animation: triangleReveal 4s cubic-bezier(0.4, 0, 0.2, 1) forwards;
}

.triangle-svg {
 width: 100%;
 height: 100%;
 filter: drop-shadow(0 0 20px rgba(212,175,55,0.3));
}

.triangle-path {
 fill: none;
 stroke: #D4AF37;
 stroke-width: 1.5;
 stroke-linecap: round;
 stroke-linejoin: round;
 stroke-dasharray: 300;
 stroke-dashoffset: 300;
 animation: drawTriangle 2s ease-out forwards, triangleGlow 4s ease-in-out infinite;
}

.eye-group {
 opacity: 0;
 animation: eyeReveal 0.8s ease-out 1.2s forwards;
}

.eye-outline {
 fill: none;
 stroke: #D4AF37;
 stroke-width: 1.2;
}

.eye-pupil {
 fill: #D4AF37;
 animation: eyePulse 3s ease-in-out infinite;
}

@keyframes drawTriangle {
 to { stroke-dashoffset: 0; }
}

@keyframes triangleGlow {
 0%, 100% { filter: drop-shadow(0 0 10px rgba(212,175,55,0.3)); }
 50% { filter: drop-shadow(0 0 25px rgba(212,175,55,0.6)); }
}

@keyframes eyeReveal {
 to { opacity: 1; }
}

@keyframes eyePulse {
 0%, 100% { opacity: 0.8; transform: scale(1); }
 50% { opacity: 1; transform: scale(1.1); }
}

@keyframes triangleReveal {
 0% {
   opacity: 0;
   transform: scale(0.8);
 }
 30% {
   opacity: 1;
   transform: scale(1);
 }
 70% {
   opacity: 1;
   transform: scale(1);
 }
 100% {
   opacity: 0;
   transform: scale(1.1);
 }
}

/* Fade out entire loader */
#loader-container {
 animation: loaderFade 4s cubic-bezier(0.4, 0, 0.2, 1) forwards;
}

@keyframes loaderFade {
 0%, 80% { opacity: 1; }
 100% { opacity: 0; }
}

/* Small tweaks for very small screens */
@media (max-width: 480px) {
 .loader-orbit {
   width: 200px;
   height: 200px;
 }
 .r1 { width: 90px; height: 90px; }
 .r2 { width: 120px; height: 120px; }
 .r3 { width: 150px; height: 150px; }
 .r4 { width: 180px; height: 180px; }
 .arc1 { width: 100px; height: 100px; }
 .arc2 { width: 80px; height: 80px; }
 .arc3 { width: 120px; height: 120px; }
 .orbiter.o1 { transform: rotate(0deg)   translateX(65px) rotate(0deg); }
 .orbiter.o2 { transform: rotate(120deg) translateX(65px) rotate(-120deg); }
 .orbiter.o3 { transform: rotate(240deg) translateX(65px) rotate(-240deg); }
 .orbiter.o4 { transform: rotate(60deg)  translateX(85px) rotate(-60deg); }
 .d1 { top: -80px; }
 .d2 { bottom: -80px; }
 .d3 { left: -80px; }
 .d4 { right: -80px; }
 .triangle-eye {
   width: 60px;
   height: 60px;
 }
}
</style>
</head>
<body>

<canvas id="particles"></canvas>
<div id="grid"></div>

<!-- TRIANGLE EYE LOADER -->
<div id="loader-container">
 <div class="loader-orbit">
   <div class="btn-ring r1"></div>
   <div class="btn-ring r2"></div>
   <div class="btn-ring r3"></div>
   <div class="btn-ring r4"></div>

   <div class="arc arc1"></div>
   <div class="arc arc2"></div>
   <div class="arc arc3"></div>

   <span class="orbiter o1">✦</span>
   <span class="orbiter o2">∴</span>
   <span class="orbiter o3">⧗</span>
   <span class="orbiter o4">♾</span>

   <div class="diamond d1"></div>
   <div class="diamond d2"></div>
   <div class="diamond d3"></div>
   <div class="diamond d4"></div>

   <div class="triangle-eye">
     <svg class="triangle-svg" viewBox="0 0 100 100">
       <!-- Triangle -->
       <path class="triangle-path" d="M50 15 L85 80 L15 80 Z"/>
       <!-- Eye in center -->
       <g class="eye-group" transform="translate(50, 55)">
         <!-- Eye shape -->
         <path class="eye-outline" d="M-15 0 Q0 -12 15 0 Q0 12 -15 0 Z"/>
         <!-- Pupil -->
         <circle class="eye-pupil" cx="0" cy="0" r="4"/>
         <!-- Inner highlight -->
         <circle cx="-1.5" cy="-1.5" r="1.5" fill="#000" opacity="0.6"/>
       </g>
     </svg>
   </div>
 </div>
</div>

<script>
/* Redirect after animation */
setTimeout(() => {
 window.location.href = 'home.html';
}, 4000);

/* =========================
  GLYPHS
========================= */
const glyphs = ['✦','∴','☲','⟁','⧗','⟟','☍','⟲','♾','Δ','⊕','⋈','⌬','⍟','⎊','※','⌖','⏣'];

function randomGlyph() {
 return glyphs[Math.floor(Math.random() * glyphs.length)];
}

/* =========================
  GRID
========================= */
const CELL_SIZE = 28;
let cells = [], cols, rows;

function createGrid() {
 const grid = document.getElementById('grid');
 cols = Math.floor(window.innerWidth  / CELL_SIZE);
 rows = Math.floor(window.innerHeight / CELL_SIZE);

 grid.style.gridTemplateColumns = `repeat(${cols}, ${CELL_SIZE}px)`;
 grid.style.gridTemplateRows    = `repeat(${rows}, ${CELL_SIZE}px)`;
 grid.style.width  = `${cols * CELL_SIZE}px`;
 grid.style.height = `${rows * CELL_SIZE}px`;

 grid.innerHTML = '';
 cells = [];
 usedRows.clear();
 wordIndex = 0;

 for (let i = 0; i < cols * rows; i++) {
   const div = document.createElement('div');
   div.className = 'cell';
   div.style.fontSize = `${Math.round(CELL_SIZE * 0.52)}px`;
   div.textContent = randomGlyph();
   grid.appendChild(div);
   cells.push(div);
 }
}

/* =========================
  STATE
========================= */
let litCells  = new Set();
let usedRows  = new Set();
let wordIndex = 0;

function restoreCell(idx) {
 const c = cells[idx];
 if (!c) return;
 c.classList.remove('letter');
 c.textContent = randomGlyph();
}

/* =========================
  WORD REVEAL
========================= */
const paragraph = `A research cult for those who know the story is rigged but refuse to play their assigned character We weaponize double entendre anonymous ritual and AI augmented language to expose the machinery behind the mask without sacrificing the people wearing it`;
const words = paragraph.split(' ');

function reveal() {
 litCells.forEach(idx => restoreCell(idx));
 litCells.clear();

 if (wordIndex >= words.length) {
   wordIndex = 0;
   usedRows.clear();
 }

 const word    = words[wordIndex++];
 const letters = word.split('');
 const needed  = letters.length;

 let startRow = pickFreshRow();
 const startCol = Math.floor(Math.random() * cols);

 let r = startRow, c = startCol;

 for (let i = 0; i < needed; i++) {
   if (c >= cols) { c = 0; r++; if (r >= rows) r = 0; }

   const idx  = r * cols + c;
   const cell = cells[idx];
   if (cell) {
     cell.textContent = letters[i];
     cell.classList.add('letter');
     litCells.add(idx);
   }
   c++;
 }
}

function pickFreshRow() {
 const pool = Array.from({ length: rows }, (_, i) => i);
 for (let i = pool.length - 1; i > 0; i--) {
   const j = Math.floor(Math.random() * (i + 1));
   [pool[i], pool[j]] = [pool[j], pool[i]];
 }
 for (const r of pool) {
   if (!usedRows.has(r)) {
     usedRows.add(r);
     return r;
   }
 }
 usedRows.clear();
 const r = pool[0];
 usedRows.add(r);
 return r;
}

/* =========================
  BOOT
========================= */
createGrid();
reveal();
setInterval(reveal, 2500);

/* =========================
  PARTICLES
========================= */
const canvas = document.getElementById('particles');
const ctx    = canvas.getContext('2d');

function resizeCanvas() {
 canvas.width  = window.innerWidth;
 canvas.height = window.innerHeight;
}
resizeCanvas();

const PCOUNT = 90;
const pts = [];
for (let i = 0; i < PCOUNT; i++) {
 pts.push({
   x:     Math.random() * canvas.width,
   y:     Math.random() * canvas.height,
   vx:    (Math.random() - .5) * 0.22,
   vy:    (Math.random() - .5) * 0.22,
   size:  Math.random() * 1.9 + 0.5,
   phase: Math.random() * Math.PI * 2
 });
}

function drawParticles() {
 ctx.clearRect(0, 0, canvas.width, canvas.height);

 pts.forEach(p => {
   p.x += p.vx;
   p.y += p.vy;
   p.phase += 0.012;

   if (p.x < 0) p.x = canvas.width;
   if (p.x > canvas.width)  p.x = 0;
   if (p.y < 0) p.y = canvas.height;
   if (p.y > canvas.height) p.y = 0;

   const alpha = 0.28 + 0.28 * Math.sin(p.phase);
   ctx.fillStyle = `rgba(212,175,55,${alpha.toFixed(3)})`;
   ctx.beginPath();
   ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
   ctx.fill();
 });

 requestAnimationFrame(drawParticles);
}
drawParticles();

/* =========================
  BACKGROUND GLYPH DRIFT
========================= */
function driftGlyphs() {
 const total   = cells.length;
 const batchSz = Math.max(1, Math.floor(total * 0.015));
 for (let i = 0; i < batchSz; i++) {
   const idx = Math.floor(Math.random() * total);
   if (!litCells.has(idx)) {
     cells[idx].textContent = randomGlyph();
   }
 }
}
setInterval(driftGlyphs, 80);

/* =========================
  RESIZE
========================= */
window.addEventListener('resize', () => {
 createGrid();
 resizeCanvas();
});
</script>
</body>
</html>
