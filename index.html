<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Drift Engine — Narrative Stress Test</title>

<script src="https://cdn.jsdelivr.net/npm/@xenova/transformers@2.17.2/dist/transformers.min.js"></script>

<style>
body {
  background: #0f1117;
  color: #e6e6e6;
  font-family: Arial, sans-serif;
  margin: 0;
  padding: 0;
}

.container {
  max-width: 1000px;
  margin: auto;
  padding: 40px 20px;
}

h1 {
  font-size: 2.2em;
  margin-bottom: 10px;
}

.subtitle {
  color: #aaa;
  margin-bottom: 30px;
}

textarea {
  width: 100%;
  height: 200px;
  background: #1b1f2a;
  border: 1px solid #333;
  color: #fff;
  padding: 15px;
  font-size: 14px;
  resize: vertical;
}

button {
  margin-top: 15px;
  padding: 12px 20px;
  background: #00d4ff;
  border: none;
  font-weight: bold;
  cursor: pointer;
}

button:hover {
  background: #00aacc;
}

.results {
  margin-top: 40px;
  padding: 20px;
  background: #161922;
  border: 1px solid #2a2f3d;
}

.score {
  font-size: 2em;
  font-weight: bold;
  margin-bottom: 20px;
}

.metric {
  margin-bottom: 12px;
}

.bar {
  height: 10px;
  background: #2a2f3d;
  margin-top: 5px;
  position: relative;
}

.fill {
  height: 10px;
  background: #00d4ff;
}
</style>
</head>

<body>
<div class="container">

<h1>Drift Engine</h1>
<div class="subtitle">
Narrative Structural Stress Testing
</div>

<textarea id="inputText" placeholder="Paste text here..."></textarea>
<button onclick="runDrift()">Run Drift Scan</button>

<div id="results" class="results" style="display:none;">
  <div class="score" id="driftScore"></div>
  <div id="metrics"></div>
</div>

</div>

<script>
let embedder;

async function loadModel() {
  embedder = await window.transformers.pipeline(
    'feature-extraction',
    'Xenova/all-MiniLM-L6-v2'
  );
}

loadModel();

function splitSentences(text) {
  return text.match(/[^\.!\?]+[\.!\?]+/g) || [text];
}

function cosineSimilarity(a, b) {
  const dot = a.reduce((sum, val, i) => sum + val * b[i], 0);
  const magA = Math.sqrt(a.reduce((sum, val) => sum + val * val, 0));
  const magB = Math.sqrt(b.reduce((sum, val) => sum + val * val, 0));
  return dot / (magA * magB);
}

function countRegex(text, regex) {
  return (text.match(regex) || []).length;
}

async function runDrift() {
  const text = document.getElementById("inputText").value;
  if (!text) return;

  const sentences = splitSentences(text);
  const embeddings = [];

  for (let sentence of sentences) {
    const output = await embedder(sentence, { pooling: 'mean' });
    embeddings.push(output.data);
  }

  // Coherence
  let driftPairs = 0;
  for (let i = 0; i < embeddings.length - 1; i++) {
    const sim = cosineSimilarity(embeddings[i], embeddings[i+1]);
    if (sim < 0.3) driftPairs++;
  }
  let coherence = 100 - (driftPairs * 12);
  coherence = Math.max(0, coherence);

  // Anchor Density
  const entityCount = countRegex(text, /\b\d{4}\b|\b\d+\b/g);
  const anchorDensity = entityCount / sentences.length;
  let anchorScore = Math.min(100, anchorDensity * 50);

  // Emotional Compression
  const absolutes = countRegex(text, /\b(always|never|everyone|no one|undeniably|clearly)\b/gi);
  const exclaims = countRegex(text, /\!/g);
  const compressionIndex = absolutes * 2 + exclaims * 3;
  let compressionScore = 100 - (compressionIndex * 5);
  compressionScore = Math.max(0, compressionScore);

  // Specificity
  const vague = countRegex(text, /\b(some say|many believe|they say|people think)\b/gi);
  let specificityScore = 100 - (vague * 15);
  specificityScore = Math.max(0, specificityScore);

  // Drift Velocity
  let velocity = 0;
  if (embeddings.length > 2) {
    for (let i = 0; i < embeddings.length - 2; i++) {
      velocity += (1 - cosineSimilarity(embeddings[i], embeddings[i+2]));
    }
    velocity /= (embeddings.length - 2);
  }
  let driftVelocityScore = 100 - (velocity * 100);
  driftVelocityScore = Math.max(0, driftVelocityScore);

  // Weighted Final Score
  const finalScore =
    (coherence * 0.30) +
    (anchorScore * 0.20) +
    (compressionScore * 0.15) +
    (specificityScore * 0.15) +
    (driftVelocityScore * 0.20);

  displayResults({
    finalScore: Math.round(finalScore),
    coherence,
    anchorScore,
    compressionScore,
    specificityScore,
    driftVelocityScore
  });
}

function displayResults(data) {
  document.getElementById("results").style.display = "block";
  document.getElementById("driftScore").innerText =
    "Drift Index: " + data.finalScore;

  const metrics = [
    ["Coherence", data.coherence],
    ["Anchor Density", data.anchorScore],
    ["Emotional Compression", data.compressionScore],
    ["Specificity", data.specificityScore],
    ["Drift Velocity", data.driftVelocityScore]
  ];

  const container = document.getElementById("metrics");
  container.innerHTML = "";

  metrics.forEach(metric => {
    const div = document.createElement("div");
    div.className = "metric";
    div.innerHTML = `
      ${metric[0]}: ${Math.round(metric[1])}
      <div class="bar">
        <div class="fill" style="width:${metric[1]}%"></div>
      </div>
    `;
    container.appendChild(div);
  });
}
</script>

</body>
</html>
