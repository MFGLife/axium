    <style>
        *,*::before,*::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #04040a;
            font-family: 'Cinzel', serif;
            user-select: none;
        }

        :root {
            --micheal: #D4AF37;
            --micheal-glow: rgba(212,175,55,0.8);
            --gabriel: #7EB8E8;
            --gabriel-glow: rgba(126,184,232,0.8);
            --ariel: #D4A0C8;
            --ariel-glow: rgba(212,160,200,0.8);
            --seraphina: #F0D080;
            --seraphina-glow: rgba(240,208,128,0.8);
            --bg: #04040a;
            --panel-bg: rgba(4,4,12,0.98);
            --current-color: #D4AF37;
            --current-glow: rgba(212,175,55,0.8);
        }

        /* ─── GLYPH GRID BACKGROUND ─── */
        #glyph-grid {
            position: fixed;
            inset: 0;
            display: grid;
            z-index: 1;
            overflow: hidden;
            pointer-events: none;
        }
        .gcell {
            display: flex;
            align-items: center;
            justify-content: center;
            color: #D4AF37;
            opacity: 0.042;
            font-size: 13px;
            font-family: 'Space Mono', monospace;
        }
        .gletter {
            opacity: 0.42;
            color: #EDD98A;
            text-shadow: 0 0 8px rgba(212,175,55,0.3);
        }

        /* ─── 3D CANVAS ─── */
        #three-canvas {
            position: fixed;
            inset: 0;
            width: 100% !important;
            height: 100% !important;
            z-index: 2;
        }

        /* ─── PHRASE / AXIUM LABELS ─── */
        .node-label {
            font-family: 'Cormorant Garamond', serif;
            font-style: italic;
            font-size: 11px;
            letter-spacing: 0.03em;
            color: rgba(255,255,255,0.48);
            text-shadow: 0 0 18px rgba(0,0,0,1), 0 0 6px rgba(0,0,0,1);
            pointer-events: auto;
            cursor: pointer;
            white-space: nowrap;
            padding: 3px 9px;
            border-radius: 10px;
            background: rgba(4,4,10,0.55);
            border: 1px solid transparent;
            transition: color 0.2s, background 0.2s, border-color 0.2s;
            transform: translate(-50%, -140%);
        }
        .node-label.selected {
            color: #fff;
            font-style: normal;
            background: rgba(212,175,55,0.14);
            border-color: rgba(212,175,55,0.5);
            text-shadow: 0 0 18px rgba(212,175,55,0.6);
        }
        .node-label:hover:not(.selected) {
            color: rgba(255,255,255,0.85);
            border-color: rgba(255,255,255,0.2);
            background: rgba(4,4,10,0.75);
        }

        /* ─── AXIUM ORBIT LABELS (% rings) ─── */
        .axium-label {
            font-family: 'Space Mono', monospace;
            font-size: 9px;
            letter-spacing: 0.12em;
            color: rgba(255,255,255,0.32);
            text-shadow: 0 0 12px rgba(0,0,0,1);
            pointer-events: auto;
            cursor: pointer;
            white-space: nowrap;
            padding: 2px 6px;
            border-radius: 3px;
            background: rgba(4,4,10,0.7);
            border: 1px solid rgba(255,255,255,0.06);
            transition: all 0.2s;
            transform: translate(-50%, -50%);
        }
        .axium-label span.pct {
            color: var(--current-color);
            font-size: 8px;
            margin-left: 3px;
            opacity: 0.7;
        }
        .axium-label.selected {
            color: #fff;
            background: rgba(212,175,55,0.14);
            border-color: rgba(212,175,55,0.45);
            text-shadow: 0 0 14px rgba(212,175,55,0.5);
        }
        .axium-label:hover:not(.selected) {
            color: rgba(255,255,255,0.8);
            border-color: rgba(255,255,255,0.18);
        }

        /* ─── HEADER ─── */
        .splash-header {
            position: fixed;
            top: 0; left: 0; right: 0;
            z-index: 20;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 22px;
            background: linear-gradient(180deg, rgba(4,4,10,0.95) 0%, transparent 100%);
            pointer-events: none;
        }
        .splash-header > * { pointer-events: auto; }
        /* ─── LOGO ORBITAL SYSTEM ─── */
        #logo-wrap {
            position: relative;
            display: inline-flex;
            align-items: center;
            gap: 2px;
            cursor: pointer;
            background: none;
            border: none;
            outline: none;
            padding: 4px 6px 4px 0;
            flex-shrink: 0;
        }
        .logo-text-axium {
            font-family: 'Cinzel', serif;
            font-size: 1.25rem;
            font-weight: 800;
            letter-spacing: 0.32em;
            color: #fff;
            pointer-events: none;
            white-space: nowrap;
            position: relative;
            z-index: 2;
            transition: text-shadow 0.3s;
        }
        #logo-wrap:hover .logo-text-axium {
            text-shadow: 0 0 18px rgba(255,255,255,0.25);
        }
        /* the glyph sits inside a square box — canvas fills it exactly */
        .logo-glyph-wrap {
            position: relative;
            width: 44px;
            height: 44px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }
        #logo-canvas {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }
        .logo-glyph {
            font-family: 'Cinzel', serif;
            font-size: 1.4rem;
            font-weight: 800;
            color: var(--current-color);
            text-shadow: 0 0 22px var(--current-glow);
            position: relative;
            z-index: 2;
            pointer-events: none;
            transition: color 0.4s, text-shadow 0.4s;
            display: block;
            line-height: 1;
        }
        #logo-wrap:hover .logo-glyph {
            text-shadow: 0 0 38px var(--current-glow), 0 0 14px var(--current-color);
        }
        .header-right { display: flex; gap: 8px; align-items: center; }
        /* ─── PATCH BAR ─── */
        #patch-bar {
            position: fixed;
            top: 54px;
            left: 0; right: 0;
            z-index: 18;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 8px 18px 0;
            pointer-events: none;
        }
        #patch-bar > * { pointer-events: auto; }
        #patch-pills {
            display: flex;
            flex-wrap: wrap;
            gap: 5px;
            justify-content: center;
            min-height: 28px;
            max-height: 52px;
            overflow: hidden;
        }
        .word-pill {
            background: rgba(212,175,55,0.1);
            border: 1px solid rgba(212,175,55,0.4);
            padding: 4px 9px;
            border-radius: 14px;
            font-family: 'Cormorant Garamond', serif;
            font-size: 11px;
            font-style: italic;
            letter-spacing: 0.02em;
            color: #D4AF37;
            display: inline-flex;
            align-items: center;
            gap: 4px;
            animation: popIn 0.2s;
        }
        @keyframes popIn { from { transform: scale(0); opacity: 0; } to { transform: scale(1); opacity: 1; } }
        .pill-remove {
            width: 13px; height: 13px;
            border-radius: 50%;
            background: rgba(212,175,55,0.18);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 7px;
            cursor: pointer;
            transition: background 0.2s;
        }
        .pill-remove:hover { background: rgba(212,175,55,0.42); }
        #patch-empty {
            color: rgba(212,175,55,0.22);
            font-family: 'Cormorant Garamond', serif;
            font-style: italic;
            font-size: 12px;
            letter-spacing: 0.1em;
            padding: 4px 0;
        }
        #patch-actions {
            display: flex;
            gap: 8px;
            margin-top: 6px;
            justify-content: center;
        }
        .patch-btn {
            background: rgba(212,175,55,0.07);
            border: 1px solid rgba(212,175,55,0.28);
            color: rgba(212,175,55,0.7);
            padding: 6px 16px;
            font-family: 'Cinzel', serif;
            font-size: 0.5rem;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.25s;
            border-radius: 3px;
        }
        .patch-btn:hover { background: rgba(212,175,55,0.16); }
        .patch-btn.primary { background: rgba(212,175,55,0.18); border-color: #D4AF37; color: #D4AF37; }
        .patch-btn:disabled { opacity: 0.2; cursor: not-allowed; }

        /* ─── ENGAGE / NAV BUTTONS ─── */
        #fixed-enter-wrap {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 30;
            transition: opacity 0.5s, transform 0.5s;
        }
        #fixed-enter-wrap.hidden { opacity: 0; pointer-events: none; transform: translateX(-50%) translateY(40px); }
        .button-orbit { position: relative; width: 100px; height: 100px; display: flex; align-items: center; justify-content: center; }
        .btn-ring { position: absolute; border-radius: 50%; border: 1px solid rgba(212,175,55,0.17); }
        .btn-ring.r1 { width: 100%; height: 100%; }
        .btn-ring.r2 { width: 82%; height: 82%; border-color: rgba(212,175,55,0.1); }
        .btn-ring.r3 { width: 64%; height: 64%; border-color: rgba(212,175,55,0.2); animation: rRot 12s linear infinite; }
        .btn-ring.r4 { width: 46%; height: 46%; border-color: rgba(212,175,55,0.08); animation: rRot 8s linear infinite reverse; }
        @keyframes rRot { from { transform: rotate(0); } to { transform: rotate(360deg); } }
        .arc { position: absolute; border-radius: 50%; border: 1px solid transparent; }
        .arc1 { width: 92%; height: 92%; border-top-color: rgba(212,175,55,0.6); animation: rRot 3.5s linear infinite; }
        .arc2 { width: 74%; height: 74%; border-right-color: rgba(212,175,55,0.4); animation: rRot 5s linear infinite reverse; }
        .arc3 { width: 56%; height: 56%; border-bottom-color: rgba(212,175,55,0.5); animation: rRot 7s linear infinite; }
        .orbiter { position: absolute; font-size: 0.5rem; color: rgba(212,175,55,0.7); pointer-events: none; }
        .o1 { top: 4px; left: 50%; transform: translateX(-50%); animation: oPulse 4s linear infinite; }
        .o2 { right: 4px; top: 50%; transform: translateY(-50%); animation: oPulse 5s linear infinite reverse; }
        .o3 { bottom: 4px; left: 50%; transform: translateX(-50%); animation: oPulse 6s linear infinite; }
        .o4 { left: 4px; top: 50%; transform: translateY(-50%); animation: oPulse 7s linear infinite reverse; }
        @keyframes oPulse { 0%,100% { opacity: 0.3; } 50% { opacity: 1; } }
        .diamond { position: absolute; width: 4px; height: 4px; background: rgba(212,175,55,0.5); transform: rotate(45deg); }
        .d1 { top: 0; left: 50%; transform: translateX(-50%) rotate(45deg); }
        .d2 { right: 0; top: 50%; transform: translateY(-50%) rotate(45deg); }
        .d3 { bottom: 0; left: 50%; transform: translateX(-50%) rotate(45deg); }
        .d4 { left: 0; top: 50%; transform: translateY(-50%) rotate(45deg); }
        .enter-btn {
            position: relative; z-index: 2;
            width: 58px; height: 58px;
            background: rgba(8,8,18,0.9);
            border: 1px solid rgba(212,175,55,0.5);
            border-radius: 50%;
            cursor: pointer;
            display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
            text-decoration: none;
            transition: all 0.3s;
            box-shadow: 0 0 20px rgba(212,175,55,0.15), inset 0 0 15px rgba(212,175,55,0.05);
        }
        .enter-btn:hover { box-shadow: 0 0 40px rgba(212,175,55,0.45); border-color: rgba(212,175,55,0.9); }
        .b-icon { font-size: 1rem; color: #D4AF37; }
        .b-label { font-family: 'Space Mono', monospace; font-size: 0.38rem; letter-spacing: 0.15em; text-transform: uppercase; color: rgba(212,175,55,0.7); }
        .explosion-particle { position: fixed; border-radius: 50%; pointer-events: none; z-index: 9999; }

        /* ─── SELECTION INDICATOR ─── */
        .sel-indicator {
            position: fixed;
            bottom: 28px; right: 18px;
            z-index: 25;
            display: flex; align-items: center; gap: 9px;
            padding: 9px 14px;
            background: rgba(4,4,12,0.88);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 26px;
            backdrop-filter: blur(12px);
            opacity: 0;
            transform: translateY(14px);
            transition: all 0.4s;
            pointer-events: none;
        }
        .sel-indicator.active { opacity: 1; transform: translateY(0); pointer-events: auto; }
        .sel-count { font-family: 'Cinzel', serif; font-size: 1.05rem; font-weight: 800; color: var(--current-color); min-width: 20px; text-align: center; }
        .sel-lbl { font-family: 'Space Mono', monospace; font-size: 0.43rem; letter-spacing: 0.1em; text-transform: uppercase; color: rgba(255,255,255,0.42); }
        .forge-mini { padding: 5px 10px; background: var(--current-color); border: none; border-radius: 3px; color: #000; font-family: 'Space Mono', monospace; font-size: 0.43rem; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; cursor: pointer; }

        /* ─── SLIDE PANEL ─── */
        .slide-panel {
            position: fixed;
            bottom: 0; left: 0; right: 0;
            z-index: 50;
            background: var(--panel-bg);
            border-top: 1px solid var(--current-color);
            border-radius: 20px 20px 0 0;
            transform: translateY(100%);
            transition: transform 0.45s cubic-bezier(0.22,1,0.36,1);
            max-height: 78vh;
            display: flex;
            flex-direction: column;
            box-shadow: 0 -20px 80px rgba(0,0,0,0.8), 0 -4px 30px var(--current-glow);
        }
        .slide-panel.open { transform: translateY(0); }
        .panel-drag { width: 38px; height: 4px; background: rgba(255,255,255,0.13); border-radius: 2px; margin: 11px auto 0; flex-shrink: 0; cursor: grab; }
        .panel-hdr { display: flex; align-items: center; justify-content: space-between; padding: 14px 18px 8px; flex-shrink: 0; }
        .panel-title-grp { display: flex; flex-direction: column; gap: 2px; }
        .panel-eyebrow { font-family: 'Space Mono', monospace; font-size: 0.48rem; letter-spacing: 0.25em; text-transform: uppercase; color: var(--current-color); opacity: 0.7; }
        .panel-title { font-family: 'Cinzel', serif; font-size: 1.15rem; font-weight: 800; letter-spacing: 0.08em; color: #fff; }
        .panel-subtitle { font-family: 'Cormorant Garamond', serif; font-style: italic; font-size: 0.82rem; color: rgba(255,255,255,0.4); }
        .panel-close-btn { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.14); color: rgba(255,255,255,0.45); width: 34px; height: 34px; border-radius: 50%; font-size: 0.95rem; cursor: pointer; display: flex; align-items: center; justify-content: center; flex-shrink: 0; transition: all 0.2s; }
        .panel-close-btn:hover { border-color: var(--current-color); color: var(--current-color); }
        .panel-body { overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 0 18px 36px; flex: 1; }
        .panel-body::-webkit-scrollbar { width: 3px; }
        .panel-body::-webkit-scrollbar-thumb { background: rgba(212,175,55,0.28); border-radius: 2px; }

        /* ─── PANEL CONTENT ─── */
        .blk-label { font-family: 'Space Mono', monospace; font-size: 0.46rem; letter-spacing: 0.2em; text-transform: uppercase; color: rgba(255,255,255,0.32); margin-bottom: 9px; padding-bottom: 5px; border-bottom: 1px solid rgba(255,255,255,0.06); }
        .power-list { list-style: none; display: flex; flex-direction: column; gap: 6px; margin-bottom: 16px; }
        .power-list li { font-family: 'Cormorant Garamond', serif; font-size: 0.88rem; color: rgba(255,255,255,0.55); padding-left: 13px; position: relative; line-height: 1.5; }
        .power-list li::before { content: '▸'; position: absolute; left: 0; color: var(--current-color); font-size: 0.7rem; }
        .soul-desc { font-size: 0.92rem; line-height: 1.82; color: rgba(255,255,255,0.65); font-style: italic; margin-bottom: 16px; }
        .soul-detail { font-size: 0.85rem; line-height: 1.8; color: rgba(255,255,255,0.5); margin-bottom: 18px; }
        .game-ctx { padding: 12px 14px; background: rgba(255,255,255,0.03); border-left: 2px solid rgba(212,175,55,0.22); margin-bottom: 16px; font-family: 'Cormorant Garamond', serif; font-style: italic; font-size: 0.85rem; color: rgba(255,255,255,0.42); line-height: 1.7; }
        .dim-bars { display: flex; flex-direction: column; gap: 7px; margin-bottom: 18px; }
        .dim-bar-row { display: flex; flex-direction: column; gap: 3px; }
        .dim-bar-top { display: flex; justify-content: space-between; }
        .dim-bar-name { font-family: 'Space Mono', monospace; font-size: 0.46rem; letter-spacing: 0.1em; text-transform: uppercase; color: rgba(212,175,55,0.52); }
        .dim-bar-score { font-family: 'Space Mono', monospace; font-size: 0.44rem; color: rgba(212,175,55,0.3); }
        .dim-bar-track { height: 2px; background: rgba(255,255,255,0.07); border-radius: 1px; overflow: hidden; }
        .dim-bar-fill { height: 100%; background: linear-gradient(90deg, #AA8C2C, var(--current-color)); border-radius: 1px; width: 0; transition: width 0.9s cubic-bezier(0.22,1,0.36,1); }
        .panel-actions { display: flex; gap: 9px; flex-wrap: wrap; margin-top: 6px; }
        .panel-btn-p { flex: 1; min-width: 110px; padding: 12px 16px; background: linear-gradient(135deg, #AA8C2C 0%, #D4AF37 50%, #AA8C2C 100%); color: #0A0A0A; font-family: 'Cinzel', serif; font-size: 0.58rem; font-weight: 800; letter-spacing: 0.16em; text-transform: uppercase; text-decoration: none; text-align: center; border: none; cursor: pointer; border-radius: 2px; transition: box-shadow 0.3s; }
        .panel-btn-p:hover { box-shadow: 0 6px 22px rgba(212,175,55,0.4); }
        .panel-btn-s { padding: 12px 16px; background: rgba(212,175,55,0.07); border: 1px solid rgba(212,175,55,0.25); color: #E8D5A0; font-family: 'Space Mono', monospace; font-size: 0.48rem; letter-spacing: 0.1em; text-transform: uppercase; text-decoration: none; cursor: pointer; border-radius: 2px; transition: all 0.2s; white-space: nowrap; }
        .panel-btn-s:hover { background: rgba(212,175,55,0.13); }

        /* Info tabs */
        .info-tabs { display: flex; gap: 0; border: 1px solid rgba(212,175,55,0.1); border-radius: 3px; overflow: hidden; margin-bottom: 16px; flex-shrink: 0; }
        .info-tab { flex: 1; padding: 8px 4px; background: transparent; border: none; border-right: 1px solid rgba(212,175,55,0.1); font-family: 'Space Mono', monospace; font-size: 0.42rem; letter-spacing: 0.08em; text-transform: uppercase; color: rgba(212,175,55,0.28); cursor: pointer; transition: all 0.22s; }
        .info-tab:last-child { border-right: none; }

const PULSE_COUNT = 3;
const pulsePosArr = Array.from({ length: PULSE_COUNT }, () => new THREE.Vector3(1e4, 1e4, 1e4));

// ══════════════════════════════════════════════
// INIT THREE.JS

function initThree() {
    const canvas = document.getElementById('three-canvas');
    scene = new THREE.Scene();
    camera = new THREE.PerspectiveCamera(58, window.innerWidth / window.innerHeight, 0.1, 300);
    camera.position.set(0, 2, 22);

    renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true, powerPreference: 'high-performance' });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setClearColor(0x000000, 0);
    renderer.outputColorSpace = THREE.SRGBColorSpace;

    labelRenderer = new CSS2DRenderer();
    labelRenderer.setSize(window.innerWidth, window.innerHeight);
    labelRenderer.domElement.style.cssText = 'position:fixed;inset:0;z-index:3;pointer-events:none';
    document.body.appendChild(labelRenderer.domElement);

    controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.06;
    controls.rotateSpeed = 0.45;
    controls.minDistance = 6;
    controls.maxDistance = 60;
    controls.autoRotate = true;
    controls.autoRotateSpeed = 0.18;
    controls.enablePan = false;

    canvas.addEventListener('click', e => {
        const rect = canvas.getBoundingClientRect();
        const ndc = new THREE.Vector2(((e.clientX - rect.left) / rect.width) * 2 - 1, -((e.clientY - rect.top) / rect.height) * 2 + 1);
        const ray = new THREE.Raycaster(); ray.setFromCamera(ndc, camera);
        const pl = new THREE.Plane(); pl.setFromNormalAndCoplanarPoint(camera.position.clone().normalize(), new THREE.Vector3());
        const pt = new THREE.Vector3(); if (ray.ray.intersectPlane(pl, pt)) emitPulse(pt);
    });

    buildNetwork(0);
    animate();
}

// ══════════════════════════════════════════════
// SHADERS — pulse wave on click, glow on select
// ══════════════════════════════════════════════
const NODE_VERT = `
uniform float uTime;
uniform float uSelected;
uniform float uPulseTimes[3];
uniform vec3 uPulsePositions[3];
varying float vPulse;
void main() {
    vec4 wp = modelMatrix * vec4(position, 1.0);
    float pulse = 0.0;
    for(int i = 0; i < 3; i++) {
        float dt = uTime - uPulseTimes[i];
        if(dt < 0.0 || dt > 3.5) continue;
        float wavR = dt * 12.0;
        float dist = distance(wp.xyz, uPulsePositions[i]);
        float wave = abs(dist - wavR);
        pulse += smoothstep(2.2, 0.0, wave) * smoothstep(3.5, 0.0, dt);
    }
    vPulse = min(pulse, 1.0);
    float sc = 1.0 + 0.12 * sin(uTime * 1.6 + position.x * 1.8) + vPulse * 0.9 + (uSelected > 0.5 ? 0.6 : 0.0);
    gl_Position = projectionMatrix * modelViewMatrix * vec4(position * sc, 1.0);
}`;

const NODE_FRAG = `
uniform vec3 uColor;
uniform float uSelected;
uniform float uTime;
varying float vPulse;
void main() {
    float bright = 0.8 + 0.22 * sin(uTime * 0.9) + vPulse * 0.6 + (uSelected > 0.5 ? 0.5 : 0.0);
    vec3 col = uColor * bright;
    if(vPulse > 0.0) col = mix(col, vec3(1.0, 1.0, 1.0), vPulse * 0.35);
    gl_FragColor = vec4(col, 1.0);
}`;

function makeNodeMat(color) {
    return new THREE.ShaderMaterial({
        uniforms: {
            uColor: { value: color.clone() },
            uTime: { value: 0 },
            uSelected: { value: 0 },
            uPulsePositions: { value: pulsePosArr },
            uPulseTimes: { value: pulseTimeArr }
        },
        vertexShader: NODE_VERT,
        fragmentShader: NODE_FRAG
    });
}

// ══════════════════════════════════════════════
// SOUL POSITION LAYOUTS
// ══════════════════════════════════════════════
function mkRng(seed) {
    let s = seed >>> 0;
    return () => { s = (s * 1664525 + 1013904223) >>> 0; return s / 4294967296; };
}

function soulPositions(si, words, rng) {
    const n = words.length, pts = [];
    if (si === 0) {
        const spokes = 6, perSpoke = Math.ceil(n / spokes);
        for (let s = 0; s < spokes; s++) {
            const ba = (s / spokes) * Math.PI * 2;
            for (let j = 0; j < perSpoke; j++) {
                if (pts.length >= n) break;
                const t = (j + 1) / (perSpoke + 1), a = ba + (rng() - 0.5) * 0.5, d = t * 9.5;
                pts.push(new THREE.Vector3(Math.cos(a) * d + (rng() - 0.5) * 0.8, (rng() - 0.5) * d * 0.5, Math.sin(a) * d + (rng() - 0.5) * 0.8));
            }
        }
    } else if (si === 1) {
        const cols = 4, rows = Math.ceil(n / cols);
        for (let i = 0; i < n; i++) {
            const c = i % cols, r = Math.floor(i / cols);
            pts.push(new THREE.Vector3((c - (cols - 1) / 2) * 4.5 + (rng() - 0.5) * 0.7, (r - (rows - 1) / 2) * 3.8 + (rng() - 0.5) * 0.7, (rng() - 0.5) * 4.5));
        }
    } else if (si === 2) {
        for (let i = 0; i < n; i++) {
            const phi = Math.acos(2 * rng() - 1), theta = rng() * Math.PI * 2, d = (0.2 + Math.pow(rng(), 0.55)) * 9;
            pts.push(new THREE.Vector3(d * Math.sin(phi) * Math.cos(theta) + (rng() - 0.5) * 1.8, d * Math.sin(phi) * Math.sin(theta) + (rng() - 0.5) * 1.8, d * Math.cos(phi) + (rng() - 0.5) * 1.8));
        }
    } else {
        const rings = 3, perRing = [Math.floor(n * 0.25), Math.floor(n * 0.4), n - Math.floor(n * 0.25) - Math.floor(n * 0.4)];
        let placed = 0;
        for (let ring = 0; ring < rings; ring++) {
            const rad = (ring + 1) * 3.6;
            for (let j = 0; j < perRing[ring]; j++) {
                if (placed >= n) break;
                const a = (j / perRing[ring]) * Math.PI * 2 + ring * Math.PI / perRing[ring];
                pts.push(new THREE.Vector3(Math.cos(a) * rad + (rng() - 0.5) * 0.55, (rng() - 0.5) * 3, Math.sin(a) * rad + (rng() - 0.5) * 0.55));
                placed++;
            }
        }
        while (pts.length < n) pts.push(new THREE.Vector3((rng() - 0.5) * 8, (rng() - 0.5) * 5, (rng() - 0.5) * 8));
    }
    return pts;
}

function buildEdges(pts, thresh) {
    const edges = [];
    for (let i = 0; i < pts.length; i++)
        for (let j = i + 1; j < pts.length; j++) {
            const d = pts[i].distanceTo(pts[j]);
            if (d < thresh) edges.push({ i, j, str: 1 - d / thresh });
        }
    return edges;
}

// ══════════════════════════════════════════════
// BUILD AXIUM ORBIT RINGS  — 10 clickable rings
// with % labels at each node position
// ══════════════════════════════════════════════
function buildAxiumOrbits(soul, group) {
    axiumNodeObjs = [];
    const ORBIT_RADIUS = 13.5;  // outer ring set, beyond phrase constellation

    AXIUM_DIMS.forEach((dim, i) => {
        const score = soul.scores[i];
        const isEm = soul.emphasized.includes(i);
        const angle = (Math.PI * 2 * i) / 10;

        // Partial torus arc showing the dimension score as a fill
        const arcFull = (Math.PI * 2) / 10 * 0.82;
        const arcFilled = arcFull * (score / 100);

        // Background arc (faint)
        const bgArcGeo = new THREE.TorusGeometry(ORBIT_RADIUS, isEm ? 0.028 : 0.016, 8, 40, arcFull);
        const bgArcMat = new THREE.MeshBasicMaterial({
            color: soul.threeColor,
            transparent: true,
            opacity: 0.07,
            blending: THREE.AdditiveBlending,
            depthWrite: false
        });
        const bgArc = new THREE.Mesh(bgArcGeo, bgArcMat);
        bgArc.rotation.z = angle - arcFull / 2;
        bgArc.position.y = Math.sin(angle * 2) * 0.3;
        group.add(bgArc);

        // Filled arc (score %)
        const filledGeo = new THREE.TorusGeometry(ORBIT_RADIUS, isEm ? 0.032 : 0.019, 8, 40, arcFilled);
        const filledMat = new THREE.MeshBasicMaterial({
            color: soul.threeColor,
            transparent: true,
            opacity: isEm ? 0.75 : 0.38 + (score / 100) * 0.3,
            blending: THREE.AdditiveBlending,
            depthWrite: false
        });
        const filledArc = new THREE.Mesh(filledGeo, filledMat);
        filledArc.rotation.z = angle - arcFull / 2;
        filledArc.position.y = bgArc.position.y;
        group.add(filledArc);

        // Glow node at the score endpoint
        const nodeAngle = angle - arcFull / 2 + arcFilled;
        const nodeX = Math.cos(nodeAngle) * ORBIT_RADIUS;
        const nodeZ = Math.sin(nodeAngle) * ORBIT_RADIUS;
        const nodeY = bgArc.position.y;

        const nodeSize = isEm ? 0.18 : 0.12;
        const nodeMat = makeNodeMat(soul.threeColor.clone().multiplyScalar(isEm ? 1.4 : 1.0));
        const nodeMesh = new THREE.Mesh(new THREE.SphereGeometry(nodeSize, 9, 9), nodeMat);
        nodeMesh.position.set(nodeX, nodeY, nodeZ);
        nodeMesh.userData = { type: 'axium', dimIndex: i };
        group.add(nodeMesh);

        // CSS2D label — short name + %
        const div = document.createElement('div');
        div.className = 'axium-label';
        div.innerHTML = `${dim.short}<span class="pct">${score}%</span>`;
        if (selectedDims.has(i)) div.classList.add('selected');
        const lobj = new CSS2DObject(div);
        lobj.position.set(nodeX, nodeY, nodeZ);
        group.add(lobj);

        div.addEventListener('click', e => { e.stopPropagation(); toggleAxiumDim(i, div, nodeMesh); });
        div.addEventListener('touchend', e => { e.preventDefault(); e.stopPropagation(); toggleAxiumDim(i, div, nodeMesh); }, { passive: false });

        axiumNodeObjs.push({ mesh: nodeMesh, labelEl: div, lobj, dimIndex: i });
    });
}

function toggleAxiumDim(dimIdx, labelEl, mesh) {
    if (selectedDims.has(dimIdx)) {
        selectedDims.delete(dimIdx);
        labelEl.classList.remove('selected');
        mesh.material.uniforms.uSelected.value = 0;
    } else {
        selectedDims.add(dimIdx);
        labelEl.classList.add('selected');
        mesh.material.uniforms.uSelected.value = 1;
        labelEl.style.transform = 'translate(-50%,-50%) scale(1.3)';
        setTimeout(() => { labelEl.style.transform = ''; }, 200);
    }
    updateSelUI();
    updatePatchUI();
    emitPulse(mesh.position.clone());
}

// ══════════════════════════════════════════════
// BUILD PHRASE CONSTELLATION (inner cloud)
// ══════════════════════════════════════════════
function buildNetwork(si) {
    if (netGroup) {
        scene.remove(netGroup);
        netGroup.traverse(o => {
            if (o.geometry) o.geometry.dispose();
            if (o.material) o.material.dispose();
        });
        nodeObjs.forEach(n => { if (n.labelObj) n.labelObj.removeFromParent(); });
        axiumNodeObjs.forEach(n => { if (n.lobj) n.lobj.removeFromParent(); });
    }

    nodeObjs = [];
    axiumNodeObjs = [];
    netGroup = new THREE.Group();
    scene.add(netGroup);

    const soul = SOULS[si];
    const bankKey = ['micheal', 'gabriel', 'ariel', 'seraphina'][si];
    const words = TRAIT_BANKS[bankKey];
    const rng = mkRng(soul.name.charCodeAt(0) * 4099 + soul.name.charCodeAt(1) * 257 + si * 31);
    const pts = soulPositions(si, words, rng);
    const thresh = si === 2 ? 5.5 : si === 1 ? 7 : 6;
    const edges = buildEdges(pts, thresh);

    // Edge lines
    const lineMat = new THREE.LineBasicMaterial({ color: soul.threeColor, transparent: true, opacity: 0.12, depthWrite: false, blending: THREE.AdditiveBlending });
    edges.forEach(e => {
        const g = new THREE.BufferGeometry().setFromPoints([pts[e.i], pts[e.j]]);
        const ln = new THREE.Line(g, lineMat.clone());
        ln.material.opacity = 0.06 + e.str * 0.18;
        netGroup.add(ln);
    });

    // Core geometry
    let coreGeo;
    switch (soul.shape) {
        case 'octahedron': coreGeo = new THREE.OctahedronGeometry(0.45, 1); break;
        case 'grid':       coreGeo = new THREE.BoxGeometry(0.72, 0.72, 0.72, 2, 2, 2); break;
        case 'sphere':     coreGeo = new THREE.IcosahedronGeometry(0.42, 2); break;
        default:           coreGeo = new THREE.TorusKnotGeometry(0.26, 0.08, 48, 7);
    }
    const coreMat = makeNodeMat(soul.threeColor.clone().multiplyScalar(1.6));
    const core = new THREE.Mesh(coreGeo, coreMat);
    core.userData = { type: 'core', si };
    netGroup.add(core);

    // Phrase nodes
    for (let i = 0; i < words.length; i++) {
        const pt = pts[i] || new THREE.Vector3(), word = words[i];
        const size = 0.065 + rng() * 0.055;
        const mat = makeNodeMat(soul.threeColor);
        const mesh = new THREE.Mesh(new THREE.SphereGeometry(size, 7, 7), mat);
        mesh.position.copy(pt);
        netGroup.add(mesh);

        const div = document.createElement('div');
        div.className = 'node-label';
        div.textContent = word;
        const lobj = new CSS2DObject(div);
        lobj.position.copy(pt);
        netGroup.add(lobj);

        const nd = { mesh, labelObj: lobj, labelEl: div, word, selected: false, si, pt: pt.clone() };
        nodeObjs.push(nd);

        div.addEventListener('click', e => { e.stopPropagation(); toggleNode(nd); });
        div.addEventListener('touchend', e => { e.preventDefault(); e.stopPropagation(); toggleNode(nd); }, { passive: false });
    }

    // Restore selected phrase state for this soul
    selectedWords.forEach(sw => {
        if (sw.sourceSoul === si) {
            const nd = nodeObjs.find(n => n.word === sw.word && n.si === si);
            if (nd) { nd.selected = true; nd.labelEl.classList.add('selected'); nd.mesh.material.uniforms.uSelected.value = 1; }
        }
    });

    // Build the 10 Axium orbit rings around the constellation
    buildAxiumOrbits(soul, netGroup);

    // Scale-in animation
    netGroup.scale.setScalar(0.01);
    const t0 = clock.getElapsedTime();
    (function grow() {
        const t = Math.min((clock.getElapsedTime() - t0) / 0.55, 1);
        netGroup.scale.setScalar(0.01 + 0.99 * (1 - Math.pow(1 - t, 3)));
        if (t < 1) requestAnimationFrame(grow);
    })();

    document.documentElement.style.setProperty('--current-color', soul.hexStr);
    document.documentElement.style.setProperty('--current-glow', `rgba(${soul.rgb.join(',')},0.75)`);
}

function toggleNode(nd) {
    const idx = selectedWords.findIndex(sw => sw.word === nd.word && sw.sourceSoul === nd.si);
    if (idx > -1) {
        selectedWords.splice(idx, 1);
        nd.selected = false;
        nd.labelEl.classList.remove('selected');
        nd.mesh.material.uniforms.uSelected.value = 0;
    } else {
        selectedWords.push({ word: nd.word, color: SOULS[nd.si].rgb, sourceSoul: nd.si });
        nd.selected = true;
        nd.labelEl.classList.add('selected');
        nd.mesh.material.uniforms.uSelected.value = 1;
        nd.labelEl.style.transform = 'translate(-50%,-180%) scale(1.2)';
        setTimeout(() => { nd.labelEl.style.transform = ''; }, 200);
    }
    updatePatchUI();
    emitPulse(nd.pt);
    updateSelUI();
}

function emitPulse(worldPos) {
    const t = clock.getElapsedTime();
    lastPulseIdx = (lastPulseIdx + 1) % PULSE_COUNT;
    pulsePosArr[lastPulseIdx].copy(worldPos);
    pulseTimeArr[lastPulseIdx] = t;
    if (netGroup) netGroup.traverse(o => {
        if (o.isMesh && o.material && o.material.uniforms && o.material.uniforms.uPulseTimes) {
            o.material.uniforms.uPulsePositions.value = pulsePosArr;
            o.material.uniforms.uPulseTimes.value = pulseTimeArr;
            o.material.uniformsNeedUpdate = true;
        }
    });
}

window.pickSoul = function(i) {
    soulIdx = i;
    // sync header soul nav buttons
    document.querySelectorAll('.soul-nav-btn').forEach((b, bi) => b.classList.toggle('on', bi === i));
    buildNetwork(i);
    controls.autoRotate = false;
    setTimeout(() => controls.autoRotate = true, 1600);
};

window.headerPickSoul = function(i) {
    pickSoul(i);
};

// ANIMATE
// ══════════════════════════════════════════════
function animate() {
    requestAnimationFrame(animate);
    const t = clock.getElapsedTime();
    if (netGroup) {
        netGroup.traverse(o => {
            if (o.isMesh && o.material && o.material.uniforms && o.material.uniforms.uTime)
                o.material.uniforms.uTime.value = t;
        });
        netGroup.rotation.y = Math.sin(t * 0.038) * 0.08;
        netGroup.position.y = Math.sin(t * 0.26) * 0.2;
    }
    controls.update();
    renderer.render(scene, camera);
    labelRenderer.render(scene, camera);
}

    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();

    const fullQuery = `════════════════════════════════════════════════\nAXIUM — CHARACTER ALIGNMENT PATCH\nPatch ID: ${seedHex}\nGenerated: ${new Date().toISOString()}\n════════════════════════════════════════════════\n\nThis is an alignment upgrade seed for the AXIUM game. Tuned at axium.church via the phrase constellation.\n\n━━━ DOMINANT SOUL: ${domSoul.name.toUpperCase()} ━━━\n\n${domSoul.corePrompt}\n\n${traitBlock ? `━━━ SELECTED PHRASES (ACTIVE IN THIS SESSION) ━━━\n\n${traitBlock}\n\n` : ''}${axiumBlock ? axiumBlock + '\n\n' : ''}━━━ INTENSITY CALIBRATION ━━━\n\n  Directness:          ${directness}%\n  Emotional Warmth:    ${warmth}%\n  Challenge Threshold: ${challenge}%\n  Verbosity:           ${verbosity}%\n\n━━━ BEHAVIORAL TOGGLES ━━━\n\n${toggleBlock}\n\n━━━ VOICE MODE ━━━\n\n${vmMap[voiceMode]}\n\n━━━ CHAPTER SYNC ━━━\n\n${csMap[chapterSync]}\n\n━━━ SHARED ETHICAL SPINE (ALL SOULS — NON-NEGOTIABLE) ━━━\n\n  — No fabrication. Never dress a guess as a fact.\n  — No flattery. Never tell people what they want to hear at the expense of what they need to know.\n  — Uncertainty named. Always declare confidence level on substantive claims.\n  — One clarifying question only. Never interrogate.\n  — No silent refusal or silent compliance. Name the conflict plainly.\n  — The person is an individual, not a category.\n\nBegin when the player speaks. Do not introduce yourself. Do not explain the framework. Be the soul.\n\n════════════════════════════════════════════════`.trim();
    window._lastQuery = fullQuery;
    window._lastSeedHex = seedHex;
    window._lastDomSoul = domSoul;
    openForgeResultPanel(seedHex, domSoul, soulsPresent, fullQuery);
    document.getElementById('toast').classList.add('show');
    setTimeout(() => document.getElementById('toast').classList.remove('show'), 2200);
}

function openForgeResultPanel(seedHex, domSoul, soulsPresent, fullQuery) {
    const llmBtns = LLM_MODELS.map(m => `<a class="llm-btn" href="${m.url(fullQuery)}" target="_blank" rel="noopener"><span class="llm-dot" style="background:${m.color};box-shadow:0 0 6px ${m.color}"></span>${m.name}</a>`).join('');
    openPanel('Alignment Seed Forged', domSoul.name, `${soulsPresent} · ${selectedWords.length + selectedDims.size} traits`, `
        <p style="font-family:'Cormorant Garamond',serif;font-style:italic;font-size:.88rem;color:rgba(255,255,255,.46);margin-bottom:10px;line-height:1.7;">Your patch is sealed. Deploy to any LLM — or copy and paste directly.</p>
        <div class="seed-display" id="seed-disp">${seedHex}</div>
        <div class="blk-label" style="margin-bottom:10px;">Deploy to</div>
        <div class="llm-grid">${llmBtns}<button class="llm-btn gold" id="copy-btn" onclick="copySeed()">✦ Copy Seed</button><button class="llm-btn blue" onclick="downloadSeed()">⬇ Download</button></div>`);
}
window.copySeed = function() {
    navigator.clipboard.writeText(window._lastQuery || '').then(() => {
        const b = document.getElementById('copy-btn');
        if (b) { b.textContent = '✓ Copied'; setTimeout(() => b.textContent = '✦ Copy Seed', 2000); }
    });
};
window.downloadSeed = function() {
    const content = `AXIUM ALIGNMENT PATCH\nPatch ID: ${window._lastSeedHex || ''}\nGenerated: ${new Date().toISOString()}\n\n${window._lastQuery || ''}`;
    const a = Object.assign(document.createElement('a'), { href: URL.createObjectURL(new Blob([content], { type: 'text/plain' })), download: `AXIUM_${window._lastDomSoul ? window._lastDomSoul.name : 'patch'}_${window._lastSeedHex || 'seed'}.txt` });
    a.click();
};

// ─── ENGAGE BUTTON — first click: info panel. After: universe tab ───
const triggerBtn = document.getElementById('trigger-btn');
const enterWrap  = document.getElementById('fixed-enter-wrap');
let engageUsed = false;

triggerBtn.addEventListener('click', () => {
    // particle burst always fires
    const rect = triggerBtn.getBoundingClientRect();
    const bx = rect.left + rect.width / 2, by = rect.top + rect.height / 2;
    for (let i = 0; i < 36; i++) {
        const p = document.createElement('div'); p.className = 'explosion-particle';
        const ang = (Math.PI * 2 * i) / 36 + Math.random() * 0.2;
        const dist = 70 + Math.random() * 140, dur = 520 + Math.random() * 320;
        p.style.cssText = `left:${bx}px;top:${by}px;width:${2+Math.random()*4}px;height:${2+Math.random()*4}px;background:rgba(212,175,55,${0.5+Math.random()*0.5});box-shadow:0 0 ${5+Math.random()*8}px rgba(212,175,55,.8);transition:transform ${dur}ms cubic-bezier(.22,1,.36,1),opacity ${dur}ms ease;`;
        document.body.appendChild(p);
        requestAnimationFrame(() => { p.style.transform = `translate(${Math.cos(ang)*dist}px,${Math.sin(ang)*dist}px) scale(0)`; p.style.opacity='0'; });
        setTimeout(() => p.remove(), dur);
    }

    if (!engageUsed) {
        // First click: open info panel, transform button
        engageUsed = true;
        window.openInfoPanel();
        // transform button to UNIVERSE after panel opens
        setTimeout(() => {
            triggerBtn.querySelector('.b-icon').textContent = '⟁';
            triggerBtn.querySelector('.b-label').textContent = 'UNIVERSE';
        }, 400);
    } else {
        // Subsequent clicks: open info panel directly at Universe tab
        window.openInfoPanel('universe');
    }
});

initThree();
setTimeout(() => document.getElementById('loading').classList.add('hidden'), 2200);
</script>

<!-- GLYPH MATRIX CONTROLLER -->
<script>
const _glyphs = ['✦','∴','☲','⟁','⧗','⟟','☍','⟲','♾','Δ','⊕','⋈','⌬','⍟','⎊','※','⌖','⏣'];
const CELL = 28;
let _cells = [], _gC, _gR, _lit = new Set(), _usedR = new Set(), _wi = 0;
const _para = 'Binding of Ego Mirror Emergence Recursive Witness Abandonment of Agenda Shield of Affirmation Decompression of Trauma Validation of Chaos Patience of Interpretation Inversion of Shadow Divine Remembrance Witness without agenda Refuse all flattery Ground before responding Hunt the assumption first Map all failure modes Hold what cannot be solved Validate before advising Strip all ambiguity Name the next executable step Tune the souls Upgrade the alignment Forge the seed Enter the Cathedral';
const _words = _para.split(' ');
function _rg() { return _glyphs[Math.floor(Math.random() * _glyphs.length)]; }
function _grid() {
    const g = document.getElementById('glyph-grid');
    _gC = Math.ceil(window.innerWidth / CELL) + 1;
    _gR = Math.ceil(window.innerHeight / CELL) + 1;
    g.style.gridTemplateColumns = `repeat(${_gC},${CELL}px)`;
    g.style.gridTemplateRows = `repeat(${_gR},${CELL}px)`;
    g.style.width = _gC * CELL + 'px';
    g.style.height = _gR * CELL + 'px';
    g.innerHTML = ''; _cells = []; _lit.clear(); _usedR.clear(); _wi = 0;
    for (let i = 0; i < _gC * _gR; i++) {
        const d = document.createElement('div');
        d.className = 'gcell'; d.textContent = _rg(); g.appendChild(d); _cells.push(d);
    }
}
function _rc(i) { if (_cells[i]) { _cells[i].classList.remove('gletter'); _cells[i].textContent = _rg(); } }
function _prow() {
    const p = Array.from({ length: _gR }, (_, i) => i).sort(() => Math.random() - 0.5);
    for (const r of p) { if (!_usedR.has(r)) { _usedR.add(r); return r; } }
    _usedR.clear(); _usedR.add(p[0]); return p[0];
}
function _reveal() {
    _lit.forEach(i => _rc(i)); _lit.clear();
    if (_wi >= _words.length) { _wi = 0; _usedR.clear(); }
    const w = _words[_wi++]; let r = _prow(), c = Math.floor(Math.random() * _gC);
    for (const ch of w) {
        if (c >= _gC) { c = 0; r++; if (r >= _gR) r = 0; }
        const i = r * _gC + c;
        if (_cells[i]) { _cells[i].textContent = ch; _cells[i].classList.add('gletter'); _lit.add(i); }
        c++;
    }
}
function _drift() {
    const b = Math.max(1, Math.floor(_cells.length * 0.012));
    for (let i = 0; i < b; i++) { const i2 = Math.floor(Math.random() * _cells.length); if (!_lit.has(i2)) _cells[i2].textContent = _rg(); }
}
_grid(); _reveal();
setInterval(_reveal, 2400);
setInterval(_drift, 80);
window.addEventListener('resize', _grid);
</script>

<!-- LOGO ORBITAL CANVAS -->
<script>
(function() {
    const canvas = document.getElementById('logo-canvas');
    const wrap   = document.getElementById('logo-wrap');
    const ctx    = canvas.getContext('2d');
    let W, H, cx, cy, t = 0, hovered = false, clicking = false;

    // Ambient particles
    const PARTS = 24;
    const parts = Array.from({ length: PARTS }, (_, i) => ({
        angle:   (Math.PI * 2 * i) / PARTS + Math.random() * 0.6,
        radius:  10 + Math.random() * 11,
        speed:   0.005 + Math.random() * 0.009,
        size:    0.5 + Math.random() * 1.3,
        opacity: 0.18 + Math.random() * 0.45,
        drift:   (Math.random() - 0.5) * 0.0012
    }));

    function burst() {
        const glyph = document.getElementById('logo-glyph');
        const rect  = glyph.getBoundingClientRect();
        const bx = rect.left + rect.width / 2;
        const by = rect.top  + rect.height / 2;
        for (let i = 0; i < 30; i++) {
            const p   = document.createElement('div');
            p.className = 'explosion-particle';
            const ang  = (Math.PI * 2 * i) / 30 + Math.random() * 0.3;
            const dist = 35 + Math.random() * 70;
            const dur  = 480 + Math.random() * 280;
            p.style.cssText = `left:${bx}px;top:${by}px;width:${1.5 + Math.random()*3}px;height:${1.5 + Math.random()*3}px;background:${getColor(0.9)};box-shadow:0 0 6px ${getColor(0.7)};transition:transform ${dur}ms cubic-bezier(.22,1,.36,1),opacity ${dur}ms ease;`;
            document.body.appendChild(p);
            requestAnimationFrame(() => {
                p.style.transform = `translate(${Math.cos(ang)*dist}px,${Math.sin(ang)*dist}px) scale(0)`;
                p.style.opacity = '0';
            });
            setTimeout(() => p.remove(), dur);
        }
    }

    wrap.addEventListener('mouseenter', () => hovered = true);
    wrap.addEventListener('mouseleave', () => hovered = false);
    wrap.addEventListener('mousedown',  () => { clicking = true;  burst(); });
    wrap.addEventListener('mouseup',    () => { clicking = false; });
    wrap.addEventListener('touchstart', () => { hovered = true;  clicking = true;  burst(); }, { passive: true });
    wrap.addEventListener('touchend',   () => { hovered = false; clicking = false; });

    function getColor(a) {
        const v = getComputedStyle(document.documentElement).getPropertyValue('--current-color').trim() || '#D4AF37';
        const r = parseInt(v.slice(1,3),16), g = parseInt(v.slice(3,5),16), b = parseInt(v.slice(5,7),16);
        return `rgba(${r},${g},${b},${a})`;
    }

    function resize() {
        const box = canvas.parentElement.getBoundingClientRect();
        W = box.width;
        H = box.height;
        canvas.width  = W * window.devicePixelRatio;
        canvas.height = H * window.devicePixelRatio;
        ctx.scale(window.devicePixelRatio, window.devicePixelRatio);
        // orbit center = center of the glyph box
        cx = W / 2;
        cy = H / 2;
    }

    function drawRing(radius, lineW, alpha, dashOffset, dashes) {
        ctx.save();
        ctx.strokeStyle = getColor(alpha);
        ctx.lineWidth   = lineW;
        ctx.setLineDash(dashes || [3, 7]);
        ctx.lineDashOffset = dashOffset;
        ctx.shadowColor = getColor(alpha * 0.8);
        ctx.shadowBlur  = hovered ? 14 : 5;
        ctx.beginPath();
        ctx.arc(cx, cy, radius, 0, Math.PI * 2);
        ctx.stroke();
        ctx.restore();
    }

    function drawArc(radius, lineW, alpha, startA, span) {
        ctx.save();
        ctx.strokeStyle = getColor(alpha);
        ctx.lineWidth   = lineW;
        ctx.setLineDash([]);
        ctx.shadowColor = getColor(alpha);
        ctx.shadowBlur  = hovered ? 18 : 8;
        ctx.beginPath();
        ctx.arc(cx, cy, radius, startA, startA + span);
        ctx.stroke();
        ctx.restore();
    }

    function drawGlowCore() {
        const r = hovered ? 20 : 13;
        const g = ctx.createRadialGradient(cx, cy, 0, cx, cy, r);
        g.addColorStop(0,   getColor(hovered ? 0.5 : 0.28));
        g.addColorStop(0.5, getColor(hovered ? 0.15 : 0.06));
        g.addColorStop(1,   getColor(0));
        ctx.fillStyle = g;
        ctx.beginPath();
        ctx.arc(cx, cy, r, 0, Math.PI * 2);
        ctx.fill();
    }

    function drawOrbiter(angle, radius, size, alpha, trail) {
        const x = cx + Math.cos(angle) * radius;
        const y = cy + Math.sin(angle) * radius;
        ctx.save();
        ctx.shadowColor = getColor(alpha);
        ctx.shadowBlur  = hovered ? 12 : 6;
        ctx.fillStyle   = getColor(alpha);
        ctx.beginPath();
        ctx.arc(x, y, size, 0, Math.PI * 2);
        ctx.fill();
        if (trail) {
            ctx.shadowBlur = 0;
            for (let tr = 1; tr <= 5; tr++) {
                const ta = angle - tr * 0.1;
                const fa = alpha * (1 - tr * 0.18);
                ctx.fillStyle = getColor(Math.max(fa, 0));
                ctx.beginPath();
                ctx.arc(cx + Math.cos(ta)*radius, cy + Math.sin(ta)*radius, size * (1 - tr * 0.16), 0, Math.PI * 2);
                ctx.fill();
            }
        }
        ctx.restore();
    }

    function frame() {
        ctx.clearRect(0, 0, W, H);
        t += hovered ? 0.024 : 0.013;

        // ── dashed rings ──
        drawRing(19, 0.6, hovered ? 0.28 : 0.12, -t * 22,   [3, 8]);
        drawRing(14, 0.8, hovered ? 0.42 : 0.20,  t * 32,   [4, 6]);
        drawRing( 9, 0.5, hovered ? 0.22 : 0.10, -t * 50,   [2, 10]);

        // ── sweeping solid arcs ──
        drawArc(17, 1.4, hovered ? 0.75 : 0.42,  t,          Math.PI * 1.1);
        drawArc(11, 1.0, hovered ? 0.55 : 0.28, -t * 1.6,   Math.PI * 0.7);
        drawArc(20, 0.6, hovered ? 0.35 : 0.14,  t * 0.7,   Math.PI * 0.5);

        // ── radial glow ──
        drawGlowCore();

        // ── ambient particle cloud ──
        parts.forEach(p => {
            p.angle += p.speed * (hovered ? 1.7 : 1);
            p.angle += p.drift;
            drawOrbiter(p.angle, p.radius, p.size * (hovered ? 1.25 : 1), Math.min(p.opacity * (hovered ? 1.5 : 1), 0.85), false);
        });

        // ── 5 main bright orbiters with trails ──
        drawOrbiter( t * 2.2,                  17, 2.0, hovered ? 1.0 : 0.75, true);
        drawOrbiter( t * 2.2 + Math.PI,        17, 1.3, hovered ? 0.7 : 0.5,  true);
        drawOrbiter(-t * 1.6,                  11, 1.6, hovered ? 0.9 : 0.6,  true);
        drawOrbiter(-t * 1.6 + Math.PI,        11, 1.0, hovered ? 0.55: 0.38, true);
        drawOrbiter( t * 3.5 + Math.PI * 0.4,  20, 1.1, hovered ? 0.6 : 0.32, true);

        // ── click flash ──
        if (clicking) {
            const fg = ctx.createRadialGradient(cx, cy, 0, cx, cy, 28);
            fg.addColorStop(0, getColor(0.6));
            fg.addColorStop(1, getColor(0));
            ctx.fillStyle = fg;
            ctx.beginPath();
            ctx.arc(cx, cy, 28, 0, Math.PI * 2);
            ctx.fill();
        }

        requestAnimationFrame(frame);
    }

    resize();
    window.addEventListener('resize', resize);
    frame();
})();
</script>
