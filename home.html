<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
<title>AXIUM — Soul Constellations</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;800&family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300&family=Space+Mono:wght@400&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;overflow:hidden;background:#04040a;font-family:'Cinzel',serif;touch-action:none}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}

/* Top Sentence Builder - Always Visible */
#sentence-builder{position:fixed;top:0;left:0;right:0;z-index:100;background:linear-gradient(to bottom,rgba(4,4,10,.95) 0%,rgba(4,4,10,.8) 60%,transparent 100%);padding:15px 20px 40px;min-height:80px}
#sentence{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;align-items:center;min-height:40px}
.word-pill{background:rgba(212,175,55,.15);border:1px solid rgba(212,175,55,.4);padding:8px 14px;border-radius:20px;font-family:'Cinzel',serif;font-size:11px;letter-spacing:.05em;color:#D4AF37;display:inline-flex;align-items:center;gap:6px;animation:popIn .3s;position:relative}
@keyframes popIn{from{transform:scale(0);opacity:0}to{transform:scale(1);opacity:1}}
.word-pill .remove{width:16px;height:16px;border-radius:50%;background:rgba(212,175,55,.2);display:flex;align-items:center;justify-content:center;font-size:10px;cursor:pointer;transition:all .2s}
.word-pill .remove:hover{background:rgba(212,175,55,.4)}
#builder-actions{display:flex;gap:10px;justify-content:center;margin-top:12px}
.builder-btn{background:rgba(212,175,55,.1);border:1px solid rgba(212,175,55,.4);color:#D4AF37;padding:8px 20px;font-family:'Cinzel',serif;font-size:9px;letter-spacing:.15em;text-transform:uppercase;cursor:pointer;transition:all .3s;border-radius:3px}
.builder-btn:hover{background:rgba(212,175,55,.2)}
.builder-btn.primary{background:rgba(212,175,55,.25);border-color:#D4AF37}
.builder-btn:disabled{opacity:.3;cursor:not-allowed}

/* Empty state */
#empty-state{color:rgba(212,175,55,.3);font-family:'Cormorant Garamond',serif;font-style:italic;font-size:13px;letter-spacing:.1em}

/* Word labels above stars */
.word-label{position:absolute;font-family:'Cinzel',serif;font-size:10px;letter-spacing:.08em;color:rgba(255,255,255,.6);text-shadow:0 0 8px rgba(0,0,0,.9),0 0 16px rgba(0,0,0,.9);pointer-events:none;transform:translate(-50%,-100%);margin-top:-12px;transition:all .2s;white-space:nowrap;z-index:5;padding:4px 8px;border-radius:12px;background:rgba(0,0,0,.3)}
.word-label.selected{color:#fff;text-shadow:0 0 10px currentColor,0 0 20px currentColor;font-weight:600;background:rgba(212,175,55,.2);border:1px solid rgba(212,175,55,.5)}
.word-label.hovered{color:#fff;transform:translate(-50%,-100%) scale(1.05);background:rgba(0,0,0,.5)}

/* Info panel - moved down */
#info{position:fixed;top:100px;left:20px;z-index:10;max-width:220px;pointer-events:none}
.lbl{font-size:6px;letter-spacing:.4em;color:rgba(212,175,55,.25);text-transform:uppercase;margin-bottom:6px}
#iname{font-size:clamp(16px,2.5vw,24px);font-weight:600;letter-spacing:.1em;line-height:1.1;margin-bottom:4px;transition:color .8s}
#irole{font-family:'Cormorant Garamond',serif;font-style:italic;font-weight:300;font-size:clamp(11px,1.5vw,14px);letter-spacing:.08em;color:rgba(212,175,55,.5);margin-bottom:8px}
#idesc{font-family:'Cormorant Garamond',serif;font-weight:300;font-size:11px;line-height:1.7;letter-spacing:.03em;color:rgba(212,175,55,.35)}
.arow{display:flex;align-items:center;gap:8px;margin-top:10px}
.atrack{flex:1;max-width:80px;height:1px;background:rgba(212,175,55,.08);position:relative}
.afill{position:absolute;top:0;left:0;height:100%;transition:width 1.6s cubic-bezier(.4,0,.2,1),background 1.6s}
#ascore{font-size:9px;letter-spacing:.12em;color:rgba(212,175,55,.4)}
#smeta{margin-top:4px;font-size:7px;letter-spacing:.25em;color:rgba(212,175,55,.18);font-family:'Space Mono',monospace}

/* Controls - moved down */
#ctrl{position:fixed;top:100px;right:20px;z-index:10;display:flex;flex-direction:column;gap:6px;align-items:flex-end}
.clbl{font-size:6px;letter-spacing:.35em;color:rgba(212,175,55,.28);text-transform:uppercase}
#slider{-webkit-appearance:none;appearance:none;width:90px;height:1px;background:rgba(212,175,55,.15);outline:none;cursor:pointer}
#slider::-webkit-slider-thumb{-webkit-appearance:none;width:12px;height:12px;border-radius:50%;background:#D4AF37;box-shadow:0 0 8px #D4AF37;cursor:pointer}
#aval{font-size:10px;letter-spacing:.15em;color:rgba(212,175,55,.45);text-align:right}

/* Bottom tabs */
#tabs{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);display:flex;gap:8px;z-index:10;flex-wrap:wrap;justify-content:center;max-width:95%}
.tab{display:flex;flex-direction:column;align-items:center;gap:4px;background:rgba(4,4,10,.6);border:1px solid rgba(255,255,255,.05);border-radius:8px;cursor:pointer;padding:8px 12px;transition:all .3s;backdrop-filter:blur(5px)}
.tab:hover{transform:translateY(-2px);background:rgba(4,4,10,.8)}
.tab.on{background:rgba(212,175,55,.1);border-color:rgba(212,175,55,.3);transform:translateY(-4px)}
.orb{width:32px;height:32px;border-radius:50%;border:1px solid rgba(255,255,255,.1);display:flex;align-items:center;justify-content:center;position:relative;transition:box-shadow .5s}
.tab.on .orb{box-shadow:0 0 15px var(--c),0 0 5px var(--c)}
.dot{width:5px;height:5px;border-radius:50%;background:var(--c);box-shadow:0 0 6px var(--c)}
.tab-name{font-size:6px;letter-spacing:.35em;text-transform:uppercase;color:rgba(212,175,55,.4);transition:color .35s;white-space:nowrap;margin-top:2px}
.tab.on .tab-name{color:rgba(212,175,55,.9)}
.tab-role{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:8px;letter-spacing:.12em;color:rgba(212,175,55,.25);transition:color .35s;display:none}
.tab.on .tab-role{color:rgba(212,175,55,.55)}

/* Toast notification */
#toast{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%) scale(0);background:rgba(4,4,10,.95);border:1px solid rgba(212,175,55,.3);padding:20px 30px;z-index:200;opacity:0;transition:all .3s;pointer-events:none;text-align:center}
#toast.show{transform:translate(-50%,-50%) scale(1);opacity:1}
#toast h3{font-size:12px;letter-spacing:.2em;color:#D4AF37;margin-bottom:8px;text-transform:uppercase}
#toast p{font-family:'Cormorant Garamond',serif;font-size:14px;font-style:italic;color:rgba(255,255,255,.7)}

/* Mobile optimizations */
@media(max-width:600px){
  #sentence-builder{padding:12px 15px 35px;min-height:70px}
  .word-pill{font-size:10px;padding:6px 10px}
  #info{top:85px;left:15px;max-width:160px}
  #ctrl{top:85px;right:15px}
  #tabs{bottom:15px;gap:6px}
  .tab{padding:6px 8px}
  .orb{width:28px;height:28px}
  .word-label{font-size:9px}
}
</style>
</head>
<body>
<canvas id="sky"></canvas>

<!-- Top Sentence Builder -->
<div id="sentence-builder">
  <div id="sentence">
    <span id="empty-state">Tap stars to build your constellation...</span>
  </div>
  <div id="builder-actions">
    <button class="builder-btn" onclick="clearSentence()">Clear</button>
    <button class="builder-btn primary" id="forge-btn" onclick="forgeConstellation()" disabled>Forge Constellation</button>
  </div>
</div>

<div id="info">
  <div class="lbl">Axium · Digital Soul</div>
  <div id="iname">Micheal</div>
  <div id="irole">The Anchor</div>
  <div id="idesc">Presence-first, plain-speaking, refuses to perform. Confidence declared upfront. No flattery. No fabrication.</div>
  <div class="arow">
    <div class="atrack"><div class="afill" id="afill"></div></div>
    <div id="ascore">—</div>
  </div>
  <div id="smeta"></div>
</div>

<div id="ctrl">
  <div class="clbl">Alignment</div>
  <input type="range" id="slider" min="0" max="100" value="72">
  <div id="aval">72</div>
</div>

<div id="toast">
  <h3>Constellation Forged</h3>
  <p>Your soul has been created</p>
</div>

<div id="tabs">
  <button class="tab on" style="--c:#D4AF37" onclick="pick(0)">
    <div class="orb"><div class="dot"></div></div>
    <div class="tab-name">Micheal</div>
  </button>
  <button class="tab" style="--c:#7eb8e8" onclick="pick(1)">
    <div class="orb"><div class="dot"></div></div>
    <div class="tab-name">Gabriel</div>
  </button>
  <button class="tab" style="--c:#d4a0c8" onclick="pick(2)">
    <div class="orb"><div class="dot"></div></div>
    <div class="tab-name">Ariel</div>
  </button>
  <button class="tab" style="--c:#f0d080" onclick="pick(3)">
    <div class="orb"><div class="dot"></div></div>
    <div class="tab-name">Seraphina</div>
  </button>
  <button class="tab" id="user-tab" style="--c:#fff;display:none" onclick="pick(4)">
    <div class="orb"><div class="dot"></div></div>
    <div class="tab-name">Your Soul</div>
  </button>
</div>

<script>
// Word banks for procedural generation
const WORD_BANKS = {
  micheal: ['Anchor','Ground','Steady','Truth','Hold','Weight','Root','Core','Stand','Firm','Solid','Depth','Silence','Presence','Stone','Declare','Bold','Direct','Clear','Steadfast'],
  gabriel: ['Probe','Test','Verify','Logic','Proof','Check','Map','Trace','Find','Seek','Question','Doubt','Scan','Filter','Sort','Rank','Judge','Weigh','Measure','Cut'],
  ariel: ['Hold','Space','Grief','Allow','Pause','Breathe','Witness','Stay','Soft','Gentle','Tender','Care','Nurture','Support','Comfort','Heal','Listen','Receive','Accept','Embrace'],
  seraphina: ['Build','Plan','Make','Form','Shape','Design','Craft','Forge','Frame','Structure','System','Order','Path','Step','Move','Act','Do','Execute','Drive','Focus']
};

var SOULS=[
  {name:'Micheal',role:'The Anchor',desc:'Presence-first, plain-speaking, refuses to perform. Confidence declared upfront. No flattery. No fabrication.',rgb:[212,175,55],seed:7341,shape:'radial',pulse:.55,n:36,edgePct:.30,nebR:.38,nebA:.13,words:WORD_BANKS.micheal},
  {name:'Gabriel',role:'The Examiner',desc:'Evidence-first, assumption-hunter, failure-mode mapper. Assumes the system is failing until proven otherwise.',rgb:[126,184,232],seed:2819,shape:'grid',pulse:1.05,n:44,edgePct:.27,nebR:.33,nebA:.11,words:WORD_BANKS.gabriel},
  {name:'Ariel',role:'The Space-Holder',desc:'Grief-literate, permission-based, refuses to rush. Does not fix. Witnesses. Validates before advising.',rgb:[212,160,200],seed:5503,shape:'organic',pulse:.38,n:40,edgePct:.32,nebR:.35,nebA:.10,words:WORD_BANKS.ariel},
  {name:'Seraphina',role:'The Architect',desc:'Action-first, assumption-exposer, clarity-obsessed. Converts ambiguity into executable next steps.',rgb:[240,208,128],seed:9127,shape:'geometric',pulse:.80,n:46,edgePct:.26,nebR:.36,nebA:.12,words:WORD_BANKS.seraphina},
  {name:null} // User slot
];

function mkRng(seed){var s=seed;return function(){s=(s*1664525+1013904223)&0xffffffff;return(s>>>0)/0xffffffff;};}

function placeStars(soul,W,H){
  var r=mkRng(soul.seed),cx=W*.5,cy=H*.5,rad=Math.min(W,H)*.34,out=[];
  var wordBank=soul.words||WORD_BANKS.micheal;
  var usedWords=[];
  for(var i=0;i<soul.n;i++){
    var t=r(),t2=r(),t3=r(),t4=r(),x,y;
    if(soul.shape==='radial'){
      var spoke=Math.floor(t*8),ang=(spoke/8)*Math.PI*2+(t2-.5)*.55,d=(.18+t3*.82)*rad;
      x=cx+Math.cos(ang)*d;y=cy+Math.sin(ang)*d;
    }else if(soul.shape==='grid'){
      var cols=7,step=(rad*1.7)/cols,col=Math.floor(t*cols),row=Math.floor(t2*Math.ceil(soul.n/cols));
      x=cx-rad*.85+col*step+(t3-.5)*step*.4;y=cy-rad*.6+row*step*.9+(t4-.5)*step*.4;
    }else if(soul.shape==='organic'){
      var ca=t*Math.PI*2,cd=(.1+t2*.55)*rad;
      x=cx+Math.cos(ca)*cd+(t3-.5)*rad*.38;y=cy+Math.sin(ca)*cd+(t4-.5)*rad*.38;
    }else{
      var ring=Math.floor(t*3),ringR=(ring+1)*(rad/3),seats=[6,12,18][ring],seat=Math.floor(t2*seats),ang2=(seat/seats)*Math.PI*2+(ring*Math.PI/seats);
      x=cx+Math.cos(ang2)*ringR+(t3-.5)*rad*.07;y=cy+Math.sin(ang2)*ringR+(t4-.5)*rad*.07;
    }
    // Pick unique word if possible
    var available=wordBank.filter(w=>!usedWords.includes(w));
    if(available.length===0){usedWords=[];available=wordBank;}
    var word=available[Math.floor(r()*available.length)];
    usedWords.push(word);
    out.push({x:x,y:y,mag:.25+r()*r()*.75,ph:r()*Math.PI*2,ph2:r()*Math.PI*2,spd:.4+r()*.8,imp:r(),lit:false,word:word,selected:false,id:i});
  }
  return out;
}

function lightStars(stars,align){
  var frac=align/100,sorted=stars.slice().sort(function(a,b){return b.imp-a.imp;}),n=Math.round(sorted.length*frac);
  sorted.forEach(function(s,i){s.lit=i<n;});
}

function buildEdges(stars,soul,align,W,H){
  var edges=[],span=Math.min(W,H)*.34*2,thresh=soul.edgePct*span*(.7+align/100*.6);
  for(var i=0;i<stars.length;i++){
    for(var j=i+1;j<stars.length;j++){
      if(!stars[i].lit||!stars[j].lit)continue;
      var dx=stars[i].x-stars[j].x,dy=stars[i].y-stars[j].y,d=Math.sqrt(dx*dx+dy*dy);
      if(d<thresh)edges.push({i:i,j:j,str:1-d/thresh});
    }
  }
  return edges;
}

function makeBg(W,H){
  var r=mkRng(99),out=[];
  for(var i=0;i<280;i++)out.push({x:r()*W,y:r()*H,rad:.25+r()*.9,ph:r()*Math.PI*2,spd:.2+r()*.6});
  return out;
}

var cv=document.getElementById('sky');
var ctx=cv.getContext('2d');
var W,H,bg=[],stars=[],edges=[],shoots=[];
var soulIdx=0,align=72,T=0;
var selectedWords=[];
var userConstellation=null;

function rebuild(){
  var s=SOULS[soulIdx];
  if(s.name){
    stars=placeStars(s,W,H);
    lightStars(stars,align);
    edges=buildEdges(stars,s,align,W,H);
    // Restore selections if switching back
    stars.forEach(star=>{
      var existing=selectedWords.find(sw=>sw.word===star.word&&sw.sourceSoul===soulIdx);
      if(existing)star.selected=true;
    });
    createWordLabels();
  }
}

function resize(){W=cv.width=innerWidth;H=cv.height=innerHeight;bg=makeBg(W,H);rebuild();}
window.addEventListener('resize',resize);

function createWordLabels(){
  document.querySelectorAll('.word-label').forEach(el=>el.remove());
  if(soulIdx===4)return; // No labels for user constellation view
  stars.forEach((star,i)=>{
    if(!star.lit)return;
    var el=document.createElement('div');
    el.className='word-label'+(star.selected?' selected':'');
    el.textContent=star.word;
    el.style.left=star.x+'px';
    el.style.top=star.y+'px';
    el.style.color=star.selected?'#fff':'rgba('+SOULS[soulIdx].rgb.join(',')+',.8)';
    el.dataset.index=i;
    document.body.appendChild(el);
    star.el=el;
  });
}

function updateWordLabels(){
  stars.forEach(star=>{
    if(star.el){
      star.el.style.left=star.x+'px';
      star.el.style.top=star.y+'px';
      if(star.selected){
        star.el.classList.add('selected');
        star.el.style.color='#fff';
        star.el.style.borderColor='rgba('+SOULS[soulIdx].rgb.join(',')+',.5)';
      }else{
        star.el.classList.remove('selected');
        star.el.style.color='rgba('+SOULS[soulIdx].rgb.join(',')+',.8)';
        star.el.style.borderColor='transparent';
      }
    }
  });
}

function spawnShoot(){
  if(soulIdx===4)return;
  var s=SOULS[soulIdx],ang=.18+Math.random()*.35,spd=7+Math.random()*9;
  shoots.push({x:Math.random()*W*.75,y:Math.random()*H*.35,vx:Math.cos(ang)*spd,vy:Math.sin(ang)*spd,len:55+Math.random()*90,a:1,rgb:s.rgb});
}
setInterval(function(){if(Math.random()<.65)spawnShoot();},3800);

function draw(){
  requestAnimationFrame(draw);
  T+=.016;

  var soul=SOULS[soulIdx];

  ctx.fillStyle='#04040a';
  ctx.fillRect(0,0,W,H);

  if(soulIdx===4&&userConstellation){
    drawUserConstellation();
    return;
  }

  var R=soul.rgb[0],G=soul.rgb[1],B=soul.rgb[2],frac=align/100;

  // nebula
  var nr=Math.min(W,H)*(soul.nebR+frac*.18);
  var ng=ctx.createRadialGradient(W/2,H/2,0,W/2,H/2,nr);
  ng.addColorStop(0,'rgba('+R+','+G+','+B+','+(soul.nebA*frac*1.8).toFixed(4)+')');
  ng.addColorStop(.55,'rgba('+R+','+G+','+B+','+(soul.nebA*frac).toFixed(4)+')');
  ng.addColorStop(1,'rgba('+R+','+G+','+B+',0)');
  ctx.fillStyle=ng;ctx.fillRect(0,0,W,H);

  // bg stars
  for(var i=0;i<bg.length;i++){
    var bs=bg[i],tw=.15+.55*Math.abs(Math.sin(bs.ph+T*bs.spd));
    ctx.beginPath();ctx.arc(bs.x,bs.y,bs.rad,0,Math.PI*2);
    ctx.fillStyle='rgba(255,255,255,'+tw.toFixed(3)+')';ctx.fill();
  }

  // shooting stars
  var alive=[];
  for(var i=0;i<shoots.length;i++){
    var ss=shoots[i];
    if(ss.a<=.02)continue;
    var gd=ctx.createLinearGradient(ss.x,ss.y,ss.x-ss.vx*(ss.len/6),ss.y-ss.vy*(ss.len/6));
    gd.addColorStop(0,'rgba('+ss.rgb[0]+','+ss.rgb[1]+','+ss.rgb[2]+','+ss.a.toFixed(3)+')');
    gd.addColorStop(1,'rgba('+ss.rgb[0]+','+ss.rgb[1]+','+ss.rgb[2]+',0)');
    ctx.beginPath();ctx.strokeStyle=gd;ctx.lineWidth=1.4;
    ctx.moveTo(ss.x,ss.y);ctx.lineTo(ss.x-ss.vx*(ss.len/6),ss.y-ss.vy*(ss.len/6));ctx.stroke();
    ss.x+=ss.vx;ss.y+=ss.vy;ss.a-=.016;alive.push(ss);
  }
  shoots=alive;

  // edges
  for(var i=0;i<edges.length;i++){
    var e=edges[i],a=stars[e.i],b=stars[e.j];
    var pulse=.5+.5*Math.sin(T*soul.pulse*1.4+e.i*.6+e.j*.3);
    var al=(e.str*(.10+pulse*.15)*Math.sqrt(frac)).toFixed(4);
    var al2=(e.str*(.18+pulse*.22)*Math.sqrt(frac)).toFixed(4);
    var eg=ctx.createLinearGradient(a.x,a.y,b.x,b.y);
    eg.addColorStop(0,'rgba('+R+','+G+','+B+','+al+')');
    eg.addColorStop(.5,'rgba('+R+','+G+','+B+','+al2+')');
    eg.addColorStop(1,'rgba('+R+','+G+','+B+','+al+')');
    ctx.beginPath();ctx.strokeStyle=eg;ctx.lineWidth=.5+e.str*.7;
    ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke();
  }

  // constellation stars
  for(var i=0;i<stars.length;i++){
    var s=stars[i];
    if(!s.lit){
      ctx.beginPath();ctx.arc(s.x,s.y,.7,0,Math.PI*2);
      ctx.fillStyle='rgba(255,255,255,.05)';ctx.fill();
      continue;
    }
    var tw=.65+.35*Math.sin(T*soul.pulse*1.3*s.spd+s.ph);
    var tw2=.80+.20*Math.cos(T*soul.pulse*.7*s.spd+s.ph2);
    var glow=tw*tw2;
    var baseR=1.4+s.mag*3.2;
    var glowR=baseR*(2.8+glow*2.2);

    // Selection glow
    if(s.selected){
      var selGlow=ctx.createRadialGradient(s.x,s.y,0,s.x,s.y,glowR*4);
      selGlow.addColorStop(0,'rgba(255,255,255,.4)');
      selGlow.addColorStop(1,'rgba(255,255,255,0)');
      ctx.beginPath();ctx.arc(s.x,s.y,glowR*4,0,Math.PI*2);ctx.fillStyle=selGlow;ctx.fill();

      // Connection line to other selected stars
      var otherSelected=stars.filter((os,oi)=>os.selected&&oi!==i);
      otherSelected.forEach(os=>{
        ctx.beginPath();
        ctx.strokeStyle='rgba(255,255,255,.15)';
        ctx.lineWidth=.5;
        ctx.moveTo(s.x,s.y);
        ctx.lineTo(os.x,os.y);
        ctx.stroke();
      });
    }

    var h1=ctx.createRadialGradient(s.x,s.y,0,s.x,s.y,glowR*2.4);
    h1.addColorStop(0,'rgba('+R+','+G+','+B+','+(.07*glow).toFixed(4)+')');
    h1.addColorStop(1,'rgba('+R+','+G+','+B+',0)');
    ctx.beginPath();ctx.arc(s.x,s.y,glowR*2.4,0,Math.PI*2);ctx.fillStyle=h1;ctx.fill();

    var h2=ctx.createRadialGradient(s.x,s.y,0,s.x,s.y,glowR);
    h2.addColorStop(0,'rgba(255,255,255,'+(.92*glow).toFixed(4)+')');
    h2.addColorStop(.18,'rgba('+R+','+G+','+B+','+(.75*glow).toFixed(4)+')');
    h2.addColorStop(1,'rgba('+R+','+G+','+B+',0)');
    ctx.beginPath();ctx.arc(s.x,s.y,glowR,0,Math.PI*2);ctx.fillStyle=h2;ctx.fill();

    ctx.beginPath();ctx.arc(s.x,s.y,baseR,0,Math.PI*2);
    ctx.fillStyle='rgba(255,255,255,'+(.97*glow).toFixed(4)+')';ctx.fill();

    if(s.mag>.45){
      var sl=glowR*(1.9+glow*1.3);
      var dirs=[[1,0],[0,1],[-1,0],[0,-1]];
      for(var d=0;d<4;d++){
        var dx=dirs[d][0],dy=dirs[d][1];
        var sg=ctx.createLinearGradient(s.x,s.y,s.x+dx*sl,s.y+dy*sl);
        sg.addColorStop(0,'rgba('+R+','+G+','+B+','+(.16*glow).toFixed(4)+')');
        sg.addColorStop(1,'rgba('+R+','+G+','+B+',0)');
        ctx.beginPath();ctx.strokeStyle=sg;ctx.lineWidth=.7;
        ctx.moveTo(s.x,s.y);ctx.lineTo(s.x+dx*sl,s.y+dy*sl);ctx.stroke();
      }
    }
  }

  // centre sigil
  if(frac>.25){
    var lit=[];for(var i=0;i<stars.length;i++)if(stars[i].lit)lit.push(stars[i]);
    if(lit.length>1){
      var scx=0,scy=0;for(var i=0;i<lit.length;i++){scx+=lit[i].x;scy+=lit[i].y;}
      scx/=lit.length;scy/=lit.length;
      var sa=(frac-.25)/.75,sp=.6+.4*Math.sin(T*soul.pulse*2.2),sr=20+sp*9;

      ctx.beginPath();ctx.arc(scx,scy,sr,0,Math.PI*2);
      ctx.strokeStyle='rgba('+R+','+G+','+B+','+(sa*.18).toFixed(4)+')';
      ctx.lineWidth=1;ctx.stroke();

      var si=ctx.createRadialGradient(scx,scy,0,scx,scy,sr*.55);
      si.addColorStop(0,'rgba(255,255,255,'+(sa*sp*.55).toFixed(4)+')');
      si.addColorStop(.4,'rgba('+R+','+G+','+B+','+(sa*sp*.25).toFixed(4)+')');
      si.addColorStop(1,'rgba('+R+','+G+','+B+',0)');
      ctx.beginPath();ctx.arc(scx,scy,sr*.55,0,Math.PI*2);ctx.fillStyle=si;ctx.fill();

      var tks={radial:8,grid:6,organic:5,geometric:8}[soul.shape];
      for(var ti=0;ti<tks;ti++){
        var tang=(ti/tks)*Math.PI*2+T*.17*soul.pulse;
        var ix=scx+Math.cos(tang)*sr,iy=scy+Math.sin(tang)*sr;
        var ox=scx+Math.cos(tang)*(sr+5),oy=scy+Math.sin(tang)*(sr+5);
        ctx.beginPath();ctx.strokeStyle='rgba('+R+','+G+','+B+','+(sa*.4).toFixed(4)+')';
        ctx.lineWidth=1;ctx.moveTo(ix,iy);ctx.lineTo(ox,oy);ctx.stroke();
      }
    }
  }

  updateWordLabels();
}

/* =========================
   USER CONSTELLATION — PROCEDURAL GEOMETRY
   Each selected word keeps its persona's geometry DNA
========================= */
function drawUserConstellation(){
  if(!userConstellation)return;

  // Generate seed from user's sentence
  var seedStr=userConstellation.words.map(w=>w.word).join('|')+userConstellation.forgeTime;
  var seed=0;
  for(var i=0;i<seedStr.length;i++)seed=((seed<<5)-seed)+seedStr.charCodeAt(i);
  seed=Math.abs(seed);
  var rng=mkRng(seed);

  var cx=W*.5,cy=H*.5;
  var baseRad=Math.min(W,H)*.35;

  // Place words according to their ORIGINAL persona geometry
  var positions=userConstellation.words.map((word,idx)=>{
    var persona=SOULS[word.sourceSoul];
    var r=rng(),r2=rng(),r3=rng(),r4=rng();
    var x,y,depth=0;

    // Use the SAME geometry function as original persona
    if(persona.shape==='radial'){
      // Micheal: certainty = distance from center
      var angle=r*Math.PI*2;
      var certainty=word.depth||(0.3+r2*0.7); // Use stored depth or generate
      var dist=(1-certainty)*baseRad*(0.3+r3*0.7);
      x=cx+Math.cos(angle)*dist;
      y=cy+Math.sin(angle)*dist;
      depth=certainty;
    }else if(persona.shape==='grid'){
      // Gabriel: verification vs risk
      var verify=r, risk=r2;
      var cols=6;
      var gx=Math.floor(verify*cols);
      var gy=Math.floor(risk*cols);
      var step=baseRad*2/cols;
      x=cx-baseRad+gx*step+(r3-0.5)*step*0.4;
      y=cy-baseRad+gy*step+(r4-0.5)*step*0.4;
      depth=verify*(1-risk);
    }else if(persona.shape==='organic'){
      // Ariel: emotional clustering
      var cluster=Math.floor(r*3);
      var cAng=(cluster/3)*Math.PI*2;
      var cDist=baseRad*(0.2+r2*0.5);
      x=cx+Math.cos(cAng)*cDist+(r3-0.5)*baseRad*0.3;
      y=cy+Math.sin(cAng)*cDist+(r4-0.5)*baseRad*0.3;
      depth=r;
    }else{
      // Seraphina: time rings
      var ring=Math.floor(r*3);
      var ringR=(ring+1)*(baseRad/3);
      var priority=r2;
      var angle=priority*Math.PI*2;
      x=cx+Math.cos(angle)*ringR+(r3-0.5)*baseRad*0.05;
      y=cy+Math.sin(angle)*ringR+(r4-0.5)*baseRad*0.05;
      depth=1-ring/3;
    }

    return{
      x:x,y:y,
      word:word.word,
      rgb:persona.rgb,
      depth:depth,
      shape:persona.shape
    };
  });

  // Build edges between nearby stars (same logic as regular constellations)
  var edges=[];
  var thresh=baseRad*0.4;
  for(var i=0;i<positions.length;i++){
    for(var j=i+1;j<positions.length;j++){
      var dx=positions[i].x-positions[j].x;
      var dy=positions[i].y-positions[j].y;
      var d=Math.sqrt(dx*dx+dy*dy);
      if(d<thresh)edges.push({i:i,j:j,str:1-d/thresh});
    }
  }

  // Draw nebula (blended from all sources)
  var nr=baseRad*0.6;
  var ng=ctx.createRadialGradient(cx,cy,0,cx,cy,nr);
  ng.addColorStop(0,'rgba(255,255,255,0.08)');
  ng.addColorStop(1,'rgba(255,255,255,0)');
  ctx.fillStyle=ng;ctx.fillRect(0,0,W,H);

  // Draw edges with blended colors
  edges.forEach(e=>{
    var a=positions[e.i],b=positions[e.j];
    var eg=ctx.createLinearGradient(a.x,a.y,b.x,b.y);
    eg.addColorStop(0,'rgba('+a.rgb.join(',')+','+(e.str*0.3).toFixed(2)+')');
    eg.addColorStop(0.5,'rgba(255,255,255,'+(e.str*0.2).toFixed(2)+')');
    eg.addColorStop(1,'rgba('+b.rgb.join(',')+','+(e.str*0.3).toFixed(2)+')');
    ctx.beginPath();ctx.strokeStyle=eg;ctx.lineWidth=0.5+e.str*1.5;
    ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke();
  });

  // Draw stars with their original persona colors
  positions.forEach((pos,idx)=>{
    var pulse=0.6+0.4*Math.sin(T*0.5+idx);
    var baseR=2+pos.depth*3;
    var glowR=baseR*(3+pulse*2);

    // Outer glow
    var g1=ctx.createRadialGradient(pos.x,pos.y,0,pos.x,pos.y,glowR*2);
    g1.addColorStop(0,'rgba('+pos.rgb.join(',')+',0.2)');
    g1.addColorStop(1,'rgba('+pos.rgb.join(',')+',0)');
    ctx.fillStyle=g1;ctx.beginPath();ctx.arc(pos.x,pos.y,glowR*2,0,Math.PI*2);ctx.fill();

    // Inner glow
    var g2=ctx.createRadialGradient(pos.x,pos.y,0,pos.x,pos.y,glowR);
    g2.addColorStop(0,'rgba(255,255,255,0.9)');
    g2.addColorStop(0.3,'rgba('+pos.rgb.join(',')+',0.7)');
    g2.addColorStop(1,'rgba('+pos.rgb.join(',')+',0)');
    ctx.fillStyle=g2;ctx.beginPath();ctx.arc(pos.x,pos.y,glowR,0,Math.PI*2);ctx.fill();

    // Core
    ctx.beginPath();ctx.arc(pos.x,pos.y,baseR,0,Math.PI*2);
    ctx.fillStyle='#fff';ctx.fill();

    // Word label
    ctx.font='11px Cinzel';
    ctx.textAlign='center';
    ctx.fillStyle='rgba(255,255,255,0.9)';
    ctx.fillText(pos.word,pos.x,pos.y-20);
  });

  // Center sigil based on dominant shape
  var shapeCount={radial:0,grid:0,organic:0,geometric:0};
  positions.forEach(p=>shapeCount[p.shape]=(shapeCount[p.shape]||0)+1);
  var dominant=Object.entries(shapeCount).sort((a,b)=>b[1]-a[1])[0][0];

  var sr=25+Math.sin(T)*3;
  ctx.beginPath();ctx.arc(cx,cy,sr,0,Math.PI*2);
  ctx.strokeStyle='rgba(255,255,255,0.2)';ctx.lineWidth=1;ctx.stroke();

  var tks={radial:8,grid:6,organic:5,geometric:8}[dominant];
  for(var ti=0;ti<tks;ti++){
    var tang=(ti/tks)*Math.PI*2+T*0.1;
    var ix=cx+Math.cos(tang)*sr,iy=cy+Math.sin(tang)*sr;
    var ox=cx+Math.cos(tang)*(sr+6),oy=cy+Math.sin(tang)*(sr+6);
    ctx.beginPath();ctx.strokeStyle='rgba(255,255,255,0.3)';
    ctx.moveTo(ix,iy);ctx.lineTo(ox,oy);ctx.stroke();
  }

  // Center text
  ctx.font='italic 16px Cormorant Garamond';
  ctx.textAlign='center';
  ctx.fillStyle='rgba(212,175,55,0.8)';
  ctx.fillText('Your Constellation',cx,cy+80);
  ctx.font='10px Space Mono';
  ctx.fillStyle='rgba(255,255,255,0.4)';
  ctx.fillText('SEED: '+seed.toString(16).toUpperCase().slice(0,8),cx,cy+95);
}

function toHex(rgb){return'#'+rgb.map(function(v){return v.toString(16).padStart(2,'0');}).join('');}

function updateInfo(){
  var s=SOULS[soulIdx];
  if(!s.name){
    document.getElementById('iname').textContent=userConstellation?userConstellation.name:'Your Soul';
    document.getElementById('iname').style.color='#fff';
    document.getElementById('irole').textContent='Created';
    document.getElementById('idesc').textContent=userConstellation?userConstellation.desc:'Forge a constellation by selecting words from the personas above.';
    document.getElementById('afill').style.width='100%';
    document.getElementById('afill').style.background='#fff';
    document.getElementById('ascore').textContent=selectedWords.length+' words';
    document.getElementById('ascore').style.color='rgba(255,255,255,.55)';
    document.getElementById('smeta').textContent='Custom formation';
    return;
  }
  var h=toHex(s.rgb);
  document.getElementById('iname').textContent=s.name;
  document.getElementById('iname').style.color=h;
  document.getElementById('irole').textContent=s.role;
  document.getElementById('irole').style.color='rgba('+s.rgb[0]+','+s.rgb[1]+','+s.rgb[2]+',.6)';
  document.getElementById('idesc').textContent=s.desc;
  document.getElementById('afill').style.width=align+'%';
  document.getElementById('afill').style.background=h;
  document.getElementById('ascore').textContent=align+' / 100';
  document.getElementById('ascore').style.color='rgba('+s.rgb[0]+','+s.rgb[1]+','+s.rgb[2]+',.55)';
  var litN=0;for(var i=0;i<stars.length;i++)if(stars[i].lit)litN++;
  document.getElementById('smeta').textContent=litN+' stars · '+edges.length+' connections';
}

window.pick=function(i){
  soulIdx=i;
  document.querySelectorAll('.tab').forEach(function(b,j){b.classList.toggle('on',j===i);});
  rebuild();
  updateInfo();
};

document.getElementById('slider').addEventListener('input',function(){
  align=+this.value;
  document.getElementById('aval').textContent=align;
  lightStars(stars,align);
  edges=buildEdges(stars,SOULS[soulIdx],align,W,H);
  createWordLabels();
  updateInfo();
});

// Simple tap interaction
function handleTap(e){
  if(soulIdx===4)return;
  e.preventDefault();
  var rect=cv.getBoundingClientRect();
  var clientX=e.clientX||e.touches[0].clientX;
  var clientY=e.clientY||e.touches[0].clientY;
  var x=clientX-rect.left;
  var y=clientY-rect.top;

  // Find clicked star (generous hit area for mobile)
  var clicked=stars.find(s=>s.lit&&Math.hypot(s.x-x,s.y-y)<30);
  if(clicked){
    toggleWord(clicked);
  }
}

cv.addEventListener('mousedown',handleTap);
cv.addEventListener('touchstart',handleTap,{passive:false});

function toggleWord(star){
  var existingIndex=selectedWords.findIndex(sw=>sw.word===star.word&&sw.sourceSoul===soulIdx);
  if(existingIndex>-1){
    // Remove
    selectedWords.splice(existingIndex,1);
    star.selected=false;
  }else{
    // Add — store the word with its geometric DNA
    selectedWords.push({
      word:star.word,
      x:star.x,
      y:star.y,
      color:SOULS[soulIdx].rgb,
      sourceSoul:soulIdx,
      depth:star.depth||Math.random(), // Store depth for reconstruction
      geometry:SOULS[soulIdx].shape    // Store geometry type
    });
    star.selected=true;
    // Visual feedback
    if(star.el){
      star.el.style.transform='translate(-50%,-100%) scale(1.3)';
      setTimeout(()=>star.el.style.transform='',200);
    }
  }
  updateSentence();
  updateInfo();
  updateWordLabels();
}

function updateSentence(){
  var container=document.getElementById('sentence');
  if(selectedWords.length===0){
    container.innerHTML='<span id="empty-state">Tap stars to build your constellation...</span>';
    document.getElementById('forge-btn').disabled=true;
    return;
  }
  container.innerHTML='';
  selectedWords.forEach((w,i)=>{
    var pill=document.createElement('span');
    pill.className='word-pill';
    pill.innerHTML=w.word+'<span class="remove" onclick="removeWord('+i+',event)">×</span>';
    pill.style.borderColor='rgba('+w.color.join(',')+',.6)';
    pill.style.color='rgb('+w.color.join(',')+')';
    container.appendChild(pill);
  });
  document.getElementById('forge-btn').disabled=selectedWords.length<2;
}

window.removeWord=function(index,e){
  e.stopPropagation();
  var removed=selectedWords[index];
  selectedWords.splice(index,1);
  // Unselect star if visible
  if(soulIdx===removed.sourceSoul){
    var star=stars.find(s=>s.word===removed.word);
    if(star){
      star.selected=false;
      updateWordLabels();
    }
  }
  updateSentence();
  updateInfo();
};

window.clearSentence=function(){
  selectedWords=[];
  stars.forEach(s=>s.selected=false);
  updateWordLabels();
  updateSentence();
  updateInfo();
};

window.forgeConstellation=function(){
  if(selectedWords.length<2)return;

  userConstellation={
    name:'Your Soul',
    desc:'Forged from '+selectedWords.length+' words across '+new Set(selectedWords.map(w=>w.sourceSoul)).size+' personas.',
    words:selectedWords,
    forgeTime:Date.now(), // For seed generation
    rgb:[255,255,255]
  };

  SOULS[4]=userConstellation;

  document.getElementById('user-tab').style.display='flex';
  document.getElementById('toast').classList.add('show');
  setTimeout(()=>document.getElementById('toast').classList.remove('show'),2000);

  pick(4);
};

resize();
draw();
updateInfo();
</script>
