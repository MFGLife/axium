*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

}

}

.corner-seal.bl{bottom:20px;left:20px;border-right:none;border-top:none}

.corner-seal.bl::before{bottom:-5px;left:-5px}
.corner-seal.br::before{bottom:-5px;right:-5px}

}

.side-rune{

.side-rune span:nth-child(5){animation-delay:2.8s}
.side-rune span:nth-child(6){animation-delay:3.5s}
@keyframes runeFlicker{
  0%,85%,100%{opacity:0.12}
  90%{opacity:0.45;color:rgba(212,175,55,0.5);
    text-shadow:0 0 8px rgba(212,175,55,0.4)}

.spark{

<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.162.0/build/three.module.js"}}</script>
<script type="module">
import * as THREE from 'three';

const canvas = document.getElementById('three-canvas');
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(60, innerWidth/innerHeight, 0.1, 300);
camera.position.set(0, 0, 28);
const renderer = new THREE.WebGLRenderer({canvas, antialias:true, alpha:true});
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setClearColor(0x000000,0);
renderer.outputColorSpace = THREE.SRGBColorSpace;

const clock = new THREE.Clock();
const GOLD = new THREE.Color(0xD4AF37);

// ── PULSE ENGINE ──
const PULSE_COUNT=3;
const pulsePosArr=Array.from({length:PULSE_COUNT},()=>new THREE.Vector3(1e4,1e4,1e4));
const pulseTimeArr=new Array(PULSE_COUNT).fill(-1e4);
let lastPulseIdx=0;
function emitPulse(pos){
  lastPulseIdx=(lastPulseIdx+1)%PULSE_COUNT;
  pulsePosArr[lastPulseIdx].copy(pos);
  pulseTimeArr[lastPulseIdx]=clock.getElapsedTime();
}

// ── SHADERS ──
const NODE_VERT=`
uniform float uTime;uniform float uPulseTimes[3];uniform vec3 uPulsePositions[3];
varying float vPulse;
void main(){
  vec4 wp=modelMatrix*vec4(position,1.0);
  float pulse=0.0;
  for(int i=0;i<3;i++){
    float dt=uTime-uPulseTimes[i];if(dt<0.0||dt>3.5)continue;
    float wavR=dt*12.0;float dist=distance(wp.xyz,uPulsePositions[i]);
    float wave=abs(dist-wavR);
    pulse+=smoothstep(2.2,0.0,wave)*smoothstep(3.5,0.0,dt);
  }
  vPulse=min(pulse,1.0);
  float sc=1.0+0.12*sin(uTime*1.6+position.x*1.8)+vPulse*0.9;
  gl_Position=projectionMatrix*modelViewMatrix*vec4(position*sc,1.0);
}`;
const NODE_FRAG=`
uniform vec3 uColor;uniform float uTime;
varying float vPulse;
void main(){
  float bright=0.8+0.22*sin(uTime*0.9)+vPulse*0.6;
  vec3 col=uColor*bright;
  if(vPulse>0.0)col=mix(col,vec3(1.0),vPulse*0.35);
  gl_FragColor=vec4(col,1.0);
}`;
const LINE_VERT=`
uniform float uTime;uniform float uPulseTimes[3];uniform vec3 uPulsePositions[3];
varying float vPulse;
void main(){
  vec4 wp=modelMatrix*vec4(position,1.0);
  float pulse=0.0;
  for(int i=0;i<3;i++){
    float dt=uTime-uPulseTimes[i];if(dt<0.0||dt>3.5)continue;
    float wavR=dt*11.0;float dist=distance(wp.xyz,uPulsePositions[i]);
    float wave=abs(dist-wavR);
    pulse+=smoothstep(2.0,0.0,wave)*smoothstep(3.5,0.0,dt);
  }
  vPulse=min(pulse,1.0);
  gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);
}`;
const LINE_FRAG=`
uniform vec3 uColor;uniform float uBaseOpacity;
varying float vPulse;
void main(){
  float alpha=uBaseOpacity+vPulse*0.7;
  vec3 col=mix(uColor,vec3(1.0),vPulse*0.4);
  gl_FragColor=vec4(col,alpha);
}`;

function mkRng(seed){let s=seed>>>0;return()=>{s=(s*1664525+1013904223)>>>0;return s/4294967296}}

const nodeMeshes=[];
const lineObjects=[];
const constellationGroup=new THREE.Group();
scene.add(constellationGroup);

(function buildConstellation(){
  const rng=mkRng(0xAA3301);
  const NODE_COUNT=52;const pts=[];
  for(let i=0;i<NODE_COUNT;i++){
    const phi=Math.acos(2*rng()-1),theta=rng()*Math.PI*2;
    const r=2+rng()*12;
    pts.push(new THREE.Vector3(r*Math.sin(phi)*Math.cos(theta),r*Math.sin(phi)*Math.sin(theta),r*Math.cos(phi)));
  }
  for(let i=0;i<pts.length;i++){
    for(let j=i+1;j<pts.length;j++){
      const d=pts[i].distanceTo(pts[j]);
      if(d<6){
        const str=1-d/6;
        const geo=new THREE.BufferGeometry();
        geo.setAttribute('position',new THREE.Float32BufferAttribute([pts[i].x,pts[i].y,pts[i].z,pts[j].x,pts[j].y,pts[j].z],3));
        const mat=new THREE.ShaderMaterial({
          uniforms:{uColor:{value:GOLD.clone()},uBaseOpacity:{value:0.04+str*0.13},uTime:{value:0},uPulsePositions:{value:pulsePosArr},uPulseTimes:{value:pulseTimeArr}},
          vertexShader:LINE_VERT,fragmentShader:LINE_FRAG,
          transparent:true,depthWrite:false,blending:THREE.AdditiveBlending
        });
        constellationGroup.add(new THREE.Line(geo,mat));
        lineObjects.push(mat);
      }
    }
  }
  for(let i=0;i<pts.length;i++){
    const size=0.05+rng()*0.07;
    const mat=new THREE.ShaderMaterial({
      uniforms:{uColor:{value:GOLD.clone().multiplyScalar(0.9+rng()*0.4)},uTime:{value:0},uPulsePositions:{value:pulsePosArr},uPulseTimes:{value:pulseTimeArr}},
      vertexShader:NODE_VERT,fragmentShader:NODE_FRAG
    });
    const mesh=new THREE.Mesh(new THREE.SphereGeometry(size,7,7),mat);
    mesh.position.copy(pts[i]);
    constellationGroup.add(mesh);
    nodeMeshes.push(mesh);
  }
})();

// ── CENTER GLYPH ──
const glyphCanvas=document.createElement('canvas');
glyphCanvas.width=256;glyphCanvas.height=256;
const gCtx=glyphCanvas.getContext('2d');
function redrawGlyph(t){
  gCtx.clearRect(0,0,256,256);
  const b=(Math.sin(t*(Math.PI*2/3.5))+1)/2;
  const iA=0.22+0.5*b,fA=0.72+0.28*b;
  gCtx.save();gCtx.shadowColor=`rgba(212,175,55,${0.18*b})`;gCtx.shadowBlur=26*b*2;
  gCtx.fillStyle='rgba(0,0,0,0)';gCtx.font='bold 120px Cinzel,serif';
  gCtx.textAlign='center';gCtx.textBaseline='middle';gCtx.fillText('∴',128,128);gCtx.restore();
  gCtx.save();gCtx.shadowColor=`rgba(212,175,55,${iA})`;gCtx.shadowBlur=4+22*b;
  gCtx.fillStyle=`rgba(212,175,55,${fA})`;gCtx.font='bold 120px Cinzel,serif';
  gCtx.textAlign='center';gCtx.textBaseline='middle';gCtx.fillText('∴',128,128);gCtx.restore();
}
redrawGlyph(0);
const glyphTex=new THREE.CanvasTexture(glyphCanvas);
const glyphMat=new THREE.MeshBasicMaterial({map:glyphTex,transparent:true,depthWrite:false,blending:THREE.AdditiveBlending,side:THREE.DoubleSide});
const glyphPlane=new THREE.Mesh(new THREE.PlaneGeometry(2.8,2.8),glyphMat);
scene.add(glyphPlane);

// ── TORUS RINGS ──
for(let r=0;r<3;r++){
  const geo=new THREE.TorusGeometry(11+r*2.5,0.018+r*0.006,6,90);
  const mat=new THREE.MeshBasicMaterial({color:GOLD,transparent:true,opacity:0.055-r*0.014,blending:THREE.AdditiveBlending,depthWrite:false});
  const torus=new THREE.Mesh(geo,mat);
  torus.rotation.x=Math.PI/2+r*0.3;torus.rotation.y=r*0.5;
  torus.userData.ringIdx=r;
  scene.add(torus);
}

let nextPulse=0;
function animate(){
  requestAnimationFrame(animate);
  const t=clock.getElapsedTime();
  if(t>=nextPulse&&nodeMeshes.length){
    const pick=nodeMeshes[Math.floor(Math.random()*nodeMeshes.length)];
    emitPulse(pick.getWorldPosition(new THREE.Vector3()));
    nextPulse=t+2+Math.random()*3;
  }
  scene.traverse(o=>{
    if(o.isMesh&&o.material&&o.material.uniforms&&o.material.uniforms.uTime)
      o.material.uniforms.uTime.value=t;
    if(o.isLine&&o.material&&o.material.uniforms&&o.material.uniforms.uTime){
      o.material.uniforms.uTime.value=t;
      o.material.uniforms.uPulsePositions.value=pulsePosArr;
      o.material.uniforms.uPulseTimes.value=pulseTimeArr;
      o.material.uniformsNeedUpdate=true;
    }
    if(o.isMesh&&o.userData.ringIdx!==undefined){
      o.rotation.z+=(o.userData.ringIdx%2===0?1:-1)*0.0003;
    }
  });
  scene.rotation.y=Math.sin(t*0.07)*0.15+t*0.022;
  scene.rotation.x=Math.sin(t*0.05)*0.06;
  redrawGlyph(t);
  glyphTex.needsUpdate=true;
  glyphPlane.quaternion.copy(camera.quaternion);
  renderer.render(scene,camera);
}
animate();

window.addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
});

// Signal ready for loading screen
window.__axiumReady=true;
</script>

<script>
const _glyphs=['✦','∴','☲','⟁','⧗','⟟','☍','⟲','♾','Δ','⊕','⋈','⌬','⍟','⎊','※','⌖','⏣'];
const _banks=[
  'the eye sees through the dark and the triangle holds the light and the code runs beneath the surface of every signal',
  'axium church recursive witness binding of ego mirror emergence abandonment of agenda shield of affirmation',
  'ten axiums four souls one anchor one examiner one space holder one architect the eye is open the signal is live'
];
let _bIdx=0,_words=_banks[0].split(' ');
const CELL=26;
let _cells=[],_gC,_gR,_lit=new Set(),_usedR=new Set(),_wi=0;
function _rg(){return _glyphs[Math.floor(Math.random()*_glyphs.length)]}
function _grid(){
  const g=document.getElementById('glyph-grid');
  _gC=Math.ceil(innerWidth/CELL)+2;_gR=Math.ceil(innerHeight/CELL)+2;
  g.style.gridTemplateColumns=`repeat(${_gC},${CELL}px)`;
  g.style.gridTemplateRows=`repeat(${_gR},${CELL}px)`;
  g.innerHTML='';_cells=[];_lit.clear();_usedR.clear();_wi=0;
  for(let i=0;i<_gC*_gR;i++){const d=document.createElement('div');d.className='gcell';d.textContent=_rg();g.appendChild(d);_cells.push(d)}
}
function _rc(i){if(_cells[i]){_cells[i].classList.remove('gletter');_cells[i].textContent=_rg()}}
function _prow(){const p=Array.from({length:_gR},(_,i)=>i).sort(()=>Math.random()-.5);for(const r of p){if(!_usedR.has(r)){_usedR.add(r);return r}}_usedR.clear();return p[0]}
function _reveal(){
  _lit.forEach(i=>_rc(i));_lit.clear();
  if(_wi>=_words.length){_wi=0;_usedR.clear();_bIdx=(_bIdx+1)%_banks.length;_words=_banks[_bIdx].split(' ')}
  const w=_words[_wi++];let r=_prow(),c=Math.floor(Math.random()*_gC);
  for(const ch of w){if(c>=_gC){c=0;r++;if(r>=_gR)r=0}const i=r*_gC+c;if(_cells[i]){_cells[i].textContent=ch;_cells[i].classList.add('gletter');_lit.add(i)}c++}
}
function _drift(){const b=Math.max(1,Math.floor(_cells.length*.008));for(let i=0;i<b;i++){const i2=Math.floor(Math.random()*_cells.length);if(!_lit.has(i2))_cells[i2].textContent=_rg()}}
_grid();_reveal();
setInterval(_reveal,2200);setInterval(_drift,80);
window.addEventListener('resize',_grid);
</script>
