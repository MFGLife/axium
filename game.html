<style>

}
#unlock-flash.show{color:#D4AF37;text-shadow:0 0 22px rgba(212,175,55,.6)}

/* Reference panel (separate from game space) */

// ── Procedural Constellation Generator ───────────────────────────────────────
const ConstellationGenerator = {
  seed: 1,
  rng() {
    this.seed = (this.seed * 1664525 + 1013904223) & 0xffffffff;
    return (this.seed >>> 0) / 0xffffffff;
  },

  setSeed(s) {
    this.seed = s;
  },

  randomPointInCircle(radius, centerX = 0, centerY = 0) {
    const r = radius * Math.sqrt(this.rng());
    const theta = this.rng() * Math.PI * 2;
    return {
      x: centerX + r * Math.cos(theta),
      y: centerY + r * Math.sin(theta)
    };
  },

  poissonDiscPoints(count, radius, centerX = 0, centerY = 0) {
    const points = [];
    const minDist = (radius * 2) / Math.sqrt(count);
    let attempts = 0;
    const maxAttempts = count * 50;

    while (points.length < count && attempts < maxAttempts) {
      const candidate = this.randomPointInCircle(radius * 0.9, centerX, centerY);
      let tooClose = false;

      for (const p of points) {
        const dx = candidate.x - p.x;
        const dy = candidate.y - p.y;
        if (Math.sqrt(dx * dx + dy * dy) < minDist) {
          tooClose = true;
          break;
        }
      }

      if (!tooClose) {
        points.push(candidate);
      }
      attempts++;
    }

    while (points.length < count) {
      points.push(this.randomPointInCircle(radius * 0.9, centerX, centerY));
    }

    return points;
  },

  generateName(pointCount, edgeCount, symmetry, spread) {
    const prefixes = ['Crown', 'Crest', 'Veil', 'Crown', 'Arc', 'Web', 'Net', 'Drift', 'Spire', 'Ring', 'Path', 'Gate'];
    const middles = ['of', 'the', 'in', 'above', 'beneath', 'within'];
    const suffixes = ['Stars', 'Light', 'Void', 'Dust', 'Flame', 'Shade', 'Echo', 'Tide', 'Sorrow', 'Hope', 'Dream', 'Shadow'];

    const complexity = edgeCount / pointCount;
    let name = '';

    if (complexity > 1.5) {
      name = 'Web';
    } else if (complexity < 1.0) {
      name = 'Scatter';
    } else if (symmetry > 0.8) {
      name = 'Crown';
    } else if (spread > 0.7) {
      name = 'Drift';
    } else {
      name = prefixes[Math.floor(this.rng() * prefixes.length)];
    }

    if (this.rng() > 0.5) {
      name += ' ' + middles[Math.floor(this.rng() * middles.length)] + ' ' + suffixes[Math.floor(this.rng() * suffixes.length)];
    } else {
      name += ' ' + suffixes[Math.floor(this.rng() * suffixes.length)];
    }

    return name;
  },

  calculateSymmetry(points) {
    if (points.length < 3) return 0;
    let symmetryScore = 0;
    const checks = 10;
    for (let i = 0; i < checks; i++) {
      const angle = (i / checks) * Math.PI;
      let matches = 0;
      for (const p1 of points) {
        const reflectedX = p1.x * Math.cos(2 * angle) + p1.y * Math.sin(2 * angle);
        const reflectedY = p1.x * Math.sin(2 * angle) - p1.y * Math.cos(2 * angle);
        for (const p2 of points) {
          const dist = Math.sqrt((reflectedX - p2.x) ** 2 + (reflectedY - p2.y) ** 2);
          if (dist < 0.1) matches++;
        }
      }
      symmetryScore = Math.max(symmetryScore, matches / points.length);
    }
    return symmetryScore;
  },

  generateEdges(points, strategy) {
    const edges = [];
    const n = points.length;

    switch(strategy) {
      case 'mst':
        const connected = new Set([0]);
        while (connected.size < n) {
          let bestDist = Infinity;
          let bestEdge = null;
          for (const i of connected) {
            for (let j = 0; j < n; j++) {
              if (connected.has(j)) continue;
              const dx = points[i].x - points[j].x;
              const dy = points[i].y - points[j].y;
              const dist = Math.sqrt(dx * dx + dy * dy);
              if (dist < bestDist) {
                bestDist = dist;
                bestEdge = [i, j];
              }
            }
          }
          if (bestEdge) {
            edges.push(bestEdge);
            connected.add(bestEdge[1]);
          }
        }
        break;

      case 'nearest':
        for (let i = 0; i < n; i++) {
          const distances = points.map((p, j) => {
            if (i === j) return { j, dist: Infinity };
            const dx = points[i].x - p.x;
            const dy = points[i].y - p.y;
            return { j, dist: Math.sqrt(dx * dx + dy * dy) };
          }).sort((a, b) => a.dist - b.dist);

          const connections = 2 + Math.floor(this.rng() * 2);
          for (let k = 0; k < Math.min(connections, n - 1); k++) {
            const edge = [i, distances[k].j].sort((a, b) => a - b);
            if (!edges.some(e => e[0] === edge[0] && e[1] === edge[1])) {
              edges.push(edge);
            }
          }
        }
        break;

      case 'triangulation':
        const sorted = points.map((p, i) => ({ ...p, idx: i })).sort((a, b) => a.x - b.x);
        for (let i = 0; i < sorted.length - 1; i++) {
          edges.push([sorted[i].idx, sorted[i + 1].idx]);
          if (i < sorted.length - 2 && this.rng() > 0.3) {
            edges.push([sorted[i].idx, sorted[i + 2].idx]);
          }
        }
        const byY = points.map((p, i) => ({ ...p, idx: i })).sort((a, b) => a.y - b.y);
        for (let i = 0; i < byY.length - 1; i++) {
          if (this.rng() > 0.6) {
            const edge = [byY[i].idx, byY[i + 1].idx].sort((a, b) => a - b);
            if (!edges.some(e => e[0] === edge[0] && e[1] === edge[1])) {
              edges.push(edge);
            }
          }
        }
        break;

      case 'chain':
        const order = Array.from({ length: n }, (_, i) => i);
        for (let i = n - 1; i > 0; i--) {
          const j = Math.floor(this.rng() * (i + 1));
          [order[i], order[j]] = [order[j], order[i]];
        }
        for (let i = 0; i < n - 1; i++) {
          edges.push([order[i], order[i + 1]]);
        }
        const branches = 1 + Math.floor(this.rng() * 2);
        for (let b = 0; b < branches; b++) {
          const i = Math.floor(this.rng() * (n - 2)) + 1;
          const j = Math.floor(this.rng() * n);
          if (Math.abs(i - j) > 1) {
            const edge = [order[i], order[j]].sort((a, b) => a - b);
            if (!edges.some(e => e[0] === edge[0] && e[1] === edge[1])) {
              edges.push(edge);
            }
          }
        }
        break;
    }

    return edges;
  },

  generate(seed = null) {
    if (seed !== null) this.setSeed(seed);
    else this.setSeed(Date.now() % 1000000 + Math.random() * 1000000);

    const minPoints = 3;
    const maxPoints = 8;
    const pointCount = minPoints + Math.floor(this.rng() * (maxPoints - minPoints + 1));

    const rawPoints = this.poissonDiscPoints(pointCount, 0.4);

    let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
    for (const p of rawPoints) {
      minX = Math.min(minX, p.x);
      maxX = Math.max(maxX, p.x);
      minY = Math.min(minY, p.y);
      maxY = Math.max(maxY, p.y);
    }

    const rangeX = maxX - minX;
    const rangeY = maxY - minY;
    const range = Math.max(rangeX, rangeY);

    const normalizedPoints = rawPoints.map(p => ({
      x: (p.x - minX) / range * 0.7 + 0.15,
      y: (p.y - minY) / range * 0.7 + 0.15
    }));

    const symmetry = this.calculateSymmetry(normalizedPoints);
    const spread = Math.max(rangeX, rangeY) / Math.min(rangeX, rangeY);

    const strategies = ['mst', 'nearest', 'triangulation', 'chain'];
    const strategy = strategies[Math.floor(this.rng() * strategies.length)];

    const edges = this.generateEdges(normalizedPoints, strategy);

    const connected = new Set();
    const adj = Array.from({ length: pointCount }, () => []);
    for (const [a, b] of edges) {
      adj[a].push(b);
      adj[b].push(a);
    }

    const queue = [0];
    connected.add(0);
    while (queue.length > 0) {
      const curr = queue.shift();
      for (const neighbor of adj[curr]) {
        if (!connected.has(neighbor)) {
          connected.add(neighbor);
          queue.push(neighbor);
        }
      }
    }

    if (connected.size < pointCount) {
      const mstEdges = this.generateEdges(normalizedPoints, 'mst');
      for (const edge of mstEdges) {
        const exists = edges.some(e => e[0] === edge[0] && e[1] === edge[1]);
        if (!exists) edges.push(edge);
      }
    }

    const name = this.generateName(pointCount, edges.length, symmetry, spread);

    return {
      n: pointCount,
      pts: normalizedPoints.map(p => [p.x, p.y]),
      edges: edges,
      name: name,
      seed: this.seed
    };
  }
};

const CLASSIC_SHAPES=[

// ── Persistence ───────────────────────────────────────────────────────────────
function loadU(){const s=localStorage.getItem('axium_unlocked');return s?JSON.parse(s):{micheal:[],gabriel:[],ariel:[],seraphina:[]};}
function saveU(u){localStorage.setItem('axium_unlocked',JSON.stringify(u));}
function loadN(){return parseInt(localStorage.getItem('axium_constellation_count')||'0');}
function saveN(n){localStorage.setItem('axium_constellation_count',String(n));}
let unlocked=loadU(), foundCount=loadN();

function pickWord(pk){
  const m=WM[pk],have=unlocked[pk]||[];
  for(const w of[...m.tier2,...m.tier3,...m.tier4,...m.rare]){
    if(!have.includes(w)&&!m.tier1.includes(w))return w;
  }
  return null;
}
function doUnlock(pk,w){
  if(!unlocked[pk])unlocked[pk]=[];
  if(!unlocked[pk].includes(w)){unlocked[pk].push(w);saveU(unlocked);}
}
function showHint(){
  if(!roundActive || roundDone) return;
  if(hintCooldown > 0) return;
  hintTimer = 180;
  hintCooldown = 600;

  // Create opaque hint particles around each target star
  hintParticles = [];
  targetIdxs.forEach(idx => {
    const star = field[idx];
    if (!star.tapped) {
      // Create 3-4 orbiting particles per target
      const particleCount = 3 + Math.floor(Math.random() * 2);
      for (let i = 0; i < particleCount; i++) {
        hintParticles.push({
          starIndex: idx,
          angle: (Math.PI * 2 / particleCount) * i + Math.random() * 0.5,
          radius: 25 + Math.random() * 15,
          speed: 0.02 + Math.random() * 0.02,
          size: 2 + Math.random() * 2,
          alpha: 0.6 + Math.random() * 0.3
        });
      }
    }
  });

  const btn = document.getElementById('help-btn');
  btn.classList.add('cooldown');
}

// ── Star Color Generation ────────────────────────────────────────────────────
function generateStarColor(baseRgb, variation = 0.15) {
  // Create slight temperature variations
  const tempShift = (Math.random() - 0.5) * variation;
  const r = Math.min(255, Math.max(0, baseRgb[0] + baseRgb[0] * tempShift));
  const g = Math.min(255, Math.max(0, baseRgb[1] + baseRgb[1] * tempShift * 0.8));
  const b = Math.min(255, Math.max(0, baseRgb[2] + baseRgb[2] * tempShift * 1.2));
  return [Math.floor(r), Math.floor(g), Math.floor(b)];
}

function generateBackgroundStarColor() {
  // Slight blue-white to yellow-white variations
  const temp = Math.random();
  if (temp < 0.3) {
    // Cool blue-white
    return [200 + Math.random() * 55, 210 + Math.random() * 45, 255];
  } else if (temp < 0.7) {
    // Neutral white
    return [240 + Math.random() * 15, 240 + Math.random() * 15, 255];
  } else {
    // Warm yellow-white
    return [255, 240 + Math.random() * 15, 200 + Math.random() * 55];
  }
}

// ── RNG ───────────────────────────────────────────────────────────────────────
function lcg(s){let v=s;return()=>{v=(v*1664525+1013904223)&0xffffffff;return(v>>>0)/0xffffffff;};}

// ── Milky Way Background ──────────────────────────────────────────────────────
function initMilkyWay() {
  milkyWayParticles = [];
  const count = 400;
  const centerX = W * 0.5;
  const centerY = H * 0.6;

  for (let i = 0; i < count; i++) {
    const angle = Math.random() * Math.PI * 2;
    // Elliptical distribution
    const r = Math.random() * Math.max(W, H) * 0.8;
    const x = centerX + Math.cos(angle) * r * 1.5;
    const y = centerY + Math.sin(angle) * r * 0.4;

    milkyWayParticles.push({
      x: x,
      y: y,
      baseX: x,
      baseY: y,
      angle: angle,
      radius: r,
      size: 0.5 + Math.random() * 1.5,
      alpha: 0.1 + Math.random() * 0.3,
      twinkleSpeed: 0.3 + Math.random() * 0.7,
      twinklePhase: Math.random() * Math.PI * 2,
      color: generateBackgroundStarColor()
    });
  }
}

function drawMilkyWay() {
  const centerX = W * 0.5;
  const centerY = H * 0.6;
  const rotationSpeed = 0.0002;

  milkyWayParticles.forEach(p => {
    // Rotate around galactic center
    p.angle += rotationSpeed;
    p.x = centerX + Math.cos(p.angle) * p.radius * 1.5;
    p.y = centerY + Math.sin(p.angle) * p.radius * 0.4;

    // Twinkle effect
    const twinkle = 0.5 + 0.5 * Math.sin(T * p.twinkleSpeed + p.twinklePhase);
    const alpha = p.alpha * twinkle;

    // Draw with glow
    const g = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.size * 3);
    g.addColorStop(0, `rgba(${p.color[0]},${p.color[1]},${p.color[2]},${alpha})`);
    g.addColorStop(0.5, `rgba(${p.color[0]},${p.color[1]},${p.color[2]},${alpha * 0.5})`);
    g.addColorStop(1, `rgba(${p.color[0]},${p.color[1]},${p.color[2]},0)`);

    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.size * 3, 0, Math.PI * 2);
    ctx.fill();

    // Core
    ctx.fillStyle = `rgba(${p.color[0]},${p.color[1]},${p.color[2]},${alpha * 1.5})`;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
    ctx.fill();
  });
}

// ── Background stars ───────────────────────────────────────────────────────────
function makeBg(){
  const r=lcg(42);
  return Array.from({length:300},()=>{
    const color = generateBackgroundStarColor();
    return{
      x:r()*W, y:r()*H,
      rad:0.4+r()*1.5,
      mag:r(),
      ph:r()*Math.PI*2,
      spd:0.2+r()*0.45,
      color: color,
      twinkleSpeed: 0.5 + r() * 1.0
    };
  });
}

function drawBg(){
  bgStars.forEach(s=>{
    // Twinkle calculation
    const twinkle = 0.3 + 0.7 * Math.abs(Math.sin(s.ph + T * s.twinkleSpeed));
    const b=s.rad, gR=b*(2.6+twinkle*1.8);

    // Outer halo
    const h1=ctx.createRadialGradient(s.x,s.y,0,s.x,s.y,gR*2.2);
    h1.addColorStop(0,`rgba(${s.color[0]},${s.color[1]},${s.color[2]},${(0.08*twinkle).toFixed(3)})`);
    h1.addColorStop(1,'rgba(200,215,255,0)');
    ctx.fillStyle=h1;ctx.beginPath();ctx.arc(s.x,s.y,gR*2.2,0,Math.PI*2);ctx.fill();

    // Inner glow
    const h2=ctx.createRadialGradient(s.x,s.y,0,s.x,s.y,gR);
    h2.addColorStop(0,`rgba(${s.color[0]},${s.color[1]},${s.color[2]},${(0.92*twinkle).toFixed(2)})`);
    h2.addColorStop(0.22,`rgba(${s.color[0]},${s.color[1]},${s.color[2]},${(0.55*twinkle).toFixed(2)})`);
    h2.addColorStop(1,'rgba(200,215,255,0)');
    ctx.fillStyle=h2;ctx.beginPath();ctx.arc(s.x,s.y,gR,0,Math.PI*2);ctx.fill();

    // Core
    ctx.beginPath();ctx.arc(s.x,s.y,b,0,Math.PI*2);
    ctx.fillStyle=`rgba(255,255,255,${(0.96*twinkle).toFixed(2)})`;ctx.fill();

    // Spike rays on mag>0.5 stars
    if(s.mag>0.5){
      [[1,0],[0,1],[-1,0],[0,-1]].forEach(([dx,dy])=>{
        const sl=gR*1.7;
        const sg=ctx.createLinearGradient(s.x,s.y,s.x+dx*sl,s.y+dy*sl);
        sg.addColorStop(0,`rgba(${s.color[0]},${s.color[1]},${s.color[2]},${(0.18*twinkle).toFixed(2)})`);
        sg.addColorStop(1,'rgba(255,255,255,0)');
        ctx.beginPath();ctx.strokeStyle=sg;ctx.lineWidth=0.7;
        ctx.moveTo(s.x,s.y);ctx.lineTo(s.x+dx*sl,s.y+dy*sl);ctx.stroke();
      });
    }
  });
}

// ── Shooting stars ───────────────────────────────────────────────────────────
function spawnShoot(){
  const rgb=curSoul?curSoul.rgb:[212,175,55];
  // Random direction anywhere on circle
  const ang = Math.random() * Math.PI * 2;
  const spd = 4 + Math.random() * 6;
  // Spawn from edges based on direction
  let x, y;
  if (Math.random() > 0.5) {
    x = Math.random() < 0.5 ? -50 : W + 50;
    y = Math.random() * H;
  } else {
    x = Math.random() * W;
    y = Math.random() < 0.5 ? -50 : H + 50;
  }

  shoots.push({
    x: x, y: y,
    vx: Math.cos(ang) * spd,
    vy: Math.sin(ang) * spd,
    len: 60 + Math.random() * 100,
    a: 0.8 + Math.random() * 0.2,
    rgb: rgb,
    width: 1 + Math.random() * 1.5
  });
}

// Initial shooting star
spawnShoot();
setInterval(()=>{if(Math.random()<0.4)spawnShoot();},4000);

function drawShoots(){
  const keep=[];
  shoots.forEach(ss=>{
    if(ss.a<=0.02)return;
    const tailX = ss.x - ss.vx * (ss.len / 10);
    const tailY = ss.y - ss.vy * (ss.len / 10);

    const gd=ctx.createLinearGradient(ss.x, ss.y, tailX, tailY);
    gd.addColorStop(0,`rgba(${ss.rgb.join(',')},${ss.a.toFixed(2)})`);
    gd.addColorStop(0.3,`rgba(${ss.rgb.join(',')},${(ss.a * 0.5).toFixed(2)})`);
    gd.addColorStop(1,`rgba(${ss.rgb.join(',')},0)`);

    ctx.beginPath();
    ctx.strokeStyle=gd;
    ctx.lineWidth=ss.width;
    ctx.moveTo(ss.x, ss.y);
    ctx.lineTo(tailX, tailY);
    ctx.stroke();

    // Head glow
    const headGlow = ctx.createRadialGradient(ss.x, ss.y, 0, ss.x, ss.y, 6);
    headGlow.addColorStop(0, `rgba(255,255,255,${ss.a})`);
    headGlow.addColorStop(0.5, `rgba(${ss.rgb.join(',')},${ss.a * 0.8})`);
    headGlow.addColorStop(1, `rgba(${ss.rgb.join(',')},0)`);
    ctx.fillStyle = headGlow;
    ctx.beginPath();
    ctx.arc(ss.x, ss.y, 6, 0, Math.PI * 2);
    ctx.fill();

    ss.x += ss.vx;
    ss.y += ss.vy;
    ss.a -= 0.008;
    keep.push(ss);
  });
  shoots.splice(0, shoots.length, ...keep);
}

// ── Round ─────────────────────────────────────────────────────────────────────
function generateRound(){
  tapped=[];roundDone=false;roundActive=false;
  hintParticles = [];
  document.getElementById('next-btn').style.display='none';
  curPKey=PKEYS[Math.floor(Math.random()*4)];
  curSoul=PS[curPKey];

  const useProcedural = Math.random() > 0.3;
  if (useProcedural) {
    const seed = Date.now() + Math.floor(Math.random() * 1000000);
    curShape = ConstellationGenerator.generate(seed);
  } else {
    const maxI=Math.min(CLASSIC_SHAPES.length-1,2+Math.floor(foundCount/4));
    curShape=CLASSIC_SHAPES[Math.floor(Math.random()*(maxI+1))];
  }

  curAngle=Math.random()*Math.PI*2;
  curMirror=Math.random()>0.5;
  buildField();drawRef();buildDots();updateHUD();
  roundActive=true;
}

function buildField(){
  const mg=70,topY=60,botY=H-155;
  const pW=W-mg*2,pH=botY-topY;
  const sp=Math.min(pW,pH)*(0.26+Math.random()*0.18);
  const cx=mg+sp*0.5+Math.random()*Math.max(0,pW-sp);
  const cy=topY+sp*0.5+Math.random()*Math.max(0,pH-sp);
  const cos=Math.cos(curAngle),sin=Math.sin(curAngle);

  const tgts=curShape.pts.map(([px,py],i)=>{
    let nx=px-0.5,ny=py-0.5;if(curMirror)nx=-nx;
    const color = generateStarColor(curSoul.rgb, 0.2);
    return{
      x:cx+(nx*cos-ny*sin)*sp,
      y:cy+(nx*sin+ny*cos)*sp,
      isT:true,
      seq:i,
      mag:0.5+Math.random()*0.5,
      ph:Math.random()*Math.PI*2,
      spd:0.5+Math.random()*0.8,
      tapped:false,
      wp:0,
      cp:0,
      color: color,
      orbitParticles: [],
      hasOrbit: i === 0 // First star starts with orbit
    };
  });

  const nd=22+Math.floor(foundCount*1.8), md=Math.min(pW,pH)*0.05;
  const dec=[];let att=0;
  while(dec.length<nd&&att<5000){
    att++;
    const dx=mg+Math.random()*pW, dy=topY+Math.random()*pH;
    if(tgts.every(t=>Math.hypot(t.x-dx,t.y-dy)>md)&&dec.every(d=>Math.hypot(d.x-dx,d.y-dy)>md*0.6)) {
      const color = generateBackgroundStarColor();
      dec.push({
        x:dx,
        y:dy,
        isT:false,
        seq:-1,
        mag:0.1+Math.random()*0.4,
        ph:Math.random()*Math.PI*2,
        spd:0.3+Math.random()*0.7,
        tapped:false,
        wp:0,
        cp:0,
        color: color
      });
    }
  }

  field=[...tgts,...dec].sort(()=>Math.random()-0.5);
  targetIdxs=field.reduce((a,s,i)=>{if(s.isT)a.push(i);return a;},[]);
  targetIdxs.sort((a,b)=>field[a].seq-field[b].seq);

  // Initialize orbit particles for the first star
  const firstStar = field[targetIdxs[0]];
  if (firstStar) {
    initOrbitParticles(firstStar);
  }
}

function initOrbitParticles(star) {
  star.orbitParticles = [];
  const count = 3;
  for (let i = 0; i < count; i++) {
    star.orbitParticles.push({
      angle: (Math.PI * 2 / count) * i,
      radius: 18 + Math.random() * 8,
      speed: 0.03 + Math.random() * 0.02,
      size: 1.5 + Math.random() * 1.5,
      color: star.color
    });
  }
  star.hasOrbit = true;
}

// ── Reference canvas ──────────────────────────────────────────────────────────
function drawRef(){
  const tw=rcv.width,th=rcv.height;
  rctx.clearRect(0,0,tw,th);
  const cx=tw/2,cy=th/2,sc=Math.min(tw,th)*0.36;
  const cos=Math.cos(curAngle),sin=Math.sin(curAngle);
  const[R,G,B]=curSoul.rgb;
  const pts=curShape.pts.map(([px,py])=>{
    let nx=px-0.5,ny=py-0.5;if(curMirror)nx=-nx;
    return{x:cx+(nx*cos-ny*sin)*sc,y:cy+(nx*sin+ny*cos)*sc};
  });
  rctx.strokeStyle=`rgba(${R},${G},${B},.5)`;rctx.lineWidth=1.2;
  curShape.edges.forEach(([a,b])=>{rctx.beginPath();rctx.moveTo(pts[a].x,pts[a].y);rctx.lineTo(pts[b].x,pts[b].y);rctx.stroke();});
  pts.forEach((p,i)=>{
    const g=rctx.createRadialGradient(p.x,p.y,0,p.x,p.y,8);
    g.addColorStop(0,`rgba(${R},${G},${B},.6)`);g.addColorStop(1,`rgba(${R},${G},${B},0)`);
    rctx.fillStyle=g;rctx.beginPath();rctx.arc(p.x,p.y,8,0,Math.PI*2);rctx.fill();
    rctx.beginPath();rctx.arc(p.x,p.y,2.6,0,Math.PI*2);rctx.fillStyle=`rgba(${R},${G},${B},1)`;rctx.fill();
    rctx.font='bold 7px Space Mono';rctx.textAlign='center';
    rctx.fillStyle='rgba(255,255,255,.65)';rctx.fillText(i+1,p.x,p.y-5.5);
  });
}

function buildDots(){
  const row=document.getElementById('progress-dots');row.innerHTML='';
  for(let i=0;i<curShape.n;i++){
    const d=document.createElement('div');d.className='pdot';d.id='pd'+i;
    d.style.setProperty('--c',curSoul.hex);row.appendChild(d);
  }
}
function updateHUD(){
  const pl=document.getElementById('persona-lbl');
  pl.textContent=curSoul.name+' · '+curSoul.role;pl.style.color=curSoul.hex+'99';
  document.getElementById('shape-lbl').textContent=curShape.name;
  document.getElementById('found-count').textContent=foundCount>0?foundCount+' found':'';
}

// ── Tap ───────────────────────────────────────────────────────────────────────
function handleTap(e){
  if(!gameStarted||!roundActive||roundDone)return;
  const rect=cv.getBoundingClientRect();
  const tx=(e.touches?e.touches[0].clientX:e.clientX)-rect.left;
  const ty=(e.touches?e.touches[0].clientY:e.clientY)-rect.top;
  const tapR=Math.max(44,Math.min(W,H)*0.06);
  let best=-1,bestD=Infinity;
  field.forEach((s,i)=>{
    if(s.tapped)return;
    const d=Math.hypot(s.x-tx,s.y-ty);
    if(d<tapR&&d<bestD){best=i;bestD=d;}
  });
  if(best===-1)return;
  const exp=targetIdxs[tapped.length];
  if(best===exp){
    const s=field[best];s.tapped=true;s.cp=1;tapped.push(best);

    // Add orbit particles to this star
    initOrbitParticles(s);

    burstAt(s.x,s.y,s.color,24);
    const pd=document.getElementById('pd'+(tapped.length-1));if(pd)pd.classList.add('hit');
    if(tapped.length===curShape.n)onComplete();
  }else{
    field[best].wp=14;
    const wf=document.getElementById('wrong-flash');wf.style.opacity='1';setTimeout(()=>wf.style.opacity='0',230);
  }
}

// ── Complete ──────────────────────────────────────────────────────────────────
function onComplete(){
  roundDone=true;roundActive=false;
  foundCount++;saveN(foundCount);
  targetIdxs.forEach(i=>burstAt(field[i].x,field[i].y,curSoul.rgb,32));
  const[R,G,B]=curSoul.rgb;
  const cf=document.getElementById('complete-flash');
  cf.style.background=`radial-gradient(ellipse at center,rgba(${R},${G},${B},.22) 0%,transparent 65%)`;
  cf.style.opacity='1';setTimeout(()=>cf.style.opacity='0',1400);

  const iv=Math.max(1,Math.floor(foundCount/6));
  let pw=null;
  if(foundCount%iv===0){
    pw=pickWord(curPKey);
    if(pw){
      doUnlock(curPKey,pw);
      const uf=document.getElementById('unlock-flash');uf.textContent=pw;uf.classList.add('show');
      setTimeout(()=>uf.classList.remove('show'),4200);
    }
  }

  document.getElementById('found-count').textContent=foundCount+' found';
  setTimeout(()=>{
    const nb=document.getElementById('next-btn');nb.style.display='flex';
    const nw=document.getElementById('next-unlock-word');
    nw.textContent=pw?'"'+pw+'" unlocked in '+curSoul.name:'';
    nw.style.color=curSoul.hex+'cc';
  },900);
}
function nextRound(){generateRound();}

// ── Particles ─────────────────────────────────────────────────────────────────
function burstAt(x,y,rgb,n){
  for(let i=0;i<n;i++){
    const a=Math.random()*Math.PI*2,sp=0.8+Math.random()*4;
    particles.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,life:1,dec:0.018+Math.random()*0.025,r:0.5+Math.random()*2,rgb});
  }
}
function tickP(){
  particles=particles.filter(p=>p.life>0.02);
  particles.forEach(p=>{
    p.x+=p.vx;p.y+=p.vy;p.vx*=0.92;p.vy*=0.92;p.life-=p.dec;
    const[R,G,B]=p.rgb;ctx.beginPath();ctx.arc(p.x,p.y,p.r*p.life,0,Math.PI*2);
    ctx.fillStyle=`rgba(${R},${G},${B},${p.life.toFixed(2)})`;ctx.fill();
  });
}

// ── Draw Orbit Particles ────────────────────────────────────────────────────
function drawOrbitParticles(star) {
  if (!star.hasOrbit || !star.orbitParticles) return;

  star.orbitParticles.forEach(p => {
    p.angle += p.speed;
    const px = star.x + Math.cos(p.angle) * p.radius;
    const py = star.y + Math.sin(p.angle) * p.radius;

    // Glow
    const g = ctx.createRadialGradient(px, py, 0, px, py, p.size * 3);
    g.addColorStop(0, `rgba(${p.color[0]},${p.color[1]},${p.color[2]},0.8)`);
    g.addColorStop(0.5, `rgba(${p.color[0]},${p.color[1]},${p.color[2]},0.4)`);
    g.addColorStop(1, `rgba(${p.color[0]},${p.color[1]},${p.color[2]},0)`);

    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.arc(px, py, p.size * 3, 0, Math.PI * 2);
    ctx.fill();

    // Core
    ctx.fillStyle = `rgba(255,255,255,0.9)`;
    ctx.beginPath();
    ctx.arc(px, py, p.size * 0.6, 0, Math.PI * 2);
    ctx.fill();
  });
}

// ── Draw Hint Particles ──────────────────────────────────────────────────────
function drawHintParticles() {
  if (hintParticles.length === 0) return;

  hintParticles.forEach(p => {
    const star = field[p.starIndex];
    if (!star || star.tapped) return;

    p.angle += p.speed;
    const px = star.x + Math.cos(p.angle) * p.radius;
    const py = star.y + Math.sin(p.angle) * p.radius;

    // Opaque, visible particles
    const g = ctx.createRadialGradient(px, py, 0, px, py, p.size * 4);
    g.addColorStop(0, `rgba(${curSoul.rgb[0]},${curSoul.rgb[1]},${curSoul.rgb[2]},${p.alpha})`);
    g.addColorStop(0.4, `rgba(${curSoul.rgb[0]},${curSoul.rgb[1]},${curSoul.rgb[2]},${p.alpha * 0.6})`);
    g.addColorStop(1, `rgba(${curSoul.rgb[0]},${curSoul.rgb[1]},${curSoul.rgb[2]},0)`);

    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.arc(px, py, p.size * 4, 0, Math.PI * 2);
    ctx.fill();

    // Solid core
    ctx.fillStyle = `rgba(255,255,255,${p.alpha})`;
    ctx.beginPath();
    ctx.arc(px, py, p.size, 0, Math.PI * 2);
    ctx.fill();
  });
}

// ── Draw Connection Lines ────────────────────────────────────────────────────
function drawConnectionLines() {
  if (tapped.length < 2) return;

  const[R,G,B]=curSoul.rgb;

  for (let i = 0; i < tapped.length - 1; i++) {
    const s1 = field[tapped[i]];
    const s2 = field[tapped[i + 1]];

    // Animated traveling light effect
    const progress = (T * 2) % 1;

    // Base line
    const eg=ctx.createLinearGradient(s1.x, s1.y, s2.x, s2.y);
    eg.addColorStop(0,`rgba(${R},${G},${B},0.3)`);
    eg.addColorStop(0.5,`rgba(${R},${G},${B},0.6)`);
    eg.addColorStop(1,`rgba(${R},${G},${B},0.3)`);

    ctx.beginPath();
    ctx.strokeStyle=eg;
    ctx.lineWidth=2;
    ctx.moveTo(s1.x, s1.y);
    ctx.lineTo(s2.x, s2.y);
    ctx.stroke();

    // Traveling light dot
    const lx = s1.x + (s2.x - s1.x) * progress;
    const ly = s1.y + (s2.y - s1.y) * progress;

    const lg = ctx.createRadialGradient(lx, ly, 0, lx, ly, 8);
    lg.addColorStop(0, `rgba(255,255,255,0.9)`);
    lg.addColorStop(0.5, `rgba(${R},${G},${B},0.6)`);
    lg.addColorStop(1, `rgba(${R},${G},${B},0)`);

    ctx.fillStyle = lg;
    ctx.beginPath();
    ctx.arc(lx, ly, 8, 0, Math.PI * 2);
    ctx.fill();
  }
}

// ── Field draw ────────────────────────────────────────────────────────────────
function drawField(){
  const[R,G,B]=curSoul.rgb;
  const expI=roundDone?-1:targetIdxs[tapped.length];

  // Faint nebula at constellation center
  if(targetIdxs.length){
    const cx=targetIdxs.reduce((a,i)=>a+field[i].x,0)/targetIdxs.length;
    const cy=targetIdxs.reduce((a,i)=>a+field[i].y,0)/targetIdxs.length;
    const ng=ctx.createRadialGradient(cx,cy,0,cx,cy,Math.min(W,H)*0.22);
    ng.addColorStop(0,`rgba(${R},${G},${B},.06)`);ng.addColorStop(1,`rgba(${R},${G},${B},0)`);
    ctx.fillStyle=ng;ctx.fillRect(0,0,W,H);
  }

  // Draw completed connection lines
  drawConnectionLines();

  // Draw edges between tapped stars
  curShape.edges.forEach(([a,b])=>{
    const ia=targetIdxs[a],ib=targetIdxs[b];
    if(ia===undefined||ib===undefined)return;
    const sa=field[ia],sb=field[ib];if(!sa||!sb)return;
    const both=sa.tapped&&sb.tapped,either=sa.tapped||sb.tapped;if(!either)return;
    const al=both?0.6:0.2,lw=both?1.6:0.8;
    const eg=ctx.createLinearGradient(sa.x,sa.y,sb.x,sb.y);
    eg.addColorStop(0,`rgba(${R},${G},${B},${al})`);
    eg.addColorStop(0.5,`rgba(255,255,255,${al*0.4})`);
    eg.addColorStop(1,`rgba(${R},${G},${B},${al})`);
    ctx.beginPath();ctx.strokeStyle=eg;ctx.lineWidth=lw;ctx.moveTo(sa.x,sa.y);ctx.lineTo(sb.x,sb.y);ctx.stroke();
  });

  // Draw hint particles (behind stars)
  drawHintParticles();

  // Draw stars
  field.forEach((s,i)=>{
    const isT=s.isT,isN=i===expI&&!s.tapped;
    const hintGlow = hintTimer>0 && isT && !s.tapped;
    const[SR,SG,SB]=isT?s.color:[200,205,220];
    const tw=0.45+0.55*Math.sin(T*1.1*s.spd+s.ph);
    const bR=s.tapped?2.8+s.mag*3.2:
         hintGlow?3.6+s.mag*3.4:
         isT?1.6+s.mag*2.4:
         0.7+s.mag*1.4;
    const gR=bR*(s.tapped?4.5:isN?4:isT?2.8:2.2);

    if(s.wp>0){s.wp--;ctx.beginPath();ctx.arc(s.x,s.y,gR*2.5,0,Math.PI*2);ctx.fillStyle=`rgba(200,55,55,${(0.3*s.wp/14).toFixed(2)})`;ctx.fill();}
    if(s.cp>0){s.cp=Math.max(0,s.cp-0.022);ctx.beginPath();ctx.arc(s.x,s.y,gR*(1.5+s.cp*4.5),0,Math.PI*2);ctx.fillStyle=`rgba(${SR},${SG},${SB},${(0.2*s.cp).toFixed(2)})`;ctx.fill();}
    if(isN){const p=0.2+0.18*Math.sin(T*3.2);ctx.beginPath();ctx.arc(s.x,s.y,gR*2,0,Math.PI*2);ctx.strokeStyle=`rgba(${R},${G},${B},${p})`;ctx.lineWidth=1;ctx.stroke();}

    // Outer glow with twinkle
    const oA=s.tapped?0.28:isT?0.07:0.028;
    const g1=ctx.createRadialGradient(s.x,s.y,0,s.x,s.y,gR*2.2);
    g1.addColorStop(0,`rgba(${SR},${SG},${SB},${oA * (0.7 + 0.3 * tw)})`);
    g1.addColorStop(1,`rgba(${SR},${SG},${SB},0)`);
    ctx.fillStyle=g1;ctx.beginPath();ctx.arc(s.x,s.y,gR*2.2,0,Math.PI*2);ctx.fill();

    // Inner glow
    const iA=s.tapped?0.9:isT?tw*0.42:tw*0.22;
    const g2=ctx.createRadialGradient(s.x,s.y,0,s.x,s.y,gR);
    g2.addColorStop(0,`rgba(255,255,255,${iA.toFixed(2)})`);
    g2.addColorStop(0.25,`rgba(${SR},${SG},${SB},${(iA*0.75).toFixed(2)})`);
    g2.addColorStop(1,`rgba(${SR},${SG},${SB},0)`);
    ctx.fillStyle=g2;ctx.beginPath();ctx.arc(s.x,s.y,gR,0,Math.PI*2);ctx.fill();

    // Core
    const cA=s.tapped?1:isT?0.72+0.28*tw:0.22+0.16*tw;
    ctx.beginPath();ctx.arc(s.x,s.y,bR,0,Math.PI*2);ctx.fillStyle=`rgba(255,255,255,${cA.toFixed(2)})`;ctx.fill();

    // Spike rays
    if(s.tapped||(isT&&s.mag>0.5)){
      [[1,0],[0,1],[-1,0],[0,-1]].forEach(([dx,dy])=>{
        const sl=gR*(s.tapped?2.2:1.4);
        const sg=ctx.createLinearGradient(s.x,s.y,s.x+dx*sl,s.y+dy*sl);
        sg.addColorStop(0,`rgba(${SR},${SG},${SB},${(0.15*tw).toFixed(2)})`);
        sg.addColorStop(1,`rgba(${SR},${SG},${SB},0)`);
        ctx.beginPath();ctx.strokeStyle=sg;ctx.lineWidth=0.7;ctx.moveTo(s.x,s.y);ctx.lineTo(s.x+dx*sl,s.y+dy*sl);ctx.stroke();
      });
    }

    // Draw orbit particles for tapped stars or first star
    if (s.hasOrbit) {
      drawOrbitParticles(s);
    }

    // Number label
    if(isT&&!s.tapped&&!roundDone){
      const fs=Math.max(9,Math.min(12,W*0.015));
      ctx.font=`${isN?'700':'400'} ${fs}px Space Mono`;ctx.textAlign='center';
      const na=isN?0.6+0.25*Math.sin(T*3):0.22;
      ctx.fillStyle=`rgba(${R},${G},${B},${na})`;
      ctx.fillText(s.seq+1,s.x,s.y-bR-8);
    }
  });
}

// ── Main loop ─────────────────────────────────────────────────────────────────
function draw(){
  requestAnimationFrame(draw);T+=0.016;
  if(hintTimer>0) hintTimer--;
  if(hintCooldown>0) {
    hintCooldown--;
    if(hintCooldown===0) {
      document.getElementById('help-btn').classList.remove('cooldown');
      hintParticles = [];
    }
  }

  ctx.fillStyle='#04040a';ctx.fillRect(0,0,W,H);

  // Draw Milky Way first (background)
  drawMilkyWay();

  // Then regular background stars
  drawBg();

  // Shooting stars
  drawShoots();

  // Game field
  if(gameStarted&&field.length)drawField();

  // Burst particles
  tickP();
}

function resize(){
  W=cv.width=window.innerWidth;H=cv.height=window.innerHeight;
  bgStars=makeBg();
  initMilkyWay();
  if(gameStarted&&roundActive)buildField();
}

function beginGame(){
  document.getElementById('start').style.display='none';
  gameStarted=true;generateRound();
}

cv.addEventListener('mousedown',handleTap);
cv.addEventListener('touchstart',e=>{e.preventDefault();handleTap(e);},{passive:false});
window.addEventListener('resize',resize);
resize();draw();
</script>
