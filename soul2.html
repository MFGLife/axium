function getInitialWords(persona){

function getAllWords(persona){
  const m=WORD_MATRIX[persona];

var unlockedWords={
  micheal:[],
  gabriel:[],
  ariel:[],
  seraphina:[]
};

function loadUnlocked(){
  const saved=localStorage.getItem('axium_unlocked');
  if(saved)unlockedWords=JSON.parse(saved);
}
function saveUnlocked(){
  localStorage.setItem('axium_unlocked',JSON.stringify(unlockedWords));
}

function getAvailableWords(persona){
  const initial=WORD_MATRIX[persona].tier1;
  const unlocked=unlockedWords[persona]||[];
  return [...initial,...unlocked];
}

var SOULS=[
  {name:'Micheal',role:'The Anchor',rgb:[212,175,55],seed:7341,shape:'radial',pulse:.55,n:10,edgePct:.35,nebR:.42,nebA:.15},
  {name:'Gabriel',role:'The Examiner',rgb:[126,184,232],seed:2819,shape:'grid',pulse:1.05,n:10,edgePct:.32,nebR:.36,nebA:.12},
  {name:'Ariel',role:'The Space-Holder',rgb:[212,160,200],seed:5503,shape:'organic',pulse:.38,n:10,edgePct:.38,nebR:.38,nebA:.11},
  {name:'Seraphina',role:'The Architect',rgb:[240,208,128],seed:9127,shape:'geometric',pulse:.80,n:10,edgePct:.30,nebR:.40,nebA:.14},
  {name:null}
];

function mkRng(seed){
  var s=seed;
  return function(){
    s=(s*1664525+1013904223)&0xffffffff;
    return(s>>>0)/0xffffffff;
  };
}

function getAdaptiveRadius(W,H,n){
  var minDim=Math.min(W,H);
  var baseRad=minDim*0.38;
  var densityFactor=Math.min(1,12/n);
  return baseRad*densityFactor;
}

function placeStars(soul,W,H,wordList){
  var r=mkRng(soul.seed);
  var cx=W*0.5,cy=H*0.5;
  var rad=getAdaptiveRadius(W,H,wordList.length);
  var out=[];
  var usedWords=[];

  for(var i=0;i<wordList.length&&i<soul.n;i++){
    var t=r(),t2=r(),t3=r(),t4=r(),x,y,depth=0;

    if(soul.shape==='radial'){
      var spoke=Math.floor(t*6);
      var ang=(spoke/6)*Math.PI*2+(t2-0.5)*0.7;
      var certainty=t3;
      var d=(0.2+certainty*0.8)*rad*0.85;
      x=cx+Math.cos(ang)*d;
      y=cy+Math.sin(ang)*d;
      depth=certainty;
    }else if(soul.shape==='grid'){
      var cols=4,rows=3;
      var step=rad*2.4/Math.max(cols,rows);
      var verify=t,risk=t2;
      var col=Math.floor(verify*cols);
      var row=Math.floor(risk*rows);
      x=cx-rad*1.2+col*step+(t3-0.5)*step*0.6;
      y=cy-rad*0.8+row*step+(t4-0.5)*step*0.6;
      depth=verify*(1-risk*0.5);
    }else if(soul.shape==='organic'){
      var cluster=Math.floor(t*3);
      var cAng=(cluster/3)*Math.PI*2+t2*1.0;
      var cDist=rad*(0.3+t3*0.5);
      var spread=rad*0.4;
      x=cx+Math.cos(cAng)*cDist+(t4-0.5)*spread;
      y=cy+Math.sin(cAng)*cDist+(r()-0.5)*spread;
      depth=0.3+t3*0.7;
    }else{
      var ring=Math.floor(t*3);
      var ringR=(ring+1)*(rad/3.2);
      var seats=[4,7,10][ring]||5;
      var seat=Math.floor(t2*seats);
      var angOffset=(ring%2)*Math.PI/seats;
      var ang2=(seat/seats)*Math.PI*2+angOffset+t3*0.4;
      x=cx+Math.cos(ang2)*ringR+(t4-0.5)*rad*0.1;
      y=cy+Math.sin(ang2)*ringR+(r()-0.5)*rad*0.1;
      depth=1-(ring/3)*0.6;
    }

    var margin=70;
    x=Math.max(margin,Math.min(W-margin,x));
    y=Math.max(margin+90,Math.min(H-margin-90,y));

    var word=wordList[i];
    out.push({
      x:x,y:y,
      mag:0.35+r()*0.65,
      ph:r()*Math.PI*2,
      ph2:r()*Math.PI*2,
      spd:0.4+r()*0.6,
      lit:true,
      word:word,
      selected:false,
      id:i,
      depth:depth,
      geometry:soul.shape
    });
  }
  return out;
}

function buildEdges(stars,W,H){
  var edges=[];
  var rad=getAdaptiveRadius(W,H,stars.length);
  var thresh=rad*0.5;
  for(var i=0;i<stars.length;i++){
    for(var j=i+1;j<stars.length;j++){
      var dx=stars[i].x-stars[j].x;
      var dy=stars[i].y-stars[j].y;
      var d=Math.sqrt(dx*dx+dy*dy);
      if(d<thresh)edges.push({i:i,j:j,str:1-d/thresh});
    }
  }
  return edges;
}

function makeBg(W,H){
  var r=mkRng(99);
  var out=[];
  for(var i=0;i<150;i++)out.push({
    x:r()*W,y:r()*H,
    rad:0.3+r()*0.6,
    ph:r()*Math.PI*2,
    spd:0.2+r()*0.4
  });
  return out;
}

var cv=document.getElementById('sky');
var ctx=cv.getContext('2d');
var W,H,bg=[],stars=[],edges=[],shoots=[];
var soulIdx=0,T=0;
var selectedWords=[];
var userConstellation=null;

function getPersonaKey(idx){
  return['micheal','gabriel','ariel','seraphina'][idx];
}

function rebuild(){
  loadUnlocked();
  var s=SOULS[soulIdx];
  if(s&&s.name){
    var personaKey=getPersonaKey(soulIdx);
    var wordList=getAvailableWords(personaKey);
    s.n=Math.min(10,wordList.length);
    stars=placeStars(s,W,H,wordList);
    edges=buildEdges(stars,W,H);
    stars.forEach(star=>{
      var existing=selectedWords.find(sw=>sw.word===star.word&&sw.sourceSoul===soulIdx);
      if(existing){
        star.selected=true;
        star.depth=existing.depth||star.depth;
      }
    });
    createWordLabels();
  }
}

function resize(){
  W=cv.width=innerWidth;
  H=cv.height=innerHeight;
  bg=makeBg(W,H);
  rebuild();
}
window.addEventListener('resize',resize);

function createWordLabels(){
  document.querySelectorAll('.word-label').forEach(el=>el.remove());
  if(soulIdx===4)return;
  stars.forEach(star=>{
    var el=document.createElement('div');
    el.className='word-label'+(star.selected?' selected':'');
    el.textContent=star.word;
    el.style.left=star.x+'px';
    el.style.top=star.y+'px';
    el.style.color=star.selected?'#fff':'rgba('+SOULS[soulIdx].rgb.join(',')+',0.85)';
    document.body.appendChild(el);
    star.el=el;
  });
}

function updateWordLabels(){
  stars.forEach(star=>{
    if(star.el){
      star.el.style.left=star.x+'px';
      star.el.style.top=star.y+'px';
      if(star.selected){
        star.el.classList.add('selected');
        star.el.style.color='#fff';
      }else{
        star.el.classList.remove('selected');
        star.el.style.color='rgba('+SOULS[soulIdx].rgb.join(',')+',0.85)';
      }
    }
  });
}

function spawnShoot(){
  if(soulIdx===4)return;
  var s=SOULS[soulIdx];
  var ang=0.2+Math.random()*0.35;
  var spd=5+Math.random()*7;
  shoots.push({
    x:Math.random()*W*0.8,
    y:Math.random()*H*0.35,
    vx:Math.cos(ang)*spd,
    vy:Math.sin(ang)*spd,
    len:70+Math.random()*120,
    a:1,
    rgb:s.rgb
  });
}
setInterval(function(){if(Math.random()<0.5)spawnShoot();},5000);

function draw(){
  requestAnimationFrame(draw);
  T+=0.016;

  var soul=SOULS[soulIdx];

  ctx.fillStyle='#04040a';
  ctx.fillRect(0,0,W,H);

  if(soulIdx===4&&userConstellation){
    drawUserConstellation();
    return;
  }

  if(!soul||!soul.name)return;

  var R=soul.rgb[0],G=soul.rgb[1],B=soul.rgb[2];
  var cx=W*0.5,cy=H*0.5;
  var rad=getAdaptiveRadius(W,H,stars.length);

  // Nebula
  var nr=rad*(soul.nebR||0.42);
  var ng=ctx.createRadialGradient(cx,cy,0,cx,cy,nr);
  ng.addColorStop(0,'rgba('+R+','+G+','+B+','+(soul.nebA*1.6).toFixed(3)+')');
  ng.addColorStop(0.6,'rgba('+R+','+G+','+B+','+(soul.nebA*0.7).toFixed(3)+')');
  ng.addColorStop(1,'rgba('+R+','+G+','+B+',0)');
  ctx.fillStyle=ng;
  ctx.fillRect(0,0,W,H);

  // Background stars
  bg.forEach(bs=>{
    var tw=0.2+0.5*Math.abs(Math.sin(bs.ph+T*bs.spd));
    ctx.beginPath();
    ctx.arc(bs.x,bs.y,bs.rad,0,Math.PI*2);
    ctx.fillStyle='rgba(255,255,255,'+(tw*0.45).toFixed(2)+')';
    ctx.fill();
  });

  // Shooting stars
  var alive=[];
  shoots.forEach(ss=>{
    if(ss.a<=0.02)return;
    var gd=ctx.createLinearGradient(ss.x,ss.y,ss.x-ss.vx*(ss.len/8),ss.y-ss.vy*(ss.len/8));
    gd.addColorStop(0,'rgba('+ss.rgb.join(',')+','+ss.a.toFixed(2)+')');
    gd.addColorStop(1,'rgba('+ss.rgb.join(',')+',0)');
    ctx.beginPath();
    ctx.strokeStyle=gd;
    ctx.lineWidth=1.2;
    ctx.moveTo(ss.x,ss.y);
    ctx.lineTo(ss.x-ss.vx*(ss.len/8),ss.y-ss.vy*(ss.len/8));
    ctx.stroke();
    ss.x+=ss.vx;
    ss.y+=ss.vy;
    ss.a-=0.012;
    alive.push(ss);
  });
  shoots=alive;

  // Edges
  edges.forEach(e=>{
    var a=stars[e.i],b=stars[e.j];
    var pulse=0.5+0.5*Math.sin(T*soul.pulse*1.3+e.i*0.6+e.j*0.3);
    var alpha=e.str*(0.14+pulse*0.16);
    var eg=ctx.createLinearGradient(a.x,a.y,b.x,b.y);
    eg.addColorStop(0,'rgba('+R+','+G+','+B+','+(alpha*0.8).toFixed(3)+')');
    eg.addColorStop(0.5,'rgba('+R+','+G+','+B+','+alpha.toFixed(3)+')');
    eg.addColorStop(1,'rgba('+R+','+G+','+B+','+(alpha*0.8).toFixed(3)+')');
    ctx.beginPath();
    ctx.strokeStyle=eg;
    ctx.lineWidth=0.7+e.str*1.1;
    ctx.moveTo(a.x,a.y);
    ctx.lineTo(b.x,b.y);
    ctx.stroke();
  });

  // Regular stars
  stars.forEach((s,idx)=>{
    var tw=0.6+0.4*Math.sin(T*soul.pulse*1.2*s.spd+s.ph);
    var baseR=1.8+s.mag*3;
    var glowR=baseR*(2.6+tw*1.8);

    if(s.selected){
      var selGlow=ctx.createRadialGradient(s.x,s.y,0,s.x,s.y,glowR*4);
      selGlow.addColorStop(0,'rgba(255,255,255,0.4)');
      selGlow.addColorStop(1,'rgba(255,255,255,0)');
      ctx.fillStyle=selGlow;
      ctx.beginPath();
      ctx.arc(s.x,s.y,glowR*4,0,Math.PI*2);
      ctx.fill();

      stars.forEach((os,oidx)=>{
        if(os.selected&&oidx!==idx){
          ctx.beginPath();
          ctx.strokeStyle='rgba(255,255,255,0.12)';
          ctx.lineWidth=0.6;
          ctx.moveTo(s.x,s.y);
          ctx.lineTo(os.x,os.y);
          ctx.stroke();
        }
      });
    }

    var h1=ctx.createRadialGradient(s.x,s.y,0,s.x,s.y,glowR*2.2);
    h1.addColorStop(0,'rgba('+R+','+G+','+B+','+(0.09*tw).toFixed(3)+')');
    h1.addColorStop(1,'rgba('+R+','+G+','+B+',0)');
    ctx.fillStyle=h1;
    ctx.beginPath();
    ctx.arc(s.x,s.y,glowR*2.2,0,Math.PI*2);
    ctx.fill();

    var h2=ctx.createRadialGradient(s.x,s.y,0,s.x,s.y,glowR);
    h2.addColorStop(0,'rgba(255,255,255,'+(0.92*tw).toFixed(2)+')');
    h2.addColorStop(0.22,'rgba('+R+','+G+','+B+','+(0.72*tw).toFixed(2)+')');
    h2.addColorStop(1,'rgba('+R+','+G+','+B+',0)');
    ctx.fillStyle=h2;
    ctx.beginPath();
    ctx.arc(s.x,s.y,glowR,0,Math.PI*2);
    ctx.fill();

    ctx.beginPath();
    ctx.arc(s.x,s.y,baseR,0,Math.PI*2);
    ctx.fillStyle='rgba(255,255,255,'+(0.96*tw).toFixed(2)+')';
    ctx.fill();

    if(s.mag>0.55){
      var sl=glowR*1.7;
      [[1,0],[0,1],[-1,0],[0,-1]].forEach(([dx,dy])=>{
        var sg=ctx.createLinearGradient(s.x,s.y,s.x+dx*sl,s.y+dy*sl);
        sg.addColorStop(0,'rgba('+R+','+G+','+B+','+(0.18*tw).toFixed(2)+')');
        sg.addColorStop(1,'rgba('+R+','+G+','+B+',0)');
        ctx.beginPath();
        ctx.strokeStyle=sg;
        ctx.lineWidth=0.7;
        ctx.moveTo(s.x,s.y);
        ctx.lineTo(s.x+dx*sl,s.y+dy*sl);
        ctx.stroke();
      });
    }
  });

  updateWordLabels();
}

function drawUserConstellation(){
  if(!userConstellation)return;

  var seedStr=userConstellation.words.map(w=>w.word).join('|')+userConstellation.forgeTime;
  var seed=0;
  for(var i=0;i<seedStr.length;i++)seed=((seed<<5)-seed)+seedStr.charCodeAt(i);
  seed=Math.abs(seed);
  var rng=mkRng(seed);

  var cx=W*0.5,cy=H*0.5;
  var rad=getAdaptiveRadius(W,H,userConstellation.words.length);

  var positions=userConstellation.words.map((word,idx)=>{
    var persona=SOULS[word.sourceSoul];
    var r=rng(),r2=rng(),r3=rng(),r4=rng();
    var x,y,depth=0;

    if(persona.shape==='radial'){
      var angle=r*Math.PI*2;
      var certainty=word.depth||(0.3+r2*0.7);
      var dist=(1-certainty)*rad*(0.25+r3*0.75);
      x=cx+Math.cos(angle)*dist;
      y=cy+Math.sin(angle)*dist;
      depth=certainty;
    }else if(persona.shape==='grid'){
      var verify=r,risk=r2;
      var cols=4,rows=3;
      var step=rad*2.4/Math.max(cols,rows);
      var gx=Math.floor(verify*cols);
      var gy=Math.floor(risk*rows);
      x=cx-rad*1.2+gx*step+(r3-0.5)*step*0.6;
      y=cy-rad*0.8+gy*step+(r4-0.5)*step*0.6;
      depth=verify*(1-risk*0.5);
    }else if(persona.shape==='organic'){
      var cluster=Math.floor(r*3);
      var cAng=(cluster/3)*Math.PI*2+r2*1.0;
      var cDist=rad*(0.3+r3*0.5);
      x=cx+Math.cos(cAng)*cDist+(r4-0.5)*rad*0.4;
      y=cy+Math.sin(cAng)*cDist+(rng()-0.5)*rad*0.4;
      depth=0.3+r3*0.7;
    }else{
      var ring=Math.floor(r*3);
      var ringR=(ring+1)*(rad/3.2);
      var seats=[4,7,10][ring]||5;
      var seat=Math.floor(r2*seats);
      var angOffset=(ring%2)*Math.PI/seats;
      var ang2=(seat/seats)*Math.PI*2+angOffset+r3*0.4;
      x=cx+Math.cos(ang2)*ringR+(r4-0.5)*rad*0.1;
      y=cy+Math.sin(ang2)*ringR+(rng()-0.5)*rad*0.1;
      depth=1-(ring/3)*0.6;
    }

    var margin=70;
    x=Math.max(margin,Math.min(W-margin,x));
    y=Math.max(margin+90,Math.min(H-margin-90,y));

    return{
      x:x,y:y,
      word:word.word,
      rgb:persona.rgb,
      depth:depth,
      shape:persona.shape
    };
  });

  var edges=[];
  var thresh=rad*0.5;
  for(var i=0;i<positions.length;i++){
    for(var j=i+1;j<positions.length;j++){
      var dx=positions[i].x-positions[j].x;
      var dy=positions[i].y-positions[j].y;
      var d=Math.sqrt(dx*dx+dy*dy);
      if(d<thresh)edges.push({i:i,j:j,str:1-d/thresh});
    }
  }

  var nr=rad*0.6;
  var ng=ctx.createRadialGradient(cx,cy,0,cx,cy,nr);
  ng.addColorStop(0,'rgba(255,255,255,0.08)');
  ng.addColorStop(1,'rgba(255,255,255,0)');
  ctx.fillStyle=ng;
  ctx.fillRect(0,0,W,H);

  edges.forEach(e=>{
    var a=positions[e.i],b=positions[e.j];
    var eg=ctx.createLinearGradient(a.x,a.y,b.x,b.y);
    eg.addColorStop(0,'rgba('+a.rgb.join(',')+','+(e.str*0.4).toFixed(2)+')');
    eg.addColorStop(0.5,'rgba(255,255,255,'+(e.str*0.25).toFixed(2)+')');
    eg.addColorStop(1,'rgba('+b.rgb.join(',')+','+(e.str*0.4).toFixed(2)+')');
    ctx.beginPath();
    ctx.strokeStyle=eg;
    ctx.lineWidth=0.7+e.str*1.3;
    ctx.moveTo(a.x,a.y);
    ctx.lineTo(b.x,b.y);
    ctx.stroke();
  });

  positions.forEach((pos,idx)=>{
    var pulse=0.55+0.45*Math.sin(T*0.35+idx);
    var baseR=2.2+pos.depth*4;
    var glowR=baseR*(2.8+pulse*2.2);

    var g1=ctx.createRadialGradient(pos.x,pos.y,0,pos.x,pos.y,glowR*2.8);
    g1.addColorStop(0,'rgba('+pos.rgb.join(',')+',0.28)');
    g1.addColorStop(1,'rgba('+pos.rgb.join(',')+',0)');
    ctx.fillStyle=g1;
    ctx.beginPath();
    ctx.arc(pos.x,pos.y,glowR*2.8,0,Math.PI*2);
    ctx.fill();

    var g2=ctx.createRadialGradient(pos.x,pos.y,0,pos.x,pos.y,glowR);
    g2.addColorStop(0,'rgba(255,255,255,0.92)');
    g2.addColorStop(0.28,'rgba('+pos.rgb.join(',')+',0.72)');
    g2.addColorStop(1,'rgba('+pos.rgb.join(',')+',0)');
    ctx.fillStyle=g2;
    ctx.beginPath();
    ctx.arc(pos.x,pos.y,glowR,0,Math.PI*2);
    ctx.fill();

    ctx.beginPath();
    ctx.arc(pos.x,pos.y,baseR,0,Math.PI*2);
    ctx.fillStyle='#fff';
    ctx.fill();
  });
}

window.pick=function(i){
  soulIdx=i;

  // Update orbit persona active states
  document.querySelectorAll('.orbit-persona').forEach((el,idx)=>{
    el.classList.toggle('active',idx===i);
  });

  // Show/hide user mini tab
  document.getElementById('user-tab-mini').style.display=(i===4)?'flex':'none';

  // Hide all word labels when viewing user constellation
  document.querySelectorAll('.word-label').forEach(el=>el.style.display=(i===4)?'none':'');

  rebuild();
};

function handleTap(e){
  var rect=cv.getBoundingClientRect();
  var clientX=e.clientX||e.touches[0].clientX;
  var clientY=e.clientY||e.touches[0].clientY;
  var x=clientX-rect.left;
  var y=clientY-rect.top;

  if(soulIdx===4)return;

  var clicked=stars.find(s=>Math.hypot(s.x-x,s.y-y)<38);
  if(clicked)toggleWord(clicked);
}

cv.addEventListener('mousedown',handleTap);
cv.addEventListener('touchstart',handleTap,{passive:false});

function toggleWord(star){
  var existing=selectedWords.findIndex(sw=>sw.word===star.word&&sw.sourceSoul===soulIdx);
  if(existing>-1){
    selectedWords.splice(existing,1);
    star.selected=false;
  }else{
    selectedWords.push({
      word:star.word,
      x:star.x,
      y:star.y,
      color:SOULS[soulIdx].rgb,
      sourceSoul:soulIdx,
      depth:star.depth,
      geometry:SOULS[soulIdx].shape
    });
    star.selected=true;
    if(star.el){
      star.el.style.transform='translate(-50%,-100%) scale(1.3)';
      setTimeout(()=>star.el.style.transform='',200);
    }
  }
  updateSentence();
  updateWordLabels();
}

function updateSentence(){
  var container=document.getElementById('sentence');
  if(selectedWords.length===0){
    container.innerHTML='<span id="empty-state">Tap stars to build your constellation...</span>';
    document.getElementById('forge-btn').disabled=true;
    return;
  }
  container.innerHTML='';
  selectedWords.forEach((w,i)=>{
    var pill=document.createElement('span');
    pill.className='word-pill';
    pill.innerHTML=w.word+'<span class="remove" onclick="removeWord('+i+',event)">×</span>';
    pill.style.borderColor='rgba('+w.color.join(',')+',0.7)';
    pill.style.color='rgb('+w.color.join(',')+')';
    container.appendChild(pill);
  });
  document.getElementById('forge-btn').disabled=selectedWords.length<2;
}

window.removeWord=function(index,e){
  e.stopPropagation();
  var removed=selectedWords[index];
  selectedWords.splice(index,1);
  if(soulIdx===removed.sourceSoul){
    var star=stars.find(s=>s.word===removed.word);
    if(star){
      star.selected=false;
      updateWordLabels();
    }
  }
  updateSentence();
};

window.clearSentence=function(){
  selectedWords.forEach(sw=>{
    var personaKey=getPersonaKey(sw.sourceSoul);
    var star=stars.find(s=>s.word===sw.word&&s.geometry===SOULS[sw.sourceSoul].shape);
    if(star)star.selected=false;
  });
  selectedWords=[];
  updateWordLabels();
  updateSentence();
};

window.forgeConstellation=function(){
  if(selectedWords.length<2)return;

  userConstellation={
    name:'Your Soul',
    desc:'Forged from '+selectedWords.length+' words across '+new Set(selectedWords.map(w=>w.sourceSoul)).size+' personas.',
    words:selectedWords,
    forgeTime:Date.now(),
    rgb:[255,255,255]
  };

  SOULS[4]=userConstellation;

  // Compute same seed used in drawUserConstellation
  var seedStr=selectedWords.map(w=>w.word).join('|')+userConstellation.forgeTime;
  var seed=0;
  for(var i=0;i<seedStr.length;i++)seed=((seed<<5)-seed)+seedStr.charCodeAt(i);
  seed=Math.abs(seed);
  var seedHex=seed.toString(16).toUpperCase().slice(0,10);
  var wordList=selectedWords.map(w=>w.word).join(', ');
  var query=encodeURIComponent('I forged an Axium Soul Constellation with seed '+seedHex+'. My constellation words: '+wordList+'. What does this constellation reveal about my soul?');

  document.getElementById('grok-btn').href='https://x.com/i/grok?text='+query;
  document.getElementById('google-btn').href='https://www.google.com/search?udm=50&aep=11&q='+query;
  document.getElementById('claude-btn').href='https://claude.ai/new?q='+query;
  document.getElementById('perplexity-btn').href='https://www.perplexity.ai/search/new?q='+query;
  document.getElementById('chatgpt-btn').href='https://chatgpt.com/?prompt='+query;

  document.getElementById('copy-seed-btn').dataset.seed=seedHex;
  document.getElementById('copy-seed-text').textContent='SEED: '+seedHex;
  document.getElementById('seed-share-bar').style.display='flex';

  document.getElementById('user-tab-mini').style.display='flex';
  document.getElementById('toast').classList.add('show');
  setTimeout(()=>document.getElementById('toast').classList.remove('show'),2500);

  pick(4);
};

window.copySeed=function(){
  var btn=document.getElementById('copy-seed-btn');
  var seed=btn.dataset.seed||'';
  navigator.clipboard.writeText(seed).then(function(){
    var label=document.getElementById('copy-seed-text');
    label.textContent='COPIED!';
    setTimeout(()=>label.textContent='SEED: '+seed,1800);
  }).catch(function(){
    // fallback for older browsers
    var ta=document.createElement('textarea');
    ta.value=seed;
    ta.style.position='fixed';ta.style.opacity='0';
    document.body.appendChild(ta);ta.select();
    document.execCommand('copy');
    document.body.removeChild(ta);
    var label=document.getElementById('copy-seed-text');
    label.textContent='COPIED!';
    setTimeout(()=>label.textContent='SEED: '+seed,1800);
  });
};

// Spark burst effect for center button
function burst(buttonEl,count){
  const rect=buttonEl.getBoundingClientRect();
  const cx=rect.left+rect.width/2;
  const cy=rect.top+rect.height/2;

  for(let i=0;i<count;i++){
    const s=document.createElement('div');
    s.className='spark';
    const angle=Math.random()*Math.PI*2;
    const dist=28+Math.random()*60;
    s.style.setProperty('--tx',`translate(${Math.cos(angle)*dist}px,${Math.sin(angle)*dist}px)`);
    const sz=Math.random()*3+1;
    s.style.width=sz+'px';
    s.style.height=sz+'px';
    s.style.left=cx-sz/2+'px';
    s.style.top=cy-sz/2+'px';
    s.style.animationDelay=Math.random()*180+'ms';
    document.body.appendChild(s);
    setTimeout(()=>s.remove(),900);
  }
}

// Attach spark effects to center button
const centerBtn=document.getElementById('center-btn');
centerBtn.addEventListener('mouseenter',()=>burst(centerBtn,10));
centerBtn.addEventListener('click',()=>burst(centerBtn,22));

// Seed verification and unlocking
function generateChecksum(word,date,streak,guardian){
  var str=word+'|'+date+'|'+streak+'|'+guardian+'|AXIUM-2026';
  var hash=0;
  for(var i=0;i<str.length;i++){
    var char=str.charCodeAt(i);
    hash=((hash<<5)-hash)+char;
    hash=hash&hash;
  }
  return Math.abs(hash).toString(16).toUpperCase().slice(0,6);
}

function getGuardianFromWord(word){
  for(var persona in WORD_MATRIX){
    var allWords=getAllWords(persona);
    if(allWords.includes(word))return persona;
  }
  return null;
}

window.unlockFromSeed=function(){
  var input=document.getElementById('seed-input').value.trim();
  var statusEl=document.getElementById('seed-status');

  if(!input){
    statusEl.textContent='Please paste a seal';
    statusEl.style.color='rgba(212,175,55,0.5)';
    return;
  }

  var parts=input.split('|');
  if(parts.length!==4){
    statusEl.textContent='Invalid seal format. Expected: WORD|YYYY-MM-DD|STREAK|CHECKSUM';
    statusEl.style.color='#c45';
    return;
  }

  var [word,date,streakStr,checksum]=parts;
  word=word.toUpperCase();

  var guardian=getGuardianFromWord(word);
  if(!guardian){
    statusEl.textContent='Unknown word: '+word;
    statusEl.style.color='#c45';
    return;
  }

  if(!/^\d{4}-\d{2}-\d{2}$/.test(date)){
    statusEl.textContent='Invalid date format';
    statusEl.style.color='#c45';
    return;
  }

  var expectedChecksum=generateChecksum(word,date,parseInt(streakStr)||0,guardian);
  if(checksum!==expectedChecksum){
    statusEl.textContent='Invalid seal. Checksum mismatch.';
    statusEl.style.color='#c45';
    return;
  }

  if(unlockedWords[guardian]&&unlockedWords[guardian].includes(word)){
    statusEl.textContent='"'+word+'" is already unlocked';
    statusEl.style.color='rgba(212,175,55,0.6)';
    return;
  }

  if(WORD_MATRIX[guardian].tier1.includes(word)){
    statusEl.textContent='"'+word+'" is already visible';
    statusEl.style.color='rgba(212,175,55,0.6)';
    return;
  }

  if(!unlockedWords[guardian])unlockedWords[guardian]=[];
  unlockedWords[guardian].push(word);
  saveUnlocked();

  statusEl.textContent='Unlocked: '+word+' ('+guardian+')';
  statusEl.style.color='#5c5';

  document.getElementById('seed-input').value='';

  if(soulIdx<4&&getPersonaKey(soulIdx)===guardian){
    rebuild();
  }
};

loadUnlocked();
resize();
draw();
